<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jelly Wheel Nav</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.12);
            --island-w: 220px;
            --island-h: 64px;
            --wheel-r: 250px; /* Радиус изгиба */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* --- NAVIGATION --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: var(--island-w);
            height: var(--island-h);
            z-index: 1000;
            /* Мармеладная анимация: быстрая, но с отскоком */
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Состояние дуги */
        .nav-wrapper.active-wheel {
            width: 320px;
            height: 120px;
            bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .nav-bg {
            position: absolute;
            inset: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: inherit;
        }

        .nav-wrapper.active-wheel .nav-bg {
            border-radius: 60px 60px 40px 40px;
            transform: scaleY(1.1);
        }

        .blob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            background: var(--tg-accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .nav-wrapper.active-wheel .blob {
            top: 20px;
            width: 56px;
            height: 56px;
        }

        .icons-container {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 12px;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .nav-item {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item img, .pfp-mini {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.4;
            transition: all 0.3s ease;
        }

        .nav-item.active img, .nav-item.active .pfp-mini {
            opacity: 1;
            transform: scale(1.15);
        }

        .pfp-mini { border-radius: 50%; background-size: cover; filter: grayscale(1); }
        .nav-item.active .pfp-mini { filter: none; }

        /* Логика изгиба иконок */
        .nav-wrapper.active-wheel .nav-item {
            position: absolute;
            top: 20px;
            left: 50%;
            margin-left: -25px;
            /* Вращаем вокруг точки ниже панели */
            transform-origin: center var(--wheel-r);
        }
    </style>
</head>
<body>

    <div class="nav-wrapper" id="navMain">
        <div class="nav-bg"></div>
        <div class="blob" id="blob"></div>
        <div class="icons-container" id="iconsWrap">
            <div class="nav-item active" id="tab-0" onclick="tapTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" id="tab-1" onclick="tapTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" id="tab-2" onclick="tapTab(2)">
                <div class="pfp-mini" id="nav-pfp" style="background-color: #444;"></div>
            </div>
            <div class="nav-item" id="tab-3" onclick="tapTab(3)">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png">
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const nav = document.getElementById('navMain');
        const wrap = document.getElementById('iconsWrap');
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        
        let currentIndex = 0;
        let isWheel = false;
        let pressTimer;
        let startX = 0;
        let currentRot = 0;
        const step = 28; // Градус между иконками

        if (tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        nav.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            pressTimer = setTimeout(activate, 300);
        });

        window.addEventListener('touchmove', (e) => {
            if (isWheel) {
                let diff = (e.touches[0].clientX - startX) * 0.25;
                let targetRot = diff - (currentIndex * step);
                
                // Ограничители (крайние точки)
                const maxRot = 0;
                const minRot = -(items.length - 1) * step;
                
                // Плавная блокировка
                if (targetRot > maxRot) targetRot = maxRot;
                if (targetRot < minRot) targetRot = minRot;

                currentRot = targetRot;
                wrap.style.transform = `rotate(${currentRot}deg)`;

                const nearest = Math.max(0, Math.min(items.length - 1, Math.round(-currentRot / step)));
                if (nearest !== currentIndex) {
                    currentIndex = nearest;
                    updateItems(currentIndex);
                    tg.HapticFeedback.selectionChanged();
                }
            } else {
                if (Math.abs(e.touches[0].clientX - startX) > 10) clearTimeout(pressTimer);
            }
        });

        window.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
            if (isWheel) deactivate();
        });

        function activate() {
            isWheel = true;
            nav.classList.add('active-wheel');
            tg.HapticFeedback.notificationOccurred('warning'); // Мягкий вибро-отклик

            items.forEach((item, i) => {
                item.style.transform = `rotate(${i * step}deg)`;
            });

            currentRot = -currentIndex * step;
            wrap.style.transform = `rotate(${currentRot}deg)`;
            blob.style.left = '50%';
        }

        function deactivate() {
            isWheel = false;
            nav.classList.remove('active-wheel');
            
            items.forEach(item => item.style.transform = `rotate(0deg)`);
            wrap.style.transform = `rotate(0deg)`;
            
            setTimeout(() => {
                if (!isWheel) repositionBlob(currentIndex);
            }, 50);
        }

        function tapTab(i) {
            if (!isWheel) {
                currentIndex = i;
                repositionBlob(i);
                updateItems(i);
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function repositionBlob(i) {
            const item = items[i];
            const x = item.offsetLeft + (item.offsetWidth / 2);
            blob.style.left = `${x}px`;
        }

        function updateItems(idx) {
            items.forEach((item, i) => item.classList.toggle('active', i === idx));
        }

        window.onload = () => repositionBlob(0);
    </script>
</body>
</html>
