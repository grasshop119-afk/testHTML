<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Lens Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.95);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-bg-hover: rgba(255, 255, 255, 0.03);
            --pill-border-moving: rgba(255, 255, 255, 0.35); 
            /* Параметры линзы */
            --lens-distort: 15px; /* Сила искажения по краям */
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            display: flex;
            justify-content: center;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-radius: 38px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            justify-content: space-around;
            /* Важно для работы SVG фильтра */
            filter: url(#liquid-lens-filter);
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
        }

        /* Эффект окрашивания на части иконки */
        .icon-and-text-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Смешивание цветов */
            mix-blend-mode: plus-lighter; 
        }

        /* Слой с неактивным серым цветом */
        .inactive-layer {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Слой с активным синим цветом, который проявляется линзой */
        .active-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Прячем, пока не наедет линза */
            -webkit-mask-image: var(--lens-mask);
            mask-image: var(--lens-mask);
            -webkit-mask-size: 0 0;
            mask-size: 0 0;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
        }

        /* Цвета для неактивного слоя */
        .inactive-layer .icon-wrapper { background-color: var(--inactive-color); }
        .inactive-layer .tab-text { color: var(--inactive-color); }

        /* Цвета для активного слоя */
        .active-layer .icon-wrapper { background-color: var(--active-accent); }
        .active-layer .tab-text { color: var(--active-accent); }


        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg-hover);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            box-sizing: border-box;
            border: 1px solid transparent;
            will-change: transform, left, width, background-color, border-color, filter;
            transition: background-color 0.16s ease, border-color 0.16s ease;
            
            /* Хроматическая аберрация по краям линзы */
            filter: drop-shadow(2px 0 0px rgba(255, 0, 0, 0)) drop-shadow(-2px 0 0px rgba(0, 0, 255, 0));
        }

        /* Состояние полета: контур + аберрация */
        .liquid-slider.flying {
            background-color: transparent !important; 
            border-color: var(--pill-border-moving);
            filter: drop-shadow(2px 0 1px rgba(255, 0, 0, 0.3)) drop-shadow(-2px 0 1px rgba(0, 0, 255, 0.3));
        }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="liquid-lens-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="distort" id="lensDisplacementMap" />
      <feComposite in="distort" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="0" k4="0" />
    </filter>
  </defs>
</svg>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-and-text-container">
                <div class="inactive-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
                    <span class="tab-text">Главная</span>
                </div>
                <div class="active-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
                    <span class="tab-text">Главная</span>
                </div>
            </div>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-and-text-container">
                <div class="inactive-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
                    <span class="tab-text">Меню</span>
                </div>
                <div class="active-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
                    <span class="tab-text">Меню</span>
                </div>
            </div>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-and-text-container">
                <div class="inactive-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
                    <span class="tab-text">Настройки</span>
                </div>
                <div class="active-layer">
                    <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
                    <span class="tab-text">Настройки</span>
                </div>
            </div>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },    
        scale: { k: 420, d: 24, m: 1 }   
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');
    const tabBar = document.getElementById('tabBar');
    const displacementMap = document.getElementById('lensDisplacementMap');
    const activeLayers = document.querySelectorAll('.active-layer');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        intensity: 1,
        currentIndex: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function updateEffects() {
        const vel = Math.abs(state.vx);
        const style = getComputedStyle(document.documentElement);
        
        // 1 & 2: Искажение линзы по краям (Френель)
        const distortIntensity = Math.min(parseInt(style.getPropertyValue('--lens-distort')), vel / 80);
        displacementMap.setAttribute('scale', distortIntensity);

        // 3: Динамическое окрашивание части иконки
        // Мы используем позицию и размер слайдера для создания CSS маски
        const maskURL = `radial-gradient(ellipse ${state.w/2}px ${state.sy * state.w/2.5}px at ${state.x + state.w/2}px center, black 0%, black 80%, transparent 100%)`;
        
        activeLayers.forEach(layer => {
            layer.style.maskImage = maskURL;
            layer.style.webkitMaskImage = maskURL;
            // Размер маски делаем больше родителя, чтобы покрыть иконку
            layer.style.maskSize = `${tabBar.offsetWidth * 1.5}px ${tabBar.offsetHeight * 2}px`;
            layer.style.webkitMaskSize = `${tabBar.offsetWidth * 1.5}px ${tabBar.offsetHeight * 2}px`;
            // Центрируем маску относительно таббара
            layer.style.maskPosition = `calc(50% - ${state.x}px) center`;
            layer.style.webkitMaskPosition = `calc(50% - ${state.x}px) center`;
        });
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        const vel = Math.abs(state.vx);

        if (state.isMoving) {
            if (dist > 15) { 
                slider.classList.add('flying');
                // Рост на дальних дистанциях +5%
                state.tsy = 1 + ((0.27) * state.intensity); 
                state.tsx = 1 - (0.10 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                slider.classList.remove('flying');
                state.tsy = 1 - (0.05 * state.intensity); 
                state.tsx = 1 + (0.08 * state.intensity); 
            } else {
                state.tsx = 1;
                state.tsy = 1;
                if (vel < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        // Обновляем позицию слайдера
        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        // Обновляем эффекты линзы и окрашивания
        updateEffects();

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - (state.currentIndex || 0));

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx;
            state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.6;
            state.isMoving = true;

            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));

    // Инициализация
    const initial = document.querySelector('.tab-item.active');
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
