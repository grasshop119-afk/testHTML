<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skinx — Apple Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --panel: #1C1C1E;
            --secondary: #2C2C2E;
            --accent: #0A84FF;
            --text: #ffffff;
            --sub-text: #8E8E93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Manrope', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }

        .round-btn {
            background: var(--secondary); border: none; color: white;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
        }
        .round-btn:active { transform: scale(0.9); opacity: 0.8; }

        /* VIEWPORT */
        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
        }

        .canvas-container {
            position: relative; border-radius: 12px; overflow: hidden;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #111 75%),
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 16px 16px;
            border: 1px solid #333;
        }

        canvas { display: block; image-rendering: pixelated; touch-action: none; }

        /* PALETTE (5 Colors) */
        .palette {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 15px;
        }

        .color-opt {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
            transition: 0.2s; position: relative;
        }
        .color-opt.active { border-color: white; transform: scale(1.1); }
        
        #customPicker {
            position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer;
        }

        /* TOOLBAR */
        .toolbar {
            background: var(--panel); margin: 0 20px 15px; padding: 6px;
            border-radius: 30px; display: flex; justify-content: space-around;
        }

        .tool-icon {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: transparent; color: var(--sub-text);
            display: flex; align-items: center; justify-content: center;
        }
        .tool-icon.active { background: var(--secondary); color: white; }

        /* SLIDING SELECTORS */
        .shelf {
            background: var(--panel); padding: 15px 15px calc(30px + env(safe-area-inset-bottom));
            border-radius: 30px 30px 0 0;
        }

        .sliding-nav {
            position: relative; display: flex; background: var(--secondary);
            border-radius: 12px; padding: 2px; margin-bottom: 15px; overflow: hidden;
        }

        .nav-item {
            flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 700;
            z-index: 2; color: var(--sub-text); transition: color 0.3s;
        }
        .nav-item.active { color: #000; }

        .indicator {
            position: absolute; top: 2px; left: 2px; bottom: 2px;
            background: white; border-radius: 10px; z-index: 1;
            transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1), width 0.3s;
        }

        .label { font-size: 11px; color: #555; font-weight: 800; margin-bottom: 6px; margin-left: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SKINX</div>
        <div style="display: flex; gap: 10px;">
            <button class="round-btn" id="undoBtn"><i data-lucide="undo-2" size="18"></i></button>
            <button class="round-btn" style="background: var(--accent);"><i data-lucide="chevron-right" size="20"></i></button>
        </div>
    </header>

    <div id="viewport">
        <div class="canvas-container">
            <canvas id="editor"></canvas>
        </div>
    </div>

    <div class="palette" id="palette">
        <div class="color-opt active" style="background: #FF3B30;" data-hex="#FF3B30"></div>
        <div class="color-opt" style="background: #4CD964;" data-hex="#4CD964"></div>
        <div class="color-opt" style="background: #007AFF;" data-hex="#007AFF"></div>
        <div class="color-opt" style="background: #FFCC00;" data-hex="#FFCC00"></div>
        <div class="color-opt" style="background: #8E8E93;" id="lastColor">
            <input type="color" id="customPicker">
            <i data-lucide="plus" size="14" style="color:white; position:absolute; top:7px; left:7px; pointer-events:none;"></i>
        </div>
    </div>

    <div class="toolbar">
        <button class="tool-icon active" data-t="pen"><i data-lucide="pencil"></i></button>
        <button class="tool-icon" data-t="fill"><i data-lucide="paint-bucket"></i></button>
        <button class="tool-icon" data-t="eraser"><i data-lucide="eraser"></i></button>
        <button class="tool-icon" data-t="pipette"><i data-lucide="pipette"></i></button>
    </div>

    <div class="shelf">
        <div class="label">ОБЛАСТЬ</div>
        <div class="sliding-nav" id="partNav">
            <div class="indicator" id="partInd"></div>
            <div class="nav-item active" data-v="head">Голова</div>
            <div class="nav-item" data-v="body">Тело</div>
            <div class="nav-item" data-v="arm_r">Рука</div>
            <div class="nav-item" data-v="leg_r">Нога</div>
        </div>

        <div class="label">СТОРОНА</div>
        <div class="sliding-nav" id="sideNav">
            <div class="indicator" id="sideInd"></div>
            <div class="nav-item active" data-v="front">Перед</div>
            <div class="nav-item" data-v="back">Зад</div>
            <div class="nav-item" data-v="top">Верх</div>
            <div class="nav-item" data-v="bottom">Низ</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setParams({ text: 'СОХРАНИТЬ СКИН', color: '#ffffff', text_color: '#000000', is_visible: true });

        lucide.createIcons();

        const UV = {
            head: { s: [8,8], front:[8,8], back:[24,8], top:[8,0], bottom:[16,0] },
            body: { s: [8,12], front:[20,20], back:[32,20], top:[20,16], bottom:[28,16] },
            arm_r: { s: [4,12], front:[44,20], back:[52,20], top:[44,16], bottom:[48,16] },
            leg_r: { s: [4,12], front:[4,20], back:[12,20], top:[4,16], bottom:[8,16] }
        };

        let state = {
            part: 'head', side: 'front', tool: 'pen', color: '#FF3B30',
            master: document.createElement('canvas'),
            undoStack: []
        };
        state.master.width = 64; state.master.height = 64;
        const mctx = state.master.getContext('2d');

        const canvas = document.getElementById('editor');
        const ctx = canvas.getContext('2d');

        function update() {
            const conf = UV[state.part];
            canvas.width = conf.s[0]; canvas.height = conf.s[1];
            const size = 260;
            canvas.style.width = (canvas.width >= canvas.height ? size : size * (canvas.width/canvas.height)) + "px";
            canvas.style.height = (canvas.height > canvas.width ? size : size * (canvas.height/canvas.width)) + "px";
            
            const p = conf[state.side];
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(state.master, p[0], p[1], canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
        }

        function saveStep() {
            state.undoStack.push(state.master.toDataURL());
            if(state.undoStack.length > 20) state.undoStack.shift();
            
            const p = UV[state.part][state.side];
            mctx.clearRect(p[0], p[1], canvas.width, canvas.height);
            mctx.drawImage(canvas, p[0], p[1]);
        }

        function undo() {
            if(state.undoStack.length === 0) return;
            const last = state.undoStack.pop();
            const img = new Image();
            img.onload = () => {
                mctx.clearRect(0,0,64,64);
                mctx.drawImage(img,0,0);
                update();
            };
            img.src = last;
            tg.HapticFeedback.impactOccurred('medium');
        }

        // --- ИНДИКАТОРЫ ---
        function moveInd(navId, indId) {
            const nav = document.getElementById(navId);
            const ind = document.getElementById(indId);
            const active = nav.querySelector('.active');
            ind.style.width = active.offsetWidth + "px";
            ind.style.transform = `translateX(${active.offsetLeft - 2}px)`;
        }

        // --- СОБЫТИЯ ---
        canvas.addEventListener('pointerdown', (e) => {
            state.drawing = true;
            saveStep();
            draw(e);
            tg.HapticFeedback.impactOccurred('light');
        });
        window.addEventListener('pointerup', () => state.drawing = false);
        canvas.addEventListener('pointermove', draw);

        function draw(e) {
            if(!state.drawing) return;
            const r = canvas.getBoundingClientRect();
            const x = Math.floor(((e.clientX || e.touches[0].clientX) - r.left) / (r.width / canvas.width));
            const y = Math.floor(((e.clientY || e.touches[0].clientY) - r.top) / (r.height / canvas.height));
            
            if(x>=0 && x<canvas.width && y>=0 && y<canvas.height) {
                if(state.tool==='pen') { ctx.fillStyle=state.color; ctx.fillRect(x,y,1,1); }
                else if(state.tool==='eraser') { ctx.clearRect(x,y,1,1); }
                const p = UV[state.part][state.side];
                mctx.clearRect(p[0], p[1], canvas.width, canvas.height);
                mctx.drawImage(canvas, p[0], p[1]);
            }
        }

        document.getElementById('partNav').onclick = (e) => {
            if(e.target.dataset.v) {
                document.querySelectorAll('#partNav .nav-item').forEach(n=>n.classList.remove('active'));
                e.target.classList.add('active');
                state.part = e.target.dataset.v;
                moveInd('partNav', 'partInd');
                update();
                tg.HapticFeedback.selectionChanged();
            }
        };

        document.getElementById('sideNav').onclick = (e) => {
            if(e.target.dataset.v) {
                document.querySelectorAll('#sideNav .nav-item').forEach(n=>n.classList.remove('active'));
                e.target.classList.add('active');
                state.side = e.target.dataset.v;
                moveInd('sideNav', 'sideInd');
                update();
                tg.HapticFeedback.selectionChanged();
            }
        };

        document.querySelectorAll('.tool-icon').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tool-icon').forEach(i=>i.classList.remove('active'));
                btn.classList.add('active');
                state.tool = btn.dataset.t;
                tg.HapticFeedback.impactOccurred('light');
            };
        });

        document.getElementById('palette').onclick = (e) => {
            if(e.target.dataset.hex) {
                document.querySelectorAll('.color-opt').forEach(c=>c.classList.remove('active'));
                e.target.classList.add('active');
                state.color = e.target.dataset.hex;
                tg.HapticFeedback.impactOccurred('light');
            }
        };

        document.getElementById('customPicker').oninput = (e) => {
            state.color = e.target.value;
            document.getElementById('lastColor').style.background = e.target.value;
            document.querySelectorAll('.color-opt').forEach(c=>c.classList.remove('active'));
            document.getElementById('lastColor').classList.add('active');
        };

        document.getElementById('undoBtn').onclick = undo;

        tg.MainButton.onClick(() => {
            const link = document.createElement('a');
            link.download = 'skin.png';
            link.href = state.master.toDataURL();
            link.click();
            tg.HapticFeedback.notificationOccurred('success');
        });

        window.onload = () => {
            update();
            moveInd('partNav', 'partInd');
            moveInd('sideNav', 'sideInd');
        };
    </script>
</body>
</html>
