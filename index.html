<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Logic Fix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-color: var(--tg-theme-accent-color, #f7a251);
            --bg-color: #000000;
            --menu-bg: #1c1c1e;
            /* Быстрый старт, очень плавный финиш */
            --bezier: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
        }

        .nav-container {
            width: 90%; 
            max-width: 400px;
            height: 66px;
            background-color: var(--menu-bg);
            border-radius: 40px;
            display: flex;
            position: relative;
            align-items: center;
            padding: 0 5px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .nav-sector {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        /* ПУЗЫРЬ: Строгие размеры */
        .active-bubble {
            position: absolute;
            width: 0; /* Будет задано в JS */
            height: 56px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 35px;
            top: 5px;
            left: 0;
            z-index: 1;
            will-change: transform, width, height, top;
            /* Плавность всех параметров */
            transition: transform 0.6s var(--bezier), 
                        width 0.4s var(--bezier), 
                        height 0.4s var(--bezier), 
                        top 0.4s var(--bezier);
        }

        /* Состояние в полете: ниже и шире */
        .is-moving {
            height: 40px;
            top: 13px;
            width: 40% !important; /* Немного раздувается */
        }

        /* Пружинка при остановке */
        @keyframes spring-bounce {
            0% { transform: scaleX(1.1) scaleY(0.8); }
            50% { transform: scaleX(0.9) scaleY(1.15); }
            100% { transform: scaleX(1) scaleY(1); }
        }

        .do-spring {
            animation: spring-bounce 0.45s ease-out;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            margin-bottom: 3px;
            transition: fill 0.4s ease;
        }

        .label {
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            font-family: -apple-system, system-ui;
            transition: color 0.4s ease;
        }

        .nav-sector.active .icon { fill: var(--accent-color); }
        .nav-sector.active .label { color: var(--accent-color); }

    </style>
</head>
<body>

    <div class="nav-container" id="navBar">
        <div class="active-bubble" id="bubble"></div>

        <div class="nav-sector active" onclick="move(0)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="label">Дом</span>
        </div>

        <div class="nav-sector" onclick="move(1)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            <span class="label">Избранное</span>
        </div>

        <div class="nav-sector" onclick="move(2)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span class="label">Меню</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const bubble = document.getElementById('bubble');
        const navBar = document.getElementById('navBar');
        const sectors = document.querySelectorAll('.nav-sector');
        
        let currentIndex = 0;

        function updateBubbleSize() {
            // Устанавливаем ширину пузыря = (ширина меню / 3) - 10px отступа
            const sectorWidth = navBar.offsetWidth / 3;
            bubble.style.width = `${sectorWidth - 10}px`;
        }

        function move(index) {
            if (index === currentIndex) return;
            
            const sectorWidth = navBar.offsetWidth / 3;
            const targetX = (index * sectorWidth) + 5; // +5 для центровки зазора

            // 1. Старт: включаем деформацию (шире/ниже)
            bubble.classList.add('is-moving');
            bubble.classList.remove('do-spring');

            // 2. Движение
            bubble.style.transform = `translateX(${targetX}px)`;

            // Вибрация в начале движения
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            // Переключение цветов
            sectors.forEach((s, i) => {
                s.classList.toggle('active', i === index);
            });

            // 3. Завершение
            setTimeout(() => {
                bubble.classList.remove('is-moving');
                bubble.classList.add('do-spring');
                
                // Финальная вибрация при "ударе"
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                
                currentIndex = index;
            }, 300); // Тайминг должен совпадать с моментом когда визуально пузырь на месте
        }

        window.addEventListener('resize', updateBubbleSize);
        window.onload = () => {
            updateBubbleSize();
            move(0); // Ставим на старт
        };

        window.oncontextmenu = (e) => e.preventDefault();
    </script>
</body>
</html>
