<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel — Creator</title>
    <style>
        /* Подключение оригинального шрифта Minecraft */
        @font-face {
            font-family: 'Minecraft';
            src: url('https://raw.githubusercontent.com/IdreesInc/Minecraft-Font/master/Minecraft.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #121212; /* Apple Dark Background */
            color: #FFFFFF;
            font-family: 'Minecraft', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        header {
            width: 100%;
            background-color: #242426; 
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2C2C2E;
        }

        .logo {
            font-size: 22px;
            letter-spacing: 2px;
        }

        .logo span {
            color: #FFD60A; /* Желтая A */
        }

        .tg-link img {
            width: 24px;
            filter: invert(1);
            image-rendering: pixelated;
        }

        /* Контент */
        .content {
            width: 100%;
            max-width: 480px; 
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Плашки */
        .card {
            background-color: #2C2C2E;
            height: 110px; /* Компактный прямоугольник */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding-left: 25px;
            transition: background 0.1s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #363638;
        }

        .card-text {
            position: relative;
            z-index: 10;
            width: 65%;
        }

        .card-text h2 {
            font-size: 22px; /* Увеличенный заголовок */
            margin-bottom: 4px;
            text-shadow: 2px 2px 0px #1e1e1e;
            color: #FFFFFF;
        }

        .card-text p {
            font-size: 10px;
            color: #8E8E93;
            max-width: 190px;
            font-family: 'Minecraft', sans-serif;
            opacity: 0.8;
        }

        /* Общие настройки для картинок */
        .card-img {
            position: absolute;
            z-index: 1;
            transform: rotate(-4deg); /* Минимальный наклон для стиля */
            image-rendering: pixelated;
        }

        .card-img img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* ТОЧЕЧНОЕ ПОЗИЦИОНИРОВАНИЕ */
        
        /* Скин: Огромный, правее и ниже всех */
        .skin-img {
            height: 160%;
            right: -25px;
            bottom: -50px;
        }

        /* Блок: Выше и правее */
        .block-img {
            height: 85%; 
            right: 0px; 
            top: 5px; /* Поднят выше */
        }

        /* Предмет (Item): Выше и левее (относительно своего угла) */
        .item-img {
            height: 115%;
            right: 20px; /* Левее от края */
            top: -10px;  /* Выше, уходит за верхний край немного */
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>PIXEL</div>
        <a href="https://t.me/pixel" target="_blank" class="tg-link">
            <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="tg">
        </a>
    </header>

    <div class="content">
        <div class="card">
            <div class="card-text">
                <h2>Создать скин</h2>
                <p>Измени свой стиль.</p>
            </div>
            <div class="card-img skin-img">
                <img src="Logos/skin.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать блок</h2>
                <p>Новые текстуры мира.</p>
            </div>
            <div class="card-img block-img">
                <img src="Logos/block.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать предмет</h2>
                <p>Крафт уникальных вещей.</p>
            </div>
            <div class="card-img item-img">
                <img src="Logos/item.PNG" alt="">
            </div>
        </div>
    </div>

</body>
</html>
