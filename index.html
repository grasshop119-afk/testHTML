<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel - Minecraft Creator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face {
            font-family: '00 Starmap';
            src: url('fonts/00-Starmap.ttf') format('truetype');
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container header-content">
            <div class="logo">
                <span class="letter-a">A</span>Pixel
            </div>
            <a href="https://t.me/your_link" class="tg-link">
                <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="Telegram">
            </a>
        </div>
    </header>

    <main class="container main-content">
        <section class="card">
            <div class="card-info">
                <h2 class="card-title">Создать скин</h2>
                <p class="card-desc">Персонализируйте своего персонажа уникальным дизайном.</p>
            </div>
            <div class="card-image">
                <img src="Logos/skin.png" alt="Skin">
            </div>
        </section>

        <section class="card">
            <div class="card-info">
                <h2 class="card-title">Создать блок</h2>
                <p class="card-desc">Разработайте новые текстуры для строительных элементов мира.</p>
            </div>
            <div class="card-image">
                <img src="Logos/block.png" alt="Block">
            </div>
        </section>

        <section class="card">
            <div class="card-info">
                <h2 class="card-title">Создать предмет</h2>
                <p class="card-desc">Добавьте в игру кастомные инструменты, оружие или ресурсы.</p>
            </div>
            <div class="card-image">
                <img src="Logos/item.png" alt="Item">
            </div>
        </section>
    </main>

</body>
</html>
