<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APixel - Entrance</title>
    
    <style>
        /* ПОДКЛЮЧЕНИЕ ТВОЕГО ШРИФТА */
        @font-face {
            font-family: 'FireballPixel';
            /* Предполагаем, что ты скачал его и положил в эту папку */
            src: url('Fonts/fireball_font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated; 
        }

        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'FireballPixel', sans-serif; /* Применяем новый шрифт */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ГЕРОЙ-ШАПКА --- */
        .home-banner {
            position: relative;
            width: 100%;
            height: 220px; 
            overflow: hidden;
            border-bottom: 2px solid #111;
        }

        .home-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-logo {
            position: absolute;
            right: 15px;
            bottom: 12px;
            font-size: 26px; /* Шрифт Fireball обычно выглядит крупнее */
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
        }
        .banner-logo span { color: #f3bc18; }

        /* --- КОНТЕНТ --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding-top: 20px;
        }

        /* --- КАРТОЧКИ --- */
        .card {
            position: relative;
            width: 90%;
            max-width: 380px;
            height: 105px; /* Еще чуть компактнее */
            background-color: #2b2b2b;
            border-top: 1px solid #3d3d3d;
            border-left: 1px solid #3d3d3d;
            border-bottom: 2px solid #111;
            border-right: 1px solid #111;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            overflow: visible; 
            transition: background 0.2s;
        }

        .card:active { background-color: #222; }

        .card-content {
            width: 68%;
            z-index: 2;
        }

        .card-title {
            font-size: 16px; 
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 10px;
            line-height: 1.2;
            color: #888;
        }

        .img-mask {
            position: absolute;
            top: -40px; 
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .card-img {
            position: absolute;
            z-index: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }

        /* Настройки позиций по твоему фидбеку */
        .img-skin {
            width: 115px;
            right: -10px;
            bottom: -60px; /* По пояс */
        }

        .img-block {
            width: 90px;
            right: 5px;
            bottom: 0px; /* Блок опущен ( Req 1 ) */
        }

        .img-item {
            width: 70px;
            right: 10px;
            bottom: -15px; /* Мелкий и низко */
        }

    </style>
</head>
<body>

    <div class="home-banner">
        <img src="Logos/HomePic.PNG" alt="Hero" class="home-pic">
        <div class="banner-logo"><span>A</span>PIXEL</div>
    </div>

    <main>
        <div class="card" onclick="location.href='skin_editor.html'">
            <div class="card-content">
                <div class="card-title">Create Skin</div>
                <div class="card-desc">Create your own Minecraft™ skin. You also can edit or choose skin from the list.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/skin.PNG" alt="Skin" class="card-img img-skin">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Block</div>
                <div class="card-desc">Design unique textures and properties for new in-game blocks. Real-time preview.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/block.PNG" alt="Block" class="card-img img-block">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Item</div>
                <div class="card-desc">Add custom weapons, tools, and rare artifacts to your world with ease.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/item.PNG" alt="Item" class="card-img img-item">
            </div>
        </div>
    </main>

</body>
</html>
