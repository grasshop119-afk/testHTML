<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild FAQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Применяем системные шрифты Apple */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Глубокий черный */
            color: #ffffff;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Контейнер приложения */
        .app-container {
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Шапка: FAQ и Аватар */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px; /* Тот самый скругленный квадрат */
            background-size: cover;
            background-position: center;
            border: 2px solid var(--tg-theme-button-color, #007AFF); /* Акцент из темы ТГ */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .user-avatar:active {
            transform: scale(0.9);
        }

        /* Поиск (креативная механика - легкий блюр) */
        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 17px;
        }

        /* Список плашек */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .faq-item {
            background: #1c1c1e; /* Цвет плашек в iOS Dark Theme */
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Эффект нажатия как в iOS */
        .faq-item:active {
            background: #2c2c2e;
        }

        .faq-item span {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        /* Шеврон справа */
        .chevron {
            width: 10px;
            height: 10px;
            border-top: 2px solid rgba(255, 255, 255, 0.6);
            border-right: 2px solid rgba(255, 255, 255, 0.6);
            transform: rotate(45deg);
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>FAQ</h1>
            <div id="user-pic" class="user-avatar"></div>
        </header>

        <div class="search-bar">
            <span>Поиск по гильдии...</span>
        </div>

        <div class="faq-list">
            <div class="faq-item" onclick="handleItemClick('Правила рейдов')">
                <span>Правила рейдов</span>
                <div class="chevron"></div>
            </div>
            <div class="faq-item" onclick="handleItemClick('Алфавит сокращений')">
                <span>Алфавит сокращений</span>
                <div class="chevron"></div>
            </div>
            <div class="faq-item" onclick="handleItemClick('Экономика и налоги')">
                <span>Экономика и налоги</span>
                <div class="chevron"></div>
            </div>
            <div class="faq-item" onclick="handleItemClick('Иерархия рангов')">
                <span>Иерархия рангов</span>
                <div class="chevron"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на всю высоту

        // Установка аватара пользователя из Telegram
        const userPic = document.getElementById('user-pic');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            if (user.photo_url) {
                userPic.style.backgroundImage = `url('${user.photo_url}')`;
            } else {
                // Заглушка, если фото нет
                userPic.style.backgroundColor = 'var(--tg-theme-button-color)';
            }
        }

        // Креативная механика: тактильная отдача (Haptic Feedback)
        function handleItemClick(name) {
            tg.HapticFeedback.impactOccurred('light');
            console.log("Выбрано:", name);
            // Здесь будет переход к контенту
        }

        // Сообщаем Telegram, что приложение готово
        tg.ready();
    </script>
</body>
</html>
