<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKINX PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #121212;
            --panel: #252525;
            --border: #3d3d3d;
            --text: #e0e0e0;
            --accent: #5c5c5c;
            --active: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            overflow: hidden;
            touch-action: none; /* Запрет скролла/зума страницы */
        }

        /* 3D Container */
        #viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Hidden Canvas */
        #sourceCanvas {
            display: none;
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel {
            background-color: var(--panel);
            border: 1px solid var(--border);
            pointer-events: auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg);
            pointer-events: auto;
        }

        .title {
            font-size: 10px;
            color: var(--active);
        }

        button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 8px;
            padding: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active {
            background: var(--accent);
            color: var(--active);
        }

        button.active {
            background: var(--text);
            color: var(--bg);
        }

        /* Sidebars */
        .workspace {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            padding: 8px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .vis-btn {
            width: 40px;
            height: 24px;
        }

        /* Color Picker */
        #colorPicker {
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border);
            background: none;
            cursor: pointer;
            pointer-events: auto;
        }
        #colorPicker::-webkit-color-swatch-wrapper { padding: 0; }
        #colorPicker::-webkit-color-swatch { border: none; }

        /* Bottom Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background-color: var(--panel);
            border-top: 1px solid var(--border);
            pointer-events: auto;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div id="viewport"></div>
    <canvas id="sourceCanvas" width="64" height="64"></canvas>

    <div id="ui">
        <header>
            <div class="title">SKINX PRO</div>
            <button id="btnLayer">LAYER: BASE</button>
            <button id="btnExport">EXPORT</button>
        </header>

        <div class="workspace">
            <div class="sidebar">
                <input type="color" id="colorPicker" value="#ff0000">
                <button class="tool-btn" id="btnShadeDown" onclick="setShading(-0.1)">-10%</button>
                <button class="tool-btn" id="btnShadeUp" onclick="setShading(0.1)">+10%</button>
            </div>

            <div class="sidebar panel" style="padding: 4px;">
                <div style="margin-bottom: 4px; text-align: center;">VIS</div>
                <button class="vis-btn active" onclick="togglePart('Head', this)">HD</button>
                <button class="vis-btn active" onclick="togglePart('Body', this)">BD</button>
                <button class="vis-btn active" onclick="togglePart('ArmR', this)">AR</button>
                <button class="vis-btn active" onclick="togglePart('ArmL', this)">AL</button>
                <button class="vis-btn active" onclick="togglePart('LegR', this)">LR</button>
                <button class="vis-btn active" onclick="togglePart('LegL', this)">LL</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="tool-btn active" onclick="setTool('pencil', this)">
                <svg viewBox="0 0 24 24"><path d="M14.06 9l.94.94L5.92 19H5v-.92L14.06 9m3.6-6c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.2-.2-.45-.29-.71-.29m-3.6 3.18L5.34 15H3v2.34l8.82 8.82 3.75-3.75z"/></svg>
            </button>
            <button class="tool-btn" onclick="setTool('eraser', this)">
                <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.42 20.4c.39.39.9.59 1.41.59s1.02-.2 1.41-.59l2.83-2.83h9.93v-2h-7.1l6.45-6.45c.78-.77.78-2.04 0-2.83l-2.83-2.83c-.39-.39-.9-.59-1.41-.59z"/></svg>
            </button>
            <button class="tool-btn" onclick="setTool('picker', this)">
                <svg viewBox="0 0 24 24"><path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/></svg>
            </button>
            <button class="tool-btn" onclick="setTool('fill', this)">
                <svg viewBox="0 0 24 24"><path d="M19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5zM12.96 5.29c-.39-.39-1.02-.39-1.41 0L5.3 11.54C4.65 12.19 5.11 13 6.03 13h4.63l-2.81 7.23c-.15.4.15.8.58.8h.01c.21 0 .4-.12.49-.31L13.1 11h4.87c.92 0 1.38-.81.73-1.46L12.96 5.29z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // === Инициализация Telegram WebApp ===
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // === Глобальные переменные ===
        let currentTool = 'pencil';
        let currentColor = '#ff0000';
        let shadingMultiplier = 1.0;
        let isOuterLayer = false;
        const parts = {};
        
        // 2D Canvas (Source of Truth)
        const canvas = document.getElementById('sourceCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // Инициализация базового цвета (прозрачный)
        ctx.clearRect(0, 0, 64, 64);

        // Обновление цвета
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            currentColor = e.target.value;
            if (currentTool === 'picker') setTool('pencil', document.querySelector('.toolbar button'));
        });

        // === Three.js Setup ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('viewport').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        // Ограничиваем OrbitControls
        controls.touches = { ONE: THREE.TOUCH.NONE, TWO: THREE.TOUCH.ROTATE };

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // === Texture Setup ===
        const texture = new THREE.CanvasTexture(canvas);
        texture.magFilter = THREE.NearestFilter; // Pixel-perfect
        texture.minFilter = THREE.NearestFilter;
        const material = new THREE.MeshStandardMaterial({ map: texture, transparent: true, alphaTest: 0.1 });

        // === Генерация частей тела и UV-маппинг ===
        function createPart(name, w, h, d, x, y, z, u, v, isOuter) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            
            // Настройка UV-развертки (Minecraft Standard)
            const faces = [
                { dir: 'right',  x: u,         y: v + d, w: d, h: h }, // 0
                { dir: 'left',   x: u + d + w, y: v + d, w: d, h: h }, // 1
                { dir: 'top',    x: u + d,     y: v,     w: w, h: d }, // 2
                { dir: 'bottom', x: u + d + w, y: v,     w: w, h: d }, // 3
                { dir: 'front',  x: u + d,     y: v + d, w: w, h: h }, // 4
                { dir: 'back',   x: u + d + w + d, y: v + d, w: w, h: h }  // 5
            ];

            const uvs = geometry.attributes.uv;
            for (let i = 0; i < 6; i++) {
                const f = faces[i];
                const u0 = f.x / 64;
                const v0 = 1.0 - (f.y / 64);
                const u1 = (f.x + f.w) / 64;
                const v1 = 1.0 - ((f.y + f.h) / 64);

                uvs.setXY(i * 4 + 0, u0, v0);
                uvs.setXY(i * 4 + 1, u0, v1);
                uvs.setXY(i * 4 + 2, u1, v0);
                uvs.setXY(i * 4 + 3, u1, v1);
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            if (isOuter) {
                mesh.scale.set(1.05, 1.05, 1.05);
                mesh.visible = false; // По умолчанию outer выключен
            }
            
            // Сохраняем данные для алгоритма заливки (Fill Tool)
            mesh.userData = { isOuter, faces };
            scene.add(mesh);
            return mesh;
        }

        // Base Layer (u, v)
        parts.Head_Base = createPart('Head', 8, 8, 8, 0, 12, 0, 0, 0, false);
        parts.Body_Base = createPart('Body', 8, 12, 4, 0, 2, 0, 16, 16, false);
        parts.ArmR_Base = createPart('ArmR', 4, 12, 4, -6, 2, 0, 40, 16, false);
        parts.ArmL_Base = createPart('ArmL', 4, 12, 4, 6, 2, 0, 32, 48, false);
        parts.LegR_Base = createPart('LegR', 4, 12, 4, -2, -10, 0, 0, 16, false);
        parts.LegL_Base = createPart('LegL', 4, 12, 4, 2, -10, 0, 16, 48, false);

        // Outer Layer (u, v)
        parts.Head_Outer = createPart('Head', 8, 8, 8, 0, 12, 0, 32, 0, true);
        parts.Body_Outer = createPart('Body', 8, 12, 4, 0, 2, 0, 16, 32, true);
        parts.ArmR_Outer = createPart('ArmR', 4, 12, 4, -6, 2, 0, 40, 32, true);
        parts.ArmL_Outer = createPart('ArmL', 4, 12, 4, 6, 2, 0, 48, 48, true);
        parts.LegR_Outer = createPart('LegR', 4, 12, 4, -2, -10, 0, 0, 32, true);
        parts.LegL_Outer = createPart('LegL', 4, 12, 4, 2, -10, 0, 0, 48, true);

        // === Логика инструментов ===
        function setTool(tool, btn) {
            currentTool = tool;
            document.querySelectorAll('.toolbar .tool-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function setShading(amount) {
            currentTool = 'shade';
            shadingMultiplier = 1.0 + amount;
            document.querySelectorAll('.toolbar .tool-btn').forEach(b => b.classList.remove('active'));
        }

        function togglePart(partName, btn) {
            btn.classList.toggle('active');
            const isVis = btn.classList.contains('active');
            parts[`${partName}_Base`].visible = isVis && !isOuterLayer;
            parts[`${partName}_Outer`].visible = isVis && isOuterLayer;
        }

        document.getElementById('btnLayer').addEventListener('click', function() {
            isOuterLayer = !isOuterLayer;
            this.innerText = isOuterLayer ? 'LAYER: OUTER' : 'LAYER: BASE';
            
            // Синхронизация видимости
            ['Head', 'Body', 'ArmR', 'ArmL', 'LegR', 'LegL'].forEach(part => {
                const btn = document.querySelector(`button[onclick="togglePart('${part}', this)"]`);
                const isVis = btn.classList.contains('active');
                parts[`${part}_Base`].visible = isVis && !isOuterLayer;
                parts[`${part}_Outer`].visible = isVis && isOuterLayer;
            });
        });

        // === Raycasting & Drawing ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b, 255];
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        function drawOnCanvas(uv, faceIndex, mesh) {
            const px = Math.floor(uv.x * 64);
            const py = Math.floor((1.0 - uv.y) * 64);

            if (currentTool === 'picker') {
                const imgData = ctx.getImageData(px, py, 1, 1).data;
                if (imgData[3] > 0) {
                    currentColor = rgbToHex(imgData[0], imgData[1], imgData[2]);
                    document.getElementById('colorPicker').value = currentColor;
                }
                return;
            }

            if (currentTool === 'pencil') {
                ctx.fillStyle = currentColor;
                ctx.fillRect(px, py, 1, 1);
            } 
            else if (currentTool === 'eraser') {
                ctx.clearRect(px, py, 1, 1);
            }
            else if (currentTool === 'shade') {
                const imgData = ctx.getImageData(px, py, 1, 1).data;
                if (imgData[3] > 0) {
                    const r = Math.min(255, Math.floor(imgData[0] * shadingMultiplier));
                    const g = Math.min(255, Math.floor(imgData[1] * shadingMultiplier));
                    const b = Math.min(255, Math.floor(imgData[2] * shadingMultiplier));
                    ctx.fillStyle = `rgba(${r},${g},${b},1)`;
                    ctx.fillRect(px, py, 1, 1);
                }
            }
            else if (currentTool === 'fill') {
                floodFill(px, py, faceIndex, mesh);
            }

            texture.needsUpdate = true;
        }

        function floodFill(startX, startY, faceIndex, mesh) {
            // Ограничиваем заливку конкретной плоскостью
            const sideIndex = Math.floor(faceIndex / 2);
            const faceBounds = mesh.userData.faces[sideIndex];
            
            const minX = faceBounds.x;
            const maxX = faceBounds.x + faceBounds.w - 1;
            const minY = faceBounds.y;
            const maxY = faceBounds.y + faceBounds.h - 1;

            if (startX < minX || startX > maxX || startY < minY || startY > maxY) return;

            const imgData = ctx.getImageData(0, 0, 64, 64);
            const data = imgData.data;
            
            const getIndex = (x, y) => (y * 64 + x) * 4;
            
            const startIdx = getIndex(startX, startY);
            const startR = data[startIdx], startG = data[startIdx+1], startB = data[startIdx+2], startA = data[startIdx+3];
            
            const targetColor = hexToRgb(currentColor);
            if (startR === targetColor[0] && startG === targetColor[1] && startB === targetColor[2] && startA === targetColor[3]) return;

            const stack = [[startX, startY]];
            
            while(stack.length > 0) {
                const [x, y] = stack.pop();
                
                if (x < minX || x > maxX || y < minY || y > maxY) continue;
                
                const idx = getIndex(x, y);
                if (data[idx] === startR && data[idx+1] === startG && data[idx+2] === startB && data[idx+3] === startA) {
                    data[idx] = targetColor[0];
                    data[idx+1] = targetColor[1];
                    data[idx+2] = targetColor[2];
                    data[idx+3] = targetColor[3];
                    
                    stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // === Взаимодействие и Мобильный Контроль ===
        let isDrawing = false;

        function handlePointer(event, isDown) {
            // Если 1 палец — блокируем OrbitControls и рисуем
            if (event.touches && event.touches.length > 1) {
                controls.enabled = true;
                isDrawing = false;
                return;
            }
            
            controls.enabled = false; // Блокируем камеру
            if (event.cancelable) event.preventDefault();

            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children).filter(obj => obj.object.visible);

            if (intersects.length > 0) {
                if (isDown) isDrawing = true;
                if (isDrawing) {
                    drawOnCanvas(intersects[0].uv, intersects[0].faceIndex, intersects[0].object);
                }
            }
        }

        const domElement = renderer.domElement;
        
        domElement.addEventListener('pointerdown', (e) => {
            if(e.pointerType === 'mouse' && e.button !== 0) return; // Только ЛКМ
            handlePointer(e, true);
        });
        domElement.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            handlePointer(e, false);
        });
        domElement.addEventListener('pointerup', () => {
            isDrawing = false;
            controls.enabled = true;
        });

        // Touch дублирование для жесткого захвата
        domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) handlePointer(e, true);
        }, { passive: false });
        domElement.addEventListener('touchmove', (e) => {
            if (isDrawing) handlePointer(e, false);
        }, { passive: false });
        domElement.addEventListener('touchend', () => {
            isDrawing = false;
            controls.enabled = true;
        });


        // === Экспорт ===
        document.getElementById('btnExport').addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            if (tg && tg.sendData) {
                tg.sendData(dataURL);
            } else {
                // Фолбэк для теста в браузере
                const link = document.createElement('a');
                link.download = 'skin_pro.png';
                link.href = dataURL;
                link.click();
            }
        });

        // === Рендер Loop ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Инициализация стартовой сетки для наглядности (опционально)
        ctx.fillStyle = '#1e1e1e'; // Base skin color hint
        ctx.fillRect(8, 8, 8, 8); // Face front hint
        texture.needsUpdate = true;

    </script>
</body>
</html>
