<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel — Minecraft Creator</title>
    <style>
        /* Подключение пиксельного шрифта Minecraft */
        @font-face {
            font-family: 'Minecraft';
            src: url('https://raw.githubusercontent.com/IdreesInc/Minecraft-Font/master/Minecraft.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: none;
            image-rendering: pixelated; /* Глобальная пикселизация для всех картинок */
        }

        body {
            background-color: #121212;
            color: #FFFFFF;
            font-family: 'Minecraft', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Шапка Apple Dark */
        header {
            width: 100%;
            background-color: #242426;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2C2C2E;
        }

        .logo {
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #FFD60A;
        }

        .tg-link img {
            width: 26px;
            filter: invert(1);
        }

        /* Контент */
        .content {
            width: 100%;
            max-width: 500px;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Плашки-прямоугольники */
        .card {
            background-color: #2C2C2E;
            height: 120px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding-left: 30px;
            transition: background 0.1s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #363638;
        }

        .card-text {
            position: relative;
            z-index: 10;
            width: 55%;
        }

        .card-text h2 {
            font-size: 24px; /* Крупный пиксельный текст */
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #1a1a1a;
        }

        .card-text p {
            font-size: 11px;
            color: #8E8E93;
            line-height: 1.2;
            text-shadow: 1px 1px 0px #1a1a1a;
        }

        /* Картинки */
        .card-img {
            position: absolute;
            z-index: 1;
            transform: rotate(-5deg); /* Тот самый наклон */
            display: flex;
            align-items: flex-end;
        }

        .card-img img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* ПОЗИЦИОНИРОВАНИЕ И МАСШТАБ */

        /* Скин: Самый крупный, урезан снизу */
        .skin-img {
            height: 165%;
            right: -20px;
            bottom: -55px;
        }

        /* Блок: Крупнее, выше и правее */
        .block-img {
            height: 110%; /* Стал крупнее */
            right: -5px;  /* Правее */
            top: 5px;     /* Выше */
        }

        /* Айтем: Правее, чуть ниже, крупнее */
        .item-img {
            height: 130%; /* Увеличил масштаб */
            right: 5px;   /* Сдвинул правее */
            bottom: -25px; /* Чуть ниже, чтобы урезался гранью */
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>PIXEL</div>
        <a href="https://t.me/pixel" target="_blank" class="tg-link">
            <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="tg">
        </a>
    </header>

    <div class="content">
        <div class="card">
            <div class="card-text">
                <h2>Создать скин</h2>
                <p>Твой стиль в игре.</p>
            </div>
            <div class="card-img skin-img">
                <img src="Logos/skin.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать блок</h2>
                <p>Меняй мир вокруг.</p>
            </div>
            <div class="card-img block-img">
                <img src="Logos/block.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать предмет</h2>
                <p>Редкие артефакты.</p>
            </div>
            <div class="card-img item-img">
                <img src="Logos/item.PNG" alt="">
            </div>
        </div>
    </div>

</body>
</html>
