<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skinx Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ios-bg: #000;
            --ios-card: #1c1c1e;
            --accent: #007aff;
            --text: #fff;
            --secondary: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Manrope', sans-serif; }

        body {
            margin: 0; background: var(--ios-bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Header */
        header { padding: 40px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: -1px; }

        /* Canvas Area */
        .viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding-bottom: 250px; /* Место под модалку */
        }
        .canvas-box {
            background: #2c2c2e; border-radius: 12px; padding: 5px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); position: relative;
        }
        canvas { 
            image-rendering: pixelated; display: block; touch-action: none;
            background-image: repeating-conic-gradient(#3a3a3c 0% 25%, #2c2c2e 0% 50%);
            background-size: 20px 20px;
        }

        /* Bottom Sheet (Modal) */
        .bottom-sheet {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px 30px 0 0;
            padding: 20px 20px 40px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 100;
        }

        /* Палитра-трансформер */
        .palette-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 8px; border-radius: 40px;
            width: fit-content; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; max-width: 50px; /* Свернута */
        }
        .palette-container.expanded { max-width: 400px; }

        .color-slot {
            min-width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2); transition: 0.2s;
        }
        .color-slot.active { border-color: #fff; transform: scale(1.1); }

        /* Навигация и инструменты */
        .scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .scroller::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(255,255,255,0.1); padding: 8px 16px; 
            border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .chip.active { background: var(--accent); color: #fff; }

        .tools-row { display: flex; justify-content: space-between; align-items: center; }
        .tool-btn {
            background: none; border: none; color: var(--secondary);
            padding: 10px; transition: 0.2s;
        }
        .tool-btn.active { color: var(--accent); transform: scale(1.1); }
        
        input[type="color"] { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Skinx</div>
        <div id="status" style="font-size: 12px; color: var(--secondary);">Saved</div>
    </header>

    <div class="viewport">
        <div class="canvas-box">
            <canvas id="editor"></canvas>
        </div>
    </div>

    <div class="bottom-sheet">
        <div class="tools-row">
            <div class="palette-container" id="palette">
                <div class="color-slot active" style="background: #007aff;" onclick="pickColor(this, '#007aff')"></div>
                <div class="color-slot" style="background: #ff3b30;" onclick="pickColor(this, '#ff3b30')"></div>
                <div class="color-slot" style="background: #4cd964;" onclick="pickColor(this, '#4cd964')"></div>
                <div class="color-slot" style="background: #ffcc00;" onclick="pickColor(this, '#ffcc00')"></div>
                <div class="color-slot" style="background: #ffffff;" onclick="pickColor(this, '#ffffff')"></div>
                <div class="color-slot" style="background: #5856d6;" onclick="pickColor(this, '#5856d6')"></div>
                <div class="color-slot" id="customColorSlot" style="background: #000;" onclick="openPicker()">+</div>
            </div>
            
            <div style="display: flex; gap: 5px;">
                <button class="tool-btn active" id="pen" onclick="setTool('pen')"><i data-lucide="pencil"></i></button>
                <button class="tool-btn" id="fill" onclick="setTool('fill')"><i data-lucide="paint-bucket"></i></button>
                <button class="tool-btn" id="eraser" onclick="setTool('eraser')"><i data-lucide="eraser"></i></button>
                <button class="tool-btn" id="pipette" onclick="setTool('pipette')"><i data-lucide="pipette"></i></button>
            </div>
        </div>

        <div class="scroller" id="faceTabs">
            <div class="chip active" data-face="front">Front</div>
            <div class="chip" data-face="back">Back</div>
            <div class="chip" data-face="top">Top</div>
            <div class="chip" data-face="bottom">Bottom</div>
            <div class="chip" data-face="left">Left</div>
            <div class="chip" data-face="right">Right</div>
        </div>

        <div class="scroller" id="partTabs">
            <div class="chip active" data-part="head">Head (Голова)</div>
            <div class="chip" data-part="body">Body (Тело)</div>
            <div class="chip" data-part="arm">Arm (Рука)</div>
            <div class="chip" data-part="leg">Leg (Нога)</div>
        </div>
    </div>

    <input type="color" id="hiddenPicker" onchange="updateCustomColor(this.value)">

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "ЭКСПОРТ В PNG";
        tg.MainButton.show();
        tg.MainButton.onClick(() => exportSkin());

        lucide.createIcons();

        // Сетка координат Minecraft
        const MAP = {
            head: { size: [8,8], faces: { front:[8,8], back:[24,8], top:[8,0], bottom:[16,0], left:[16,8], right:[0,8] } },
            body: { size: [8,12], faces: { front:[20,20], back:[32,20], top:[20,16,8,4], bottom:[28,16,8,4], left:[28,20,4,12], right:[16,20,4,12] } },
            arm: { size: [4,12], faces: { front:[44,20], back:[52,20], top:[44,16,4,4], bottom:[48,16,4,4], left:[48,20], right:[40,20] } },
            leg: { size: [4,12], faces: { front:[4,20], back:[12,20], top:[4,16,4,4], bottom:[8,16,4,4], left:[8,20], right:[0,20] } }
        };

        let currentPart = 'head';
        let currentFace = 'front';
        let currentTool = 'pen';
        let activeColor = '#007aff';
        let isDrawing = false;

        const canvas = document.getElementById('editor');
        const ctx = canvas.getContext('2d');
        const vCanvas = document.createElement('canvas'); // Мастер-холст 64x64
        vCanvas.width = 64; vCanvas.height = 64;
        const vCtx = vCanvas.getContext('2d', { willReadFrequently: true });

        // Автозагрузка
        const saved = localStorage.getItem('skinx_v3');
        if(saved) {
            const img = new Image();
            img.onload = () => { vCtx.drawImage(img,0,0); updateCanvas(); };
            img.src = saved;
        }

        function updateCanvas() {
            const f = MAP[currentPart].faces[currentFace];
            const w = f[2] || MAP[currentPart].size[0];
            const h = f[3] || MAP[currentPart].size[1];
            canvas.width = w; canvas.height = h;
            
            const scale = Math.min((window.innerWidth - 80)/w, 40);
            canvas.style.width = (w * scale) + 'px';
            canvas.style.height = (h * scale) + 'px';
            
            ctx.clearRect(0,0,w,h);
            ctx.drawImage(vCanvas, f[0], f[1], w, h, 0, 0, w, h);
        }

        function getXY(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            const x = Math.floor((t.clientX - rect.left) / (rect.width / canvas.width));
            const y = Math.floor((t.clientY - rect.top) / (rect.height / canvas.height));
            return { x, y };
        }

        function handleDraw(e) {
            if(!isDrawing) return;
            const {x, y} = getXY(e);
            if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

            const f = MAP[currentPart].faces[currentFace];
            const rx = f[0] + x; const ry = f[1] + y;

            if(currentTool === 'pen') {
                vCtx.fillStyle = activeColor;
                vCtx.fillRect(rx, ry, 1, 1);
                tg.HapticFeedback.impactOccurred('light');
            } else if(currentTool === 'eraser') {
                vCtx.clearRect(rx, ry, 1, 1);
            } else if(currentTool === 'pipette')
