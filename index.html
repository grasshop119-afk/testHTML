<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APixel - Entrance</title>
    
    <link href="https://fonts.cdnfonts.com/css/common-pixel" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated; 
        }

        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Common Pixel', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ХЕДЕР --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #1a1a1a;
        }

        .logo {
            font-size: 20px;
            letter-spacing: 1px;
        }
        .logo span { color: #f3bc18; }

        .tg-icon {
            width: 22px;
            height: 22px;
            opacity: 0.7;
            cursor: pointer;
        }

        /* --- КОНТЕНТ --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Компактные отступы между плашками */
            padding-bottom: 20px;
        }

        /* --- КАРТОЧКИ --- */
        .card {
            position: relative;
            width: 85%;
            max-width: 360px;
            height: 110px; /* Уменьшенная высота */
            background-color: #2b2b2b;
            border-top: 1px solid #3d3d3d;
            border-left: 1px solid #3d3d3d;
            border-bottom: 2px solid #111;
            border-right: 1px solid #111;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            overflow: visible; 
            transition: background 0.2s;
        }

        .card:hover { background-color: #313131; }

        .card-content {
            width: 65%;
            z-index: 2;
        }

        .card-title {
            font-size: 14px; /* Контент мельче */
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 9px; /* Контент мельче */
            line-height: 1.3;
            color: #7a7a7a;
        }

        /* Маска для обрезки картинок по бокам и снизу */
        .img-mask {
            position: absolute;
            top: -30px; /* Запас для вылета сверху */
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            border-radius: 4px;
            pointer-events: none;
        }

        .card-img {
            position: absolute;
            z-index: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        /* Специфичные настройки для каждого типа (Req: позиции и размеры) */
        .img-skin {
            width: 110px;
            right: -5px;
            bottom: -55px; /* Виден по пояс */
        }

        .img-block {
            width: 100px;
            right: 0;
            bottom: 15px; /* Чуть выше */
        }

        .img-item {
            width: 75px; /* Мельче */
            right: 10px;
            bottom: -10px; /* Ниже */
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>PIXEL</div>
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" class="tg-icon" alt="TG">
    </header>

    <main>
        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Skin</div>
                <div class="card-desc">Create your own Minecraft™ skin. You also can edit or choose skin from the list.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/skin.PNG" alt="Skin" class="card-img img-skin">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Block</div>
                <div class="card-desc">Design unique textures and properties for new in-game blocks. Real-time preview.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/block.PNG" alt="Block" class="card-img img-block">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Item</div>
                <div class="card-desc">Add custom weapons, tools, and rare artifacts to your world with ease.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/item.PNG" alt="Item" class="card-img img-item">
            </div>
        </div>
    </main>

</body>
</html>
