<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jelly Morph Nav</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.15);
            --island-w: 200px;
            --island-h: 60px;
            --expanded-w: 320px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* --- NAVIGATION --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: var(--island-w);
            height: var(--island-h);
            z-index: 1000;
            /* Мармеладный переход */
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-wrapper.expanded {
            width: var(--expanded-w);
            height: 100px;
            bottom: calc(30px + env(safe-area-inset-bottom));
        }

        .nav-bg {
            position: absolute;
            inset: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-wrapper.expanded .nav-bg {
            border-radius: 50% 50% 35px 35px / 20px 20px 35px 35px;
            transform: scaleY(1.1);
        }

        .blob {
            position: absolute;
            top: 7px;
            left: 50%;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-wrapper.expanded .blob {
            top: -10px; /* Выпрыгивает чуть выше в дуге */
            width: 52px;
            height: 52px;
        }

        .icons-container {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .nav-item {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .nav-wrapper.expanded .nav-item {
            position: absolute;
            top: 10px;
            left: 50%;
            margin-left: -25px;
            /* Выгибаем по дуге */
            transform-origin: center 250px; 
        }

        .nav-item img, .pfp-mini {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.3;
            transition: 0.3s;
        }

        .nav-item.active img, .nav-item.active .pfp-mini {
            opacity: 1;
            transform: scale(1.1);
        }

        .pfp-mini { border-radius: 50%; background-size: cover; filter: grayscale(1); background-color: #444; }
        .nav-item.active .pfp-mini { filter: none; border: 1px solid white; }

        .content-view {
            position: absolute;
            inset: 0;
            display: none;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        .content-view.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="view-0" class="content-view active"><h1>Главная</h1></div>
    <div id="view-1" class="content-view"><h1>Поиск</h1></div>
    <div id="view-2" class="content-view"><h1>Профиль</h1></div>
    <div id="view-3" class="content-view"><h1>Настройки</h1></div>

    <div class="nav-wrapper" id="navWrapper">
        <div class="nav-bg"></div>
        <div class="blob" id="blob"></div>
        <div class="icons-container" id="iconBox">
            <div class="nav-item active" id="tab-0" onclick="handleTap(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" id="tab-1" onclick="handleTap(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" id="tab-2" onclick="handleTap(2)">
                <div class="pfp-mini" id="nav-pfp"></div>
            </div>
            <div class="nav-item" id="tab-3" onclick="handleTap(3)">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png">
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const wrapper = document.getElementById('navWrapper');
        const iconBox = document.getElementById('iconBox');
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        
        let currentIndex = 0;
        let isExpanded = false;
        let pressTimer;
        let startX = 0;
        let currentRotation = 0;
        const angleStep = 22;

        if (tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Взаимодействие
        wrapper.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            pressTimer = setTimeout(() => activateJelly(), 300);
        });

        window.addEventListener('touchmove', (e) => {
            const moveX = e.touches[0].clientX - startX;
            
            if (isExpanded) {
                // Логика вращения с сопротивлением (Elastic)
                let targetRot = (moveX * 0.25) - (currentIndex * angleStep);
                const maxRot = 0;
                const minRot = -(items.length - 1) * angleStep;

                if (targetRot > maxRot) {
                    targetRot = maxRot + (targetRot - maxRot) * 0.3; // Сопротивление справа
                } else if (targetRot < minRot) {
                    targetRot = minRot + (targetRot - minRot) * 0.3; // Сопротивление слева
                }

                currentRotation = targetRot;
                iconBox.style.transform = `rotate(${currentRotation}deg)`;
                
                // Вибрация при прохождении пунктов
                const nearestIndex = Math.max(0, Math.min(items.length - 1, Math.round(-currentRotation / angleStep)));
                if (nearestIndex !== currentIndex) {
                    currentIndex = nearestIndex;
                    updateActive(currentIndex);
                    tg.HapticFeedback.selectionChanged();
                }
            } else {
                if (Math.abs(moveX) > 10) clearTimeout(pressTimer);
            }
        });

        window.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
            if (isExpanded) deactivateJelly();
        });

        function handleTap(index) {
            if (!isExpanded) {
                currentIndex = index;
                updateActive(index);
                moveBlob(index);
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function activateJelly() {
            isExpanded = true;
            wrapper.classList.add('expanded');
            tg.HapticFeedback.impactOccurred('medium');
            
            items.forEach((item, i) => {
                item.style.transform = `rotate(${i * angleStep}deg)`;
            });
            
            currentRotation = -currentIndex * angleStep;
            iconBox.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            iconBox.style.transform = `rotate(${currentRotation}deg)`;
            blob.style.left = '50%';
        }

        function deactivateJelly() {
            isExpanded = false;
            wrapper.classList.remove('expanded');
            
            // Плавный возврат
            iconBox.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            iconBox.style.transform = `rotate(0deg)`;
            
            setTimeout(() => {
                items.forEach(item => item.style.transform = 'none');
                moveBlob(currentIndex);
            }, 100);
            
            tg.HapticFeedback.impactOccurred('light');
        }

        function moveBlob(index) {
            if (isExpanded) return;
            const target = document.getElementById(`tab-${index}`);
            const x = target.offsetLeft + (target.offsetWidth / 2);
            blob.style.left = `${x}px`;
        }

        function updateActive(index) {
            items.forEach((item, i) => item.classList.toggle('active', i === index));
            document.querySelectorAll('.content-view').forEach((v, i) => v.classList.toggle('active', i === index));
        }

        window.onload = () => moveBlob(0);
    </script>
</body>
</html>
