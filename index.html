<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.85);
            --active-accent: #3da9ff;
            --text-inactive: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-bar-container {
            margin-bottom: 25px;
            width: 100%; /* Панель почти во всю длину */
            max-width: 500px;
            padding: 40px 16px; 
            display: flex;
            justify-content: center;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border-radius: 40px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            overflow: visible; 
            width: 100%; /* Растягиваем */
            justify-content: space-around;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1; /* Одинаковая ширина для всех вкладок */
            cursor: pointer;
            outline: none;
            transform: none !important;
        }

        /* Стили для иконок-картинок */
        .tab-icon-img {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            filter: grayscale(1) brightness(0.7); /* Цвет неактивной иконки */
            transition: filter 0.2s ease;
            pointer-events: none;
        }

        .tab-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-inactive);
            transition: color 0.2s ease;
            pointer-events: none;
        }

        /* Активное состояние */
        .tab-item.active .tab-icon-img {
            filter: none; /* Возвращаем оригинальный цвет или можно наложить tint через mask */
            /* Если хочешь покрасить иконку в --active-accent, используй drop-shadow или mask-image */
        }
        
        /* Вариант покраски иконки в синий (акцентный) */
        .tab-item.active .tab-icon-img {
            filter: invert(56%) sepia(88%) saturate(1914%) hue-rotate(182deg) brightness(101%) contrast(101%);
        }

        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 35px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, left, width;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="Home" class="tab-icon-img">
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <img src="https://cdn-icons-png.flaticon.com/512/2769/2769160.png" alt="Menu" class="tab-icon-img">
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <img src="https://cdn-icons-png.flaticon.com/512/9959/9959489.png" alt="Settings" class="tab-icon-img">
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },    
        scale: { k: 420, d: 24, m: 1 }   
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        intensity: 1,
        currentIndex: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        const vel = Math.abs(state.vx);

        if (state.isMoving) {
            if (dist > 15) { 
                // ПОЛЕТ (чуть-чуть меньше вытяжение)
                state.tsy = 1 + (0.22 * state.intensity); 
                state.tsx = 1 - (0.12 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                // УДАР (сплющивание на 5% меньше чем в прошлый раз)
                state.tsy = 1 - (0.10 * state.intensity); 
                state.tsx = 1 + (0.13 * state.intensity); 
            } else {
                state.tsx = 1;
                state.tsy = 1;
                if (vel < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - (state.currentIndex || 0));

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx;
            state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.5;
            state.isMoving = true;

            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));

    const initial = document.querySelector('.tab-item.active');
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
