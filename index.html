<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RATIO - Full Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: #000000;
            --tg-accent: #007AFF; 
            --tg-star: #FFD700;
            --tg-text: #ffffff;
            --tg-hint: #8e8e93;
            --card-bg: #111112;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- СКРОЛЛБАР --- */
        .content-view::-webkit-scrollbar {
            width: 4px;
        }
        .content-view::-webkit-scrollbar-track {
            background: transparent;
        }
        .content-view::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* --- HEADER (Смещен ниже для Fullscreen) --- */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            /* Увеличил отступ, чтобы не мешать кнопкам ТГ */
            padding: calc(var(--safe-top) + 35px) 20px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: #fff;
        }

        /* --- GOSSIP CARD --- */
        .content-view {
            flex: 1;
            overflow-y: auto;
            padding: calc(var(--safe-top) + 120px) 16px 160px;
            scroll-behavior: smooth;
        }

        .gossip-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 16px;
            border: 0.5px solid rgba(255,255,255,0.1);
        }

        .card-inner-header {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        /* ТАЙМЕР С АНИМАЦИЕЙ */
        .timer-wrap {
            position: relative;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-wrap svg {
            position: absolute;
            transform: rotate(-90deg);
            width: 38px;
            height: 38px;
        }

        .timer-wrap circle {
            fill: none;
            stroke-width: 4; /* Толще круг */
            stroke-linecap: round; /* Закругленные края */
        }

        .timer-bg { stroke: rgba(255,255,255,0.15); }
        .timer-progress {
            stroke: var(--tg-accent);
            stroke-dasharray: 100;
            stroke-dashoffset: 100; /* Начало анимации */
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--tg-accent);
        }

        .gossip-content {
            font-size: 15px;
            line-height: 1.45;
            color: #ffffff;
            text-align: justify;
            margin: 0 12px 16px;
        }

        /* --- VOTING & STARS --- */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 6px 4px;
            border-top: 0.5px solid rgba(255,255,255,0.06);
        }

        .vote-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            padding: 6px 14px;
            border-radius: 100px;
        }

        .vote-btn {
            background: none;
            border: none;
            padding: 0;
            display: flex;
            transition: 0.2s;
        }

        .vote-btn img { width: 18px; filter: invert(1); opacity: 0.4; }
        
        /* Состояния нажатия */
        .vote-btn.active-up img { filter: invert(0) sepia(1) saturate(5) hue-rotate(90deg); opacity: 1; }
        .vote-btn.active-down img { filter: invert(0) sepia(1) saturate(5) hue-rotate(-50deg); opacity: 1; }

        .vote-count { font-size: 14px; font-weight: 700; width: 30px; text-align: center; }

        /* КНОПКА РЕСПЕКТ С БЛЕСТКАМИ */
        .respect-btn {
            position: relative;
            background: rgba(255, 215, 0, 0.15);
            border: none;
            padding: 10px 18px;
            border-radius: 100px;
            overflow: hidden;
            transition: 0.2s;
        }

        .respect-label {
            color: var(--tg-star);
            font-size: 13px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }

        /* Анимация частиц */
        .sparkle {
            position: absolute;
            background: var(--tg-star);
            width: 2px;
            height: 2px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: fly 2s infinite linear;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        /* --- ТВОЙ ПОДВАЛ --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
        }

        .nav-island {
            position: relative;
            width: 220px; height: 60px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .blob {
            position: absolute;
            width: 44px; height: 44px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0; top: 50%; margin-top: -22px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .nav-item { position: relative; width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .nav-item img { width: 22px; filter: invert(1); opacity: 0.3; }
        .nav-item.active img { opacity: 1; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">RATIO.</div>
        <div style="font-size: 13px; font-weight: 600; color: var(--tg-accent);">Сплетни МСК</div>
    </header>

    <div id="view-0" class="content-view active">
        
        <div class="gossip-card" id="post-1">
            <div class="card-inner-header">
                <span style="font-size: 11px; font-weight: 700; opacity: 0.5;">СПЛЕТНЯ #7721</span>
                <div class="timer-wrap">
                    <svg viewBox="0 0 38 38">
                        <circle class="timer-bg" cx="19" cy="19" r="17"></circle>
                        <circle class="timer-progress" id="progress-1" cx="19" cy="19" r="17"></circle>
                    </svg>
                    <span class="timer-label">18ч</span>
                </div>
            </div>
            <p class="gossip-content">
                Вчера в столовой видели, как Марина из 11-А пыталась расплатиться за сосиску лайками в ТТ. Походу проект Ratio реально нужен, чтобы такие истории не пропадали!
            </p>
            <div class="card-footer">
                <div class="vote-controls">
                    <button class="vote-btn" onclick="vote(1, 'up')">
                        <img src="https://cdn-icons-png.flaticon.com/512/8000/8000325.png" id="up-1">
                    </button>
                    <span class="vote-count" id="count-1">12</span>
                    <button class="vote-btn" onclick="vote(1, 'down')">
                        <img src="https://cdn-icons-png.flaticon.com/512/8000/8000314.png" id="down-1">
                    </button>
                </div>
                <button class="respect-btn" onclick="openStars()">
                    <span class="respect-label">Респект</span>
                    <div class="particles"></div>
                </button>
            </div>
        </div>

    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" id="tab-0" onclick="switchTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" id="tab-1" onclick="switchTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" id="tab-2" onclick="switchTab(2)">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: #333; border: 1px solid white;"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Анимация круга при входе
        setTimeout(() => {
            document.getElementById('progress-1').style.strokeDashoffset = "30"; // Значение времени
        }, 300);

        // 2. Логика голосования
        let score = 12;
        function vote(id, type) {
            const up = document.getElementById(`up-${id}`);
            const down = document.getElementById(`down-${id}`);
            const counter = document.getElementById(`count-${id}`);
            
            if(type === 'up') {
                up.parentElement.classList.toggle('active-up');
                down.parentElement.classList.remove('active-down');
                score++;
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                down.parentElement.classList.toggle('active-down');
                up.parentElement.classList.remove('active-up');
                score--;
                tg.HapticFeedback.impactOccurred('light');
            }
            counter.innerText = score;
        }

        // 3. Реальный донат (инвойс)
        function openStars() {
            tg.HapticFeedback.notificationOccurred('success');
            // В продакшене: tg.openInvoice(url_from_bot);
            tg.showAlert("Здесь открывается нативный платеж Telegram Stars ⭐");
        }

        // 4. Генерация блесток
        function createSparkles() {
            const containers = document.querySelectorAll('.particles');
            containers.forEach(container => {
                for(let i=0; i<8; i++) {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    s.style.setProperty('--x', (Math.random()*40 - 20) + 'px');
                    s.style.setProperty('--y', (Math.random()*40 - 20) + 'px');
                    s.style.left = Math.random()*100 + '%';
                    s.style.top = Math.random()*100 + '%';
                    s.style.animationDelay = Math.random()*2 + 's';
                    container.appendChild(s);
                }
            });
        }
        createSparkles();

        // 5. Навигация (твой код)
        function switchTab(index) {
            const blob = document.getElementById('blob');
            const targetItem = document.getElementById(`tab-${index}`);
            blob.style.left = (targetItem.offsetLeft + 3) + "px";
            tg.HapticFeedback.impactOccurred('medium');
            // ... логика переключения вью
        }

        window.onload = () => switchTab(0);
    </script>
</body>
</html>
