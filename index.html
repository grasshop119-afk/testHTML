<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RATIO - Jelly Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: #000000;
            --tg-accent: #007AFF; 
            --tg-text: #ffffff;
            --tg-hint: #8e8e93;
            --card-bg: #111112;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --jelly-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ПЛАВНЫЙ СКРОЛЛБАР --- */
        .content-view {
            flex: 1;
            overflow-y: auto;
            padding: calc(var(--safe-top) + 110px) 16px 160px;
            scroll-behavior: smooth;
        }

        .content-view::-webkit-scrollbar { width: 4px; }
        .content-view::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* --- БЛЕСКИ (FLYING PARTICLES) --- */
        #canvas-particles {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* --- HEADER (НИЖЕ ДЛЯ FULLSCREEN) --- */
        .app-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: calc(var(--safe-top) + 40px) 20px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
        }

        /* --- GOSSIP CARD --- */
        .gossip-card {
            background: var(--card-bg);
            border-radius: 26px;
            padding: 12px;
            margin-bottom: 18px;
            border: 0.5px solid rgba(255,255,255,0.08);
            position: relative;
            z-index: 2;
            animation: cardEnter 0.6s var(--jelly-snap) backwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card-inner-header {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        /* КРУГЛЫЙ ТАЙМЕР */
        .timer-wrap {
            position: relative;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
        }

        .timer-wrap svg {
            position: absolute;
            transform: rotate(-90deg);
            width: 100%; height: 100%;
        }

        .timer-wrap circle {
            fill: none;
            stroke-width: 4.5;
            stroke-linecap: round;
        }

        .timer-bg { stroke: rgba(255,255,255,0.1); }
        .timer-progress {
            stroke: var(--tg-accent);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 1.8s var(--jelly-snap);
        }

        .timer-label {
            font-size: 10px; font-weight: 800; color: var(--tg-accent);
        }

        .gossip-content {
            font-size: 16px;
            line-height: 1.5;
            text-align: justify;
            padding: 0 10px 10px;
            color: #efefef;
        }

        /* --- FOOTER & VOTING --- */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 6px 4px;
            border-top: 0.5px solid rgba(255,255,255,0.06);
        }

        .vote-panel {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.03);
            padding: 6px 16px;
            border-radius: 100px;
        }

        .vote-btn {
            background: none; border: none; padding: 0;
            display: flex; align-items: center; transition: 0.3s var(--jelly-snap);
        }

        .vote-btn img { width: 20px; filter: invert(1); opacity: 0.3; transition: 0.3s; }

        /* Мармеладные цвета при клике */
        .vote-btn.up-active img { filter: invert(0) sepia(1) saturate(10) hue-rotate(80deg) drop-shadow(0 0 5px #4cd964); opacity: 1; }
        .vote-btn.down-active img { filter: invert(0) sepia(1) saturate(10) hue-rotate(-50deg) drop-shadow(0 0 5px #ff3b30); opacity: 1; }
        .vote-btn:active { transform: scale(1.4); }

        .vote-count {
            font-size: 15px; font-weight: 800; min-width: 30px; text-align: center;
        }

        .comment-trigger {
            font-size: 13px; font-weight: 600; color: var(--tg-hint);
            display: flex; align-items: center; gap: 6px;
        }

        /* --- NAV ISLAND --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
        }

        .nav-island {
            position: relative;
            width: 210px; height: 62px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 31px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; border: 1px solid rgba(255,255,255,0.1);
        }

        .blob {
            position: absolute;
            width: 46px; height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0; top: 50%; margin-top: -23px;
            transition: left 0.6s var(--jelly-snap);
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.4);
        }

        .nav-item { position: relative; width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .nav-item img { width: 24px; filter: invert(1); opacity: 0.3; transition: 0.3s; }
        .nav-item.active img { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>

    <canvas id="canvas-particles"></canvas>

    <header class="app-header">
        <div class="logo">RATIO.</div>
        <div style="font-size: 12px; font-weight: 700; color: #4cd964; text-transform: uppercase; letter-spacing: 1px;">Live МСК</div>
    </header>

    <div id="view-0" class="content-view active">
        
        <div class="gossip-card">
            <div class="card-inner-header">
                <span style="font-size: 11px; font-weight: 800; opacity: 0.4;">СПЛЕТНЯ #9921</span>
                <div class="timer-wrap">
                    <svg viewBox="0 0 40 40">
                        <circle class="timer-bg" cx="20" cy="20" r="17"></circle>
                        <circle id="progress-1" class="timer-progress" cx="20" cy="20" r="17"></circle>
                    </svg>
                    <span class="timer-label">21ч</span>
                </div>
            </div>
            <p class="gossip-content">
                Вчера кто-то оставил в библиотеке записку "Я знаю, что ты сделал прошлым летом" на парте старосты. Староста не пришла на первые три урока. Совпадение? 🤔
            </p>
            <div class="card-footer">
                <div class="vote-panel">
                    <button class="vote-btn" onclick="handleVote(1, 'up')">
                        <img src="https://cdn-icons-png.flaticon.com/512/8000/8000325.png" id="up-img-1">
                    </button>
                    <span class="vote-count" id="count-1">84</span>
                    <button class="vote-btn" onclick="handleVote(1, 'down')">
                        <img src="https://cdn-icons-png.flaticon.com/512/8000/8000314.png" id="down-img-1">
                    </button>
                </div>
                <div class="comment-trigger" onclick="tg.showAlert('Комментарии появятся в следующем обновлении!')">
                    💬 <span>12</span>
                </div>
            </div>
        </div>

    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item active" id="tab-0" onclick="switchTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" id="tab-1" onclick="switchTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" id="tab-2" onclick="switchTab(2)">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: #333; border: 1.5px solid white;"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. АНИМАЦИЯ ТАЙМЕРА (УБЫВАНИЕ)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const circle = document.getElementById('progress-1');
                circle.style.strokeDashoffset = "40"; // Уровень оставшегося времени
            }, 500);
            initParticles();
        });

        // 2. МАРМЕЛАДНОЕ ГОЛОСОВАНИЕ
        let currentScore = 84;
        function handleVote(id, type) {
            const upImg = document.getElementById(`up-img-${id}`);
            const downImg = document.getElementById(`down-img-${id}`);
            const countLabel = document.getElementById(`count-${id}`);

            if (type === 'up') {
                upImg.parentElement.classList.toggle('up-active');
                downImg.parentElement.classList.remove('down-active');
                currentScore = upImg.parentElement.classList.contains('up-active') ? 85 : 84;
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                downImg.parentElement.classList.toggle('down-active');
                upImg.parentElement.classList.remove('up-active');
                currentScore = downImg.parentElement.classList.contains('down-active') ? 83 : 84;
                tg.HapticFeedback.impactOccurred('light');
            }

            countLabel.style.transform = 'scale(1.3)';
            setTimeout(() => {
                countLabel.innerText = currentScore;
                countLabel.style.transform = 'scale(1)';
            }, 100);
        }

        // 3. ЛЕТАЮЩИЕ БЛЕСКИ (Canvas для производительности)
        function initParticles() {
            const canvas = document.getElementById('canvas-particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for(let i=0; i<40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                particles.forEach(p => {
                    p.y -= p.speed;
                    if(p.y < 0) p.y = canvas.height;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        // 4. НАВИГАЦИЯ
        function switchTab(index) {
            const blob = document.getElementById('blob');
            const target = document.getElementById(`tab-${index}`);
            blob.style.left = (target.offsetLeft + 2) + 'px';
            tg.HapticFeedback.impactOccurred('rigid');
        }

        window.onload = () => switchTab(0);
    </script>
</body>
</html>
