<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel — Creator</title>
    <style>
        /* Подключение шрифта Minecraft */
        @font-face {
            font-family: 'MinecraftRus';
            src: url('https://fonts-online.ru/storage/fonts/minecraft-rus/minecraft-rus.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #121212; /* Глубокий темный фон Apple */
            color: #FFFFFF;
            font-family: 'MinecraftRus', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        header {
            width: 100%;
            background-color: #242426; /* Тон светлее фона */
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2C2C2E;
        }

        .logo {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #FFD60A; /* Желтая A */
        }

        .tg-link img {
            width: 24px;
            filter: invert(1);
            image-rendering: pixelated;
        }

        /* Контент */
        .content {
            width: 100%;
            max-width: 480px; /* Еще немного уменьшил общую ширину */
            padding: 35px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Уменьшенные прямоугольные плашки */
        .card {
            background-color: #2C2C2E;
            height: 115px; /* Уменьшенная высота */
            position: relative;
            overflow: hidden; /* Обрезает картинки по нижней грани */
            display: flex;
            align-items: center;
            padding-left: 25px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #363638;
        }

        .card-text {
            position: relative;
            z-index: 5;
            width: 65%;
        }

        .card-text h2 {
            font-size: 16px;
            margin-bottom: 6px;
            text-shadow: 2px 2px 0px #000; /* Тень текста в стиле Minecraft */
        }

        .card-text p {
            font-size: 9px;
            color: #8E8E93;
            line-height: 1.3;
            max-width: 180px;
            font-family: sans-serif; /* Описание лучше читается обычным шрифтом */
        }

        /* Общие настройки для картинок */
        .card-img {
            position: absolute;
            z-index: 1;
            transform: rotate(-6deg); /* Уменьшенный наклон */
            display: flex;
            align-items: flex-end;
        }

        .card-img img {
            height: 100%;
            width: auto;
            image-rendering: pixelated;
            display: block;
        }

        /* ИНДИВИДУАЛЬНОЕ ПОЗИЦИОНИРОВАНИЕ */
        
        /* Скин: Крупнее, ниже и правее */
        .skin-img {
            height: 150%; /* Очень крупный */
            right: -20px;
            bottom: -45px; /* Сильно урезан снизу */
        }

        /* Блок: Подвинут правее, масштаб умеренный */
        .block-img {
            height: 95%; 
            right: 5px; /* Правее */
            bottom: -15px;
        }

        /* Предмет */
        .item-img {
            height: 110%;
            right: -10px;
            bottom: -25px;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>PIXEL</div>
        <a href="https://t.me/pixel" target="_blank" class="tg-link">
            <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="tg">
        </a>
    </header>

    <div class="content">
        <div class="card">
            <div class="card-text">
                <h2>Создать скин</h2>
                <p>Настройте внешний вид своего персонажа в редакторе.</p>
            </div>
            <div class="card-img skin-img">
                <img src="Logos/skin.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать блок</h2>
                <p>Создавайте уникальные текстуры для игровых блоков.</p>
            </div>
            <div class="card-img block-img">
                <img src="Logos/block.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать предмет</h2>
                <p>Добавляйте кастомное оружие и редкие артефакты.</p>
            </div>
            <div class="card-img item-img">
                <img src="Logos/item.PNG" alt="">
            </div>
        </div>
    </div>

</body>
</html>
