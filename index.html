<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mini App Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Блокировка системных штук */
        :root {
            --accent-color: var(--tg-theme-accent-color, #f7a251);
            --bg-color: #000000;
            --menu-bg: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Запрет выделения */
            -webkit-user-select: none;
            touch-action: none; /* Запрет масштабирования и жестов браузера */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px; /* Отступ от низа экрана */
            overflow: hidden;
        }

        /* Контейнер меню почти во всю ширину */
        .nav-container {
            width: 94%; 
            max-width: 500px;
            height: 70px;
            background-color: var(--menu-bg);
            border-radius: 35px;
            display: flex;
            position: relative;
            padding: 0 5px; /* Небольшой внутренний отступ */
            align-items: center;
        }

        .nav-sector {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Выбранный пузырь: на 5px ниже (по высоте) и уже сектора */
        .active-bubble {
            position: absolute;
            /* Рассчитываем размеры: 100% / 3 секторов - зазор */
            width: calc(33.33% - 10px); 
            height: 60px; /* На 10px меньше высоты меню (70-10=60), т.е. по 5px сверху и снизу */
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            left: 5px; /* Начальный отступ */
            top: 5px; /* Отступ сверху 5px */
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            margin-bottom: 4px;
        }

        .label {
            color: #ffffff;
            font-size: 11px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Окрашивание для активного состояния (пока без переключения, просто стили) */
        .nav-sector.active .icon {
            fill: var(--accent-color);
        }
        .nav-sector.active .label {
            color: var(--accent-color);
        }

    </style>
</head>
<body>

    <div class="nav-container">
        <div class="active-bubble" id="bubble"></div>

        <div class="nav-sector active">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M21.6,11.4l-9-7.6c-0.4-0.3-0.9-0.3-1.2,0l-9,7.6c-0.3,0.3-0.4,0.7-0.1,1.1c0.1,0.2,0.3,0.3,0.6,0.3H5v7c0,0.6,0.4,1,1,1h4v-5h4v5h4c0.6,0,1-0.4,1-1v-7h1.1c0.4,0,0.7-0.2,0.9-0.5C22,12.1,21.9,11.7,21.6,11.4z"/>
            </svg>
            <span class="label">Дом</span>
        </div>

        <div class="nav-sector">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M22,9.2l-7.2-0.6L12,2L9.2,8.6L2,9.2l5.5,4.7l-1.6,7L12,17.3l6.1,3.7l-1.6-7L22,9.2z"/>
            </svg>
            <span class="label">Избранное</span>
        </div>

        <div class="nav-sector">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3,6h18v2H3V6z M3,11h18v2H3V11z M3,16h18v2H3V16z"/>
            </svg>
            <span class="label">Меню</span>
        </div>
    </div>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на всё окно
        tg.ready();

        // Запрет контекстного меню (правой кнопки мыши)
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };

        // В будущем здесь будет логика перемещения translateX для #bubble
    </script>
</body>
</html>
