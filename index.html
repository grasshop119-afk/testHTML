<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APixel - Entrance</title>
    
    <link href="https://fonts.cdnfonts.com/css/common-pixel" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated; 
        }

        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Common Pixel', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ГЕРОЙ-ШАПКА --- */
        .home-banner {
            position: relative;
            width: 100%;
            height: 200px; /* Высота шапки */
            overflow: hidden;
            border-bottom: 2px solid #111;
        }

        .home-pic {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Заполняем область */
            display: block;
        }

        /* Название в углу картинки */
        .banner-logo {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000; /* Чтобы читалось на любом фоне */
            z-index: 5;
        }
        .banner-logo span { color: #f3bc18; }

        /* --- КОНТЕНТ --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Начинаем сверху под шапкой */
            gap: 12px;
            padding-top: 25px; /* Отступ от шапки до первой кнопки */
        }

        /* --- КАРТОЧКИ --- */
        .card {
            position: relative;
            width: 88%;
            max-width: 380px;
            height: 110px;
            background-color: #2b2b2b;
            border-top: 1px solid #3d3d3d;
            border-left: 1px solid #3d3d3d;
            border-bottom: 2px solid #111;
            border-right: 1px solid #111;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            overflow: visible; 
            transition: transform 0.1s;
        }

        .card:active { transform: scale(0.98); }

        .card-content {
            width: 65%;
            z-index: 2;
        }

        .card-title {
            font-size: 14px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 9px;
            line-height: 1.3;
            color: #7a7a7a;
            text-transform: none;
        }

        .img-mask {
            position: absolute;
            top: -30px; 
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            border-radius: 4px;
            pointer-events: none;
        }

        .card-img {
            position: absolute;
            z-index: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        /* Позиционирование по твоему плану */
        .img-skin {
            width: 110px;
            right: -5px;
            bottom: -55px; /* По пояс */
        }

        .img-block {
            width: 95px;
            right: 5px;
            bottom: 5px; /* Сдвинут чуть ниже (был 15) */
        }

        .img-item {
            width: 75px;
            right: 10px;
            bottom: -10px; /* Мелкий и внизу */
        }

    </style>
</head>
<body>

    <div class="home-banner">
        <img src="Logos/HomePic.PNG" alt="Home" class="home-pic">
        <div class="banner-logo"><span>A</span>PIXEL</div>
    </div>

    <main>
        <div class="card" onclick="location.href='skin_editor.html'">
            <div class="card-content">
                <div class="card-title">Create Skin</div>
                <div class="card-desc">Create your own Minecraft™ skin. You also can edit or choose skin from the list.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/skin.PNG" alt="Skin" class="card-img img-skin">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Block</div>
                <div class="card-desc">Design unique textures and properties for new in-game blocks. Real-time preview.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/block.PNG" alt="Block" class="card-img img-block">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Item</div>
                <div class="card-desc">Add custom weapons, tools, and rare artifacts to your world with ease.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/item.PNG" alt="Item" class="card-img img-item">
            </div>
        </div>
    </main>

</body>
</html>
