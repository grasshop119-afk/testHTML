<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel - Создавай</title>
    <style>
        /* Подключаем пиксельный шрифт для подстраховки */
        @font-face {
            font-family: '00 Starmap';
            src: url('fonts/00-Starmap.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: none;
            image-rendering: pixelated;
        }

        body {
            background-color: #121212; /* Глубокий темный фон */
            color: #FFFFFF;
            font-family: '00 Starmap', 'Press Start 2P', sans-serif;
            padding-bottom: 40px;
        }

        /* Шапка */
        header {
            background-color: #242426; /* Светлее фона, без тени */
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span {
            color: #FFD60A; /* Желтая A (Apple Yellow) */
        }

        .tg-link img {
            width: 24px;
            filter: invert(1);
        }

        /* Контейнер */
        .content {
            max-width: 600px; /* Сужаем для мобильного вида как на скрине */
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 15px;
        }

        /* Плашки */
        .card {
            background-color: #2C2C2E; /* Тон плашки (Apple Dark Grey) */
            height: 180px;
            position: relative;
            overflow: hidden; /* Обрезаем картинку по краям */
            display: flex;
            align-items: center;
            padding: 25px;
            border: none; /* Без теней и границ, только на контрасте */
        }

        .card-text {
            position: relative;
            z-index: 2;
            width: 60%; /* Ограничиваем текст, чтобы не заезжал на картинку */
        }

        .card-text h2 {
            font-size: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card-text p {
            font-size: 11px;
            color: #8E8E93; /* Серый текст */
            line-height: 1.4;
        }

        /* Картинки */
        .card-img {
            position: absolute;
            right: -10px; /* Прижимаем вправо */
            bottom: -15px; /* Урезаем низ */
            height: 130%; /* Увеличиваем масштаб */
            z-index: 1;
        }

        .card-img img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* Ховер эффект в стиле Minecraft */
        .card:hover {
            background-color: #3A3A3C;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>Pixel</div>
        <a href="https://t.me/pixel" class="tg-link">
            <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="tg">
        </a>
    </header>

    <div class="content">
        <div class="card">
            <div class="card-text">
                <h2>Создать скин</h2>
                <p>Настройте внешний вид своего персонажа с помощью пиксельного редактора.</p>
            </div>
            <div class="card-img">
                <img src="Logos/skin.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать блок</h2>
                <p>Создавайте уникальные текстуры и свойства для новых игровых блоков.</p>
            </div>
            <div class="card-img">
                <img src="Logos/block.PNG" alt="">
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Создать предмет</h2>
                <p>Добавляйте кастомное оружие, инструменты и редкие артефакты.</p>
            </div>
            <div class="card-img">
                <img src="Logos/item.PNG" alt="">
            </div>
        </div>
    </div>

</body>
</html>
