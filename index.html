<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWGOH Premium FAQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --nav-bg: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER SECTION --- */
        .header-container {
            /* Увеличили отступ сверху для свободы */
            padding: calc(var(--safe-top) + 40px) 24px 20px;
            z-index: 10;
        }

        .welcome-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .welcome-light {
            opacity: 0.5;
            font-weight: 400;
            font-size: 24px;
        }

        /* --- CONTENT SYSTEM --- */
        .content-view {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 0 20px;
            display: none;
            /* Запас снизу, чтобы контент не перекрывался подвалом */
            padding-bottom: 160px;
        }

        .content-view.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SWGOH WIDGETS --- */
        .widget-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .widget-card {
            background: var(--tg-secondary-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .widget-label { font-size: 11px; color: var(--tg-hint); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .widget-value { font-size: 22px; font-weight: 800; margin-top: 8px; color: var(--tg-accent); }

        /* --- NAV ISLAND --- */
        .nav-wrapper {
            position: fixed;
            /* Опустили чуть ниже к краю */
            bottom: calc(15px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 220px; 
            height: 66px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 33px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .blob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            margin-top: -25px;
            left: 10px;
            transition: left 0.6s cubic-bezier(0.23, 1, 0.32, 1), transform 0.3s ease;
        }

        .nav-item {
            position: relative;
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.4;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .nav-item.active img { 
            opacity: 1; 
            transform: scale(1.1);
        }

        /* Твое условие: кнопки не темнеют */
        .nav-item:active { opacity: 1; }

        /* --- SEARCH BAR --- */
        .search-container {
            padding-top: 20px;
        }
        
        .search-bar {
            width: 100%;
            background: var(--tg-secondary-bg);
            border: none;
            border-radius: 15px;
            padding: 16px 20px;
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stretch-right { transform: scaleX(1.25) !important; }
        .stretch-left { transform: scaleX(1.25) !important; }

    </style>
</head>
<body>

    <div id="view-0" class="content-view active">
        <div class="header-container">
            <div class="welcome-text">
                <span class="welcome-light" id="user-hello">Привет,</span><br>
                <span id="user-name">Лидер</span>!
            </div>
        </div>
        
        <div class="widget-grid">
            <div class="widget-card">
                <div class="widget-label">Энергия</div>
                <div class="widget-value">600/600</div>
            </div>
            <div class="widget-card">
                <div class="widget-label">Купоны</div>
                <div class="widget-value">Max</div>
            </div>
        </div>

        <div style="opacity: 0.6; font-size: 14px; padding-left: 5px;">Разделы базы:</div>
        </div>

    <div id="view-1" class="content-view">
        <div class="header-container">
            <div class="welcome-text">Поиск</div>
        </div>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Найти гайд или сокращение..." id="search-input">
        </div>
    </div>

    <div id="view-2" class="content-view">
        <div class="header-container">
            <div class="welcome-text">Аналитика</div>
        </div>
        <div class="widget-card" style="margin-top: 20px;">
            <div class="widget-label">Прогресс гильдии</div>
            <div class="widget-value">Top 10%</div>
        </div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item active" id="tab-0" onclick="switchTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="switchTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            
            <div class="nav-item" id="tab-2" onclick="switchTab(2)">
                <img src="https://cdn-icons-png.flaticon.com/512/7640/7640102.png" alt="analytics">
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Попытка войти в настоящий Fullscreen
        tg.ready();
        try {
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            } else {
                tg.expand();
            }
        } catch (e) {
            tg.expand();
        }

        // Настройка цветов под ТГ
        tg.setHeaderColor(tg.themeParams.bg_color || '#000000');
        tg.setBackgroundColor(tg.themeParams.bg_color || '#000000');

        // Имя пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }

        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.content-view');
        let currentIndex = 0;

        function switchTab(index) {
            if (index === currentIndex) {
                tg.HapticFeedback.impactOccurred('rigid');
                return;
            }

            const targetItem = document.getElementById(`tab-${index}`);
            
            // Анимация растяжения
            blob.classList.add(index > currentIndex ? 'stretch-right' : 'stretch-left');
            
            // Двигаем блоб
            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            // Переключаем контент
            items.forEach(item => item.classList.remove('active'));
            targetItem.classList.add('active');

            views.forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${index}`).classList.add('active');

            currentIndex = index;

            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 300);
            
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Центрируем блоб при загрузке
        window.addEventListener('load', () => {
            const initialTab = document.getElementById('tab-0');
            const targetX = initialTab.offsetLeft + (initialTab.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
        });
    </script>
</body>
</html>
