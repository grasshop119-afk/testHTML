<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Pro Drag</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.12);
            --pill-border-moving: rgba(255, 255, 255, 0.25);
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            touch-action: none;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            justify-content: space-around;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.2s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.2s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            box-sizing: border-box;
            border: 1px solid transparent;
            will-change: transform, left, width;
        }

        .liquid-slider.flying {
            background-color: transparent !important;
            border-color: var(--pill-border-moving);
            transition: background-color 0.16s, border-color 0.16s;
        }

        .liquid-slider.dragging {
            background-color: transparent !important;
            border-color: var(--pill-border-moving);
            height: calc(100% + 4px);
            top: -2px;
            transition: background-color 0.2s, border-color 0.2s, height 0.3s, top 0.3s;
        }
    </style>
</head>
<body>

<div class="tab-bar-container" id="dragZone">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },    
        scale: { k: 420, d: 24, m: 1 },
        dragSpring: { k: 280, d: 22, m: 1 } 
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');
    const tabBar = document.getElementById('tabBar');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        isDragging: false,
        intensity: 1,
        currentIndex: 0,
        lastMouseX: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        if (!state.isDragging) {
            const dist = Math.abs(state.x - state.tx);
            if (state.isMoving) {
                if (dist > 15) { 
                    slider.classList.add('flying');
                    state.tsy = 1 + (0.27 * state.intensity); 
                    state.tsx = 1 - (0.10 * state.intensity); 
                } else if (dist <= 15 && dist > 0.5) {
                    slider.classList.remove('flying');
                    state.tsy = 1 - (0.05 * state.intensity); 
                    state.tsx = 1 + (0.08 * state.intensity); 
                } else {
                    state.tsx = 1; state.tsy = 1;
                    if (Math.abs(state.vx) < 0.2) {
                        state.isMoving = false;
                        slider.classList.remove('flying');
                    }
                }
            }
            [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
            [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
            [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
            [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);
        } else {
            [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.dragSpring);
            [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.dragSpring);
        }

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - state.currentIndex);
        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.6;
            state.isMoving = true;
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    let longPressTimer;
    let dragOffset = 0;

    function startDrag(e) {
        const touch = e.touches ? e.touches[0] : e;
        const rect = slider.getBoundingClientRect();
        dragOffset = touch.clientX - rect.left;

        longPressTimer = setTimeout(() => {
            state.isDragging = true;
            state.isMoving = false;
            slider.classList.add('dragging');
            state.tsx = 1.05; 
            state.tsy = 1.05;
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }, 200);
    }

    function handleMove(e) {
        const touch = e.touches ? e.touches[0] : e;
        if (!state.isDragging) {
            clearTimeout(longPressTimer);
            return;
        }
        
        const rect = tabBar.getBoundingClientRect();
        let newX = touch.clientX - rect.left - dragOffset;
        newX = Math.max(4, Math.min(newX, rect.width - state.w - 4));

        const speed = touch.clientX - state.lastMouseX;
        if (Math.abs(speed) > 0.5) {
            // Увеличено сплющивание на 5% (было 0.005/0.003 -> стало 0.008/0.005)
            state.tsx = 1.05 + (Math.abs(speed) * 0.008);
            state.tsy = 1.05 - (Math.abs(speed) * 0.005);
        } else {
            state.tsx = 1.05;
            state.tsy = 1.05;
        }

        state.x = newX;
        state.lastMouseX = touch.clientX;

        // ВЫБОР ИКОНКИ В ПРОЦЕССЕ (Live selection)
        let closestTab = tabs[0];
        let minDist = Infinity;
        tabs.forEach(tab => {
            const d = Math.abs(state.x - tab.offsetLeft);
            if (d < minDist) { minDist = d; closestTab = tab; }
        });

        if (parseInt(closestTab.dataset.index) !== state.currentIndex) {
            tabs.forEach(t => t.classList.remove('active'));
            closestTab.classList.add('active');
            state.currentIndex = parseInt(closestTab.dataset.index);
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    function endDrag() {
        clearTimeout(longPressTimer);
        if (!state.isDragging) return;

        state.isDragging = false;
        slider.classList.remove('dragging');
        
        // Финальная фиксация на уже выбранной в процессе вкладке
        const currentActive = document.querySelector('.tab-item.active');
        setActive(currentActive);
    }

    tabs.forEach(tab => {
        tab.addEventListener('mousedown', startDrag);
        tab.addEventListener('touchstart', startDrag, {passive: true});
        tab.addEventListener('click', () => { if(!state.isDragging) setActive(tab); });
    });

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    const initial = document.querySelector('.tab-item.active');
    state.tw = initial.offsetWidth;
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
