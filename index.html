<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Realtime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.12);
            --pill-border-moving: rgba(255, 255, 255, 0.25);
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            touch-action: none;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            justify-content: space-around;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.2s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.2s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            box-sizing: border-box;
            border: 1px solid transparent;
            will-change: transform, left, width, background-color, border-color;
            transition: background-color 0.16s ease, border-color 0.16s ease, height 0.25s, top 0.25s;
        }

        .liquid-slider.flying {
            background-color: transparent !important;
            border-color: var(--pill-border-moving);
        }

        .liquid-slider.dragging {
            background-color: transparent !important;
            border-color: var(--pill-border-moving);
            height: calc(100% + 6px); /* */
            top: -3px;
        }
    </style>
</head>
<body>

<div class="tab-bar-container" id="dragZone">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },    
        scale: { k: 420, d: 24, m: 1 },
        dragSpring: { k: 260, d: 20, m: 1 } 
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');
    const tabBar = document.getElementById('tabBar');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        isDragging: false,
        intensity: 1,
        currentIndex: 0,
        lastMouseX: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        if (!state.isDragging) {
            const dist = Math.abs(state.x - state.tx);
            if (state.isMoving) {
                if (dist > 15) { 
                    slider.classList.add('flying');
                    state.tsy = 1 + (0.27 * state.intensity); 
                    state.tsx = 1 - (0.10 * state.intensity); 
                } else {
                    slider.classList.remove('flying');
                    state.tsy = 1 - (0.05 * state.intensity); 
                    state.tsx = 1 + (0.08 * state.intensity); 
                }
            }
            [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
            [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        } else {
            [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.dragSpring);
            [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.dragSpring);
        }

        if (!state.isDragging) {
            [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
            [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);
        }

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function selectTabDirect(index) {
        if (state.currentIndex === index) return;
        tabs.forEach((t, i) => {
            t.classList.toggle('active', i === index);
        });
        state.currentIndex = index;
        state.tw = tabs[index].offsetWidth;
        state.tx = tabs[index].offsetLeft;
        if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.selectionChanged();
    }

    let longPressTimer;
    let dragOffset = 0;

    function startDrag(e) {
        const touch = e.touches ? e.touches[0] : e;
        const rect = slider.getBoundingClientRect();
        dragOffset = touch.clientX - rect.left;

        longPressTimer = setTimeout(() => {
            state.isDragging = true;
            state.isMoving = false;
            slider.classList.add('dragging');
            state.tsx = 1.05; state.tsy = 1.05;
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }, 200);
    }

    function handleMove(e) {
        const touch = e.touches ? e.touches[0] : e;
        if (!state.isDragging) {
            clearTimeout(longPressTimer);
            return;
        }
        
        const rect = tabBar.getBoundingClientRect();
        let newX = touch.clientX - rect.left - dragOffset;
        newX = Math.max(4, Math.min(newX, rect.width - state.w - 4));

        // Физика деформации (+5% к сплющиванию)
        const speed = Math.abs(touch.clientX - state.lastMouseX);
        if (speed > 1) {
            state.tsx = 1 + (speed * 0.008); // Увеличенное растяжение
            state.tsy = 1 - (speed * 0.005); // Увеличенное сплющивание
        } else {
            state.tsx = 1.05; state.tsy = 1.05;
        }

        state.x = newX;
        state.lastMouseX = touch.clientX;

        // РЕАЛЬНОЕ ВРЕМЯ: Проверяем, над какой иконкой центр пузырька
        const bubbleCenter = state.x + (state.w / 2);
        tabs.forEach((tab, i) => {
            const tabStart = tab.offsetLeft;
            const tabEnd = tabStart + tab.offsetWidth;
            if (bubbleCenter >= tabStart && bubbleCenter <= tabEnd) {
                selectTabDirect(i);
            }
        });
    }

    function endDrag() {
        clearTimeout(longPressTimer);
        if (!state.isDragging) return;

        state.isDragging = false;
        slider.classList.remove('dragging');
        
        // Приземляемся точно в текущую активную вкладку
        const currentActive = document.querySelector('.tab-item.active');
        state.tx = currentActive.offsetLeft;
        state.tw = currentActive.offsetWidth;
        state.isMoving = true;
    }

    tabs.forEach((tab, i) => {
        tab.addEventListener('mousedown', startDrag);
        tab.addEventListener('touchstart', startDrag, {passive: true});
        tab.addEventListener('click', () => { 
            if(!state.isDragging) {
                selectTabDirect(i);
                state.isMoving = true;
            }
        });
    });

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    // Initial load
    const initial = tabs[0];
    state.tw = initial.offsetWidth;
    state.x = initial.offsetLeft;
    state.tx = initial.offsetLeft;
    requestAnimationFrame(update);
</script>

</body>
</html>
