<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Glass</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            /* Базовая заливка пузырька */
            --pill-bg: rgba(255, 255, 255, 0.1); 
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            display: flex;
            justify-content: center;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            justify-content: space-around;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
            transform: none !important; /* Иконки не двигаются */
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.25s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        /* Эффект "жидкого стекла" (Liquid Glass) */
        .liquid-glass-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            box-sizing: border-box;
            will-change: transform, left, width, background, filter;
            
            /* Создаем многослойное стекло с преломлением */
            overflow: hidden; /* Важно для обрезки эффектов внутри */
            border: 0.5px solid rgba(255, 255, 255, 0.05);

            /* Быстрый переход для включения/выключения эффекта */
            transition: background 0.15s ease, filter 0.15s ease;
        }

        /* Слой "хроматического преломления" (Радужное свечение по краям) */
        .liquid-glass-slider::before {
            content: '';
            position: absolute;
            inset: -20px; /* Выходим за пределы, чтобы поймать край */
            background: conic-gradient(
                from 180deg at 50% 50%,
                rgba(255, 0, 0, 0.2) 0deg,
                rgba(255, 255, 0, 0.2) 60deg,
                rgba(0, 255, 0, 0.2) 120deg,
                rgba(0, 255, 255, 0.2) 180deg,
                rgba(0, 0, 255, 0.2) 240deg,
                rgba(255, 0, 255, 0.2) 300deg,
                rgba(255, 0, 0, 0.2) 360deg
            );
            /* Усиливаем контраст на гранях для получения "жидкого" эффекта */
            filter: blur(10px) contrast(15);
            opacity: 0; /* Невидимый в покое */
            transition: opacity 0.2s ease;
        }

        /* Состояние ПОЛЕТА: Активируем "жидкое стекло" */
        .liquid-glass-slider.flying {
            background: rgba(255, 255, 255, 0.05); /* Уменьшаем заливку */
            filter: saturate(200%); /* Усиливаем цвета */
        }

        .liquid-glass-slider.flying::before {
            opacity: 1; /* Проявление радужных граней */
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-glass-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },    
        scale: { k: 420, d: 24, m: 1 }   
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        intensity: 1,
        currentIndex: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        const vel = Math.abs(state.vx);

        if (state.isMoving) {
            if (dist > 15) { 
                // ПОЛЕТ (Включаем жидкое стекло)
                slider.classList.add('flying');
                // Рост на дальних дистанциях +5%
                state.tsy = 1 + ((0.22 + (state.intensity === 1 ? 0.05 : 0)) * state.intensity); 
                state.tsx = 1 - (0.10 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                // ПРИЗЕМЛЕНИЕ (Деликатное сплющивание 8-10%)
                slider.classList.remove('flying');
                state.tsy = 1 - (0.05 * state.intensity); 
                state.tsx = 1 + (0.08 * state.intensity); 
            } else {
                state.tsx = 1;
                state.tsy = 1;
                if (vel < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - (state.currentIndex || 0));

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx;
            state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.6;
            state.isMoving = true;

            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));

    const initial = document.querySelector('.tab-item.active');
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
