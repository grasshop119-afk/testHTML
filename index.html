<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.85);
            --active-accent: #3da9ff;
            --text-inactive: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-bar-container {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 40px 16px; 
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border-radius: 40px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            overflow: visible; 
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 10px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            min-width: 95px;
            cursor: pointer;
            outline: none;
            transform: none !important;
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: var(--text-inactive);
            transition: fill 0.15s ease;
            pointer-events: none;
        }

        .tab-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-inactive);
            transition: color 0.15s ease;
            pointer-events: none;
        }

        .tab-item.active .tab-icon { fill: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 35px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, left, width;
        }

        .search-btn {
            background: var(--tab-bar-bg);
            backdrop-filter: blur(30px);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span class="tab-text">Вызовы</span>
        </button>

        <button class="tab-item" data-index="1">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="tab-text">Контакты</span>
        </button>

        <button class="tab-item" data-index="2">
            <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="7" cy="7" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
            <span class="tab-text">Клавиши</span>
        </button>
    </nav>

    <div class="search-btn" id="searchBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </div>
</div>

<script>
    // Разогнанная физика для мгновенного отклика
    const PHYSICS = {
        pos: { k: 550, d: 42, m: 1 },    // Еще быстрее позиция
        scale: { k: 850, d: 30, m: 1 }   // Экстремально резкая шкала
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        intensity: 1,
        currentIndex: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        const vel = Math.abs(state.vx);

        if (state.isMoving) {
            // Динамическая смена таргетов формы в зависимости от расстояния
            if (dist > 12) { 
                // 1) ВЗЛЕТ И ПОЛЕТ (одновременно быстро)
                state.tsy = 1 + (0.35 * state.intensity); 
                state.tsx = 1 - (0.25 * state.intensity); 
            } else if (dist <= 12 && dist > 0.5) {
                // 2) УДАР / ПРИЗЕМЛЕНИЕ (резко расплющивается)
                state.tsy = 1 - (0.3 * state.intensity); 
                state.tsx = 1 + (0.4 * state.intensity); 
            } else {
                // 3) ВОЗВРАТ В НОРМУ + МИКРО-СЖАТИЕ (пружина сама сделает отскок)
                state.tsx = 1;
                state.tsy = 1;
                
                // Если скорость почти нулевая — гасим
                if (vel < 0.5 && Math.abs(state.vsx) < 0.5) {
                    state.isMoving = false;
                }
            }
        }

        // Применяем физику
        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        // Рендер
        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - (state.currentIndex || 0));

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx;
            state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.55;
            state.isMoving = true;

            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));

    // Инициализация
    const initial = document.querySelector('.tab-item.active');
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
