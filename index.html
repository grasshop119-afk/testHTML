<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APixel - Mojang Style Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Основные стили Mojang */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Отключаем плавное сглаживание для всего */
            -webkit-font-smoothing: none;
            font-smooth: never;
            image-rendering: pixelated; /* Для всех картинок */
        }

        body {
            background-color: #101015; /* Глубокий темный фон */
            color: #ffffff;
            font-family: 'Press Start 2P', cursive; /* Пиксельный шрифт */
            line-height: 1.4;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка */
        .navbar {
            background-color: #3c3c4a; /* Светлее фона, без тени */
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 4px double #5c5c6a; /* Пиксельная граница */
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .letter-a {
            color: #ffcc00; /* Желтая буква А */
        }

        .tg-link img {
            width: 32px;
            height: 32px;
            filter: invert(1); /* Белая иконка */
            transition: opacity 0.1s; /* Быстрый переход */
        }

        .tg-link img:hover {
            opacity: 0.7;
        }

        /* Основной контент */
        .main-content {
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Три плашки в ряд */
            gap: 25px;
            padding-bottom: 80px;
        }

        /* Плашки */
        .card {
            background-color: #3c3c4a; /* Светлее фона, без тени */
            border: 4px double #5c5c6a; /* Жесткая пиксельная граница */
            position: relative;
            height: 350px; /* Высота плашки */
            overflow: hidden; /* Ключевой момент для обрезки */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Текст внизу */
            padding: 30px;
            transition: transform 0.1s; /* Жесткая анимация */
        }

        .card:hover {
            transform: translateY(-5px); /* Легкий подъем */
            background-color: #4c4c5a;
        }

        /* Контейнер урезанной картинки PNG */
        .card-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card-image-container img {
            position: absolute;
            width: 160%; /* Картинка огромная */
            height: auto;
            image-rendering: pixelated; /* Сохраняет пиксели */
            opacity: 0.9;
        }

        /* Позиционирование каждой картинки (чтобы урезать низ и право) */
        .skin-img img {
            bottom: -50px; /* Урезаем низ */
            right: -60px;  /* Урезаем право */
        }

        .block-img img {
            bottom: -80px; /* Урезаем низ */
            right: -100px; /* Урезаем право */
        }

        .item-img img {
            bottom: -30px; /* Урезаем низ */
            right: -50px;  /* Урезаем право */
        }

        /* Текст внутри плашки */
        .card-info {
            position: relative;
            z-index: 10;
        }

        .card-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ffffff;
            line-height: 1.2;
            text-transform: uppercase; /* Все заглавные */
        }

        .card-desc {
            font-size: 10px; /* Маленький пиксельный текст */
            color: #aaaaaa; /* Серый текст описания */
            max-width: 250px;
            line-height: 1.6;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr; /* Одна плашка на строку */
            }

            .card {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container header-content">
            <div class="logo">
                <span class="letter-a">A</span>Pixel
            </div>
            <a href="https://t.me/your_link" target="_blank" class="tg-link">
                <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/send-icon-svg-download-png-14350353.png?f=webp&w=512" alt="Telegram">
            </a>
        </div>
    </header>

    <main class="container main-content">
        <section class="card">
            <div class="card-image-container skin-img">
                <img src="Logos/skin.PNG" alt="Skin">
            </div>
            <div class="card-info">
                <h2 class="card-title">Создать скин</h2>
                <p class="card-desc">Персонализируйте персонажа уникальным дизайном.</p>
            </div>
        </section>

        <section class="card">
            <div class="card-image-container block-img">
                <img src="Logos/block.PNG" alt="Block">
            </div>
            <div class="card-info">
                <h2 class="card-title">Создать блок</h2>
                <p class="card-desc">Разработайте новые текстуры строительных элементов.</p>
            </div>
        </section>

        <section class="card">
            <div class="card-image-container item-img">
                <img src="Logos/item.PNG" alt="Item">
            </div>
            <div class="card-info">
                <h2 class="card-title">Создать предмет</h2>
                <p class="card-desc">Добавьте кастомные инструменты, оружие или ресурсы.</p>
            </div>
        </section>
    </main>

</body>
</html>
