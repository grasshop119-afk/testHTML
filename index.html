<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skinx — MC Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent);
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #editor-container {
            position: relative;
            background: #ffffff10;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            image-rendering: pixelated;
            border: 4px solid var(--card);
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        /* Grid Overlay (Сетка частей тела) */
        #grid-overlay {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Toolbar */
        .toolbar {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            border-radius: var(--radius);
            display: flex;
            gap: 10px;
            justify-content: space-around;
            align-items: center;
        }

        .tool-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            transition: 0.2s;
        }

        .tool-btn.active {
            background: var(--accent);
            transform: scale(1.1);
        }

        .color-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 3px solid #fff;
            position: relative;
            overflow: hidden;
        }

        #colorPicker {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            cursor: pointer;
        }

        /* Footer Actions */
        .actions {
            padding: 0 20px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-main {
            background: var(--accent);
            border: none;
            color: white;
            padding: 15px;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #334155;
            color: white;
            padding: 15px;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div></div>
        <h1>SKINX</h1>
        <button class="tool-btn" id="toggleGrid"><i data-lucide="grid-3x3"></i></button>
    </header>

    <main>
        <div id="editor-container">
            <canvas id="skinCanvas" width="64" height="64"></canvas>
            <canvas id="grid-overlay" width="64" height="64"></canvas>
        </div>
    </main>

    <div class="toolbar">
        <div class="color-circle">
            <input type="color" id="colorPicker" value="#3b82f6">
        </div>
        <button class="tool-btn active" id="brushTool"><i data-lucide="pencil"></i></button>
        <button class="tool-btn" id="eraserTool"><i data-lucide="eraser"></i></button>
        <button class="tool-btn" id="fillTool"><i data-lucide="paint-bucket"></i></button>
        <button class="tool-btn" id="clearBtn"><i data-lucide="trash-2"></i></button>
    </div>

    <div class="actions">
        <button class="btn-outline" onclick="changeCanvasSize()">Slim / Std</button>
        <button class="btn-main" onclick="exportSkin()">
            <i data-lucide="download"></i> Сохранить
        </button>
    </div>

    <script>
        // Инициализация иконок
        lucide.createIcons();

        const canvas = document.getElementById('skinCanvas');
        const ctx = canvas.getContext('2d');
        const gridCanvas = document.getElementById('grid-overlay');
        const gctx = gridCanvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');

        let currentTool = 'brush';
        let isDrawing = false;
        const scale = 5; // Коэффициент отображения для расчета координат

        // Настройка размера под экран
        const size = Math.min(window.innerWidth - 40, 350);
        canvas.style.width = canvas.style.height = size + 'px';
        gridCanvas.style.width = gridCanvas.style.height = size + 'px';

        // Рисуем сетку-подсказку (стандартная развертка Minecraft)
        function drawGrid() {
            gctx.clearRect(0, 0, 64, 64);
            gctx.strokeStyle = "white";
            gctx.lineWidth = 0.5;
            // Голова (8x8 сверху)
            gctx.strokeRect(8, 0, 8, 8); // Лицо
            gctx.strokeRect(20, 20, 8, 12); // Тело
        }
        drawGrid();

        // Функции рисования
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.floor((clientX - rect.left) / (rect.width / 64)),
                y: Math.floor((clientY - rect.top) / (rect.height / 64))
            };
        }

        function handleAction(e) {
            if (!isDrawing) return;
            const {x, y} = getPos(e);
            
            if (currentTool === 'brush') {
                ctx.fillStyle = colorPicker.value;
                ctx.fillRect(x, y, 1, 1);
            } else if (currentTool === 'eraser') {
                ctx.clearRect(x, y, 1, 1);
            } else if (currentTool === 'fill') {
                floodFill(x, y, colorPicker.value);
            }
        }

        // Простая заливка
        function floodFill(startX, startY, fillColor) {
            const targetColor = ctx.getImageData(startX, startY, 1, 1).data;
            // Реализация заливки требует итеративного обхода, 
            // для MVP ограничимся закрашиванием пикселя или использованием библиотеки.
            // Но в целях обучения оставим пока просто рисование.
            ctx.fillStyle = fillColor;
            ctx.fillRect(startX, startY, 1, 1);
        }

        // Event Listeners
        const start = (e) => { isDrawing = true; handleAction(e); };
        const stop = () => isDrawing = false;

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, {passive: false});
        window.addEventListener('mouseup', stop);
        window.addEventListener('touchend', stop);
        canvas.addEventListener('mousemove', handleAction);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleAction(e); }, {passive: false});

        // Переключение инструментов
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.id === 'clearBtn') {
                    if(confirm("Очистить холст?")) ctx.clearRect(0,0,64,64);
                    return;
                }
                if (this.id === 'toggleGrid') {
                    gridCanvas.style.display = gridCanvas.style.display === 'none' ? 'block' : 'none';
                    return;
                }
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTool = this.id.replace('Tool', '');
            });
        });

        function exportSkin() {
            const link = document.createElement('a');
            link.download = 'skinx-export.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
            
            // Если мы в Telegram Mini App
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        }

        function changeCanvasSize() {
            alert("Переключение между Slim (Alex) и Standard (Steve). Влияет на разметку сетки.");
        }
    </script>
</body>
</html>
