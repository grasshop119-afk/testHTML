<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jelly Premium Nav</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.12);
            --island-w: 200px;
            --expanded-w: 90vw;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Контент */
        .content-view {
            position: absolute;
            inset: 0;
            display: none;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        .content-view.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- NAVIGATION --- */
        .nav-container {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: var(--island-w);
            height: 64px;
            z-index: 1000;
            /* Мармеладный переход всей панели */
            transition: width 0.4s cubic-bezier(0.3, 1.4, 0.4, 1);
        }

        .nav-container.expanded {
            width: var(--expanded-w);
        }

        .nav-bg {
            position: absolute;
            inset: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 1;
        }

        .blob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            background: var(--tg-accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            /* Блоб перемещается быстро и плавно */
            transition: left 0.3s cubic-bezier(0.3, 1.4, 0.4, 1), 
                        width 0.3s ease, height 0.3s ease;
        }

        /* Контейнер иконок */
        .icons-box {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Расстояние в обычном режиме */
            transition: gap 0.4s cubic-bezier(0.3, 1.4, 0.4, 1), 
                        transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .nav-container.expanded .icons-box {
            gap: 60px; /* Расстояние в развернутом режиме */
        }

        .nav-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.2s ease;
        }

        .nav-item img, .pfp-mini {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.35;
            transition: opacity 0.3s, transform 0.3s;
        }

        .nav-item.active img, .nav-item.active .pfp-mini {
            opacity: 1;
            transform: scale(1.1);
        }

        .pfp-mini { border-radius: 50%; background-size: cover; filter: grayscale(1); background-color: #444; }
        .nav-item.active .pfp-mini { filter: none; border: 1.5px solid white; }
    </style>
</head>
<body>

    <div id="view-0" class="content-view active"><h1>Дом</h1></div>
    <div id="view-1" class="content-view"><h1>Поиск</h1></div>
    <div id="view-2" class="content-view"><h1>Профиль</h1></div>

    <div class="nav-container" id="navMain">
        <div class="nav-bg"></div>
        <div class="blob" id="activeBlob"></div>
        <div class="icons-box" id="iconsBox">
            <div class="nav-item active" onclick="handleTap(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png">
            </div>
            <div class="nav-item" onclick="handleTap(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png">
            </div>
            <div class="nav-item" onclick="handleTap(2)">
                <div class="pfp-mini" id="nav-pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const nav = document.getElementById('navMain');
        const box = document.getElementById('iconsBox');
        const blob = document.getElementById('activeBlob');
        const items = document.querySelectorAll('.nav-item');
        
        let currentIndex = 0;
        let isExpanded = false;
        let pressTimer;
        let startX = 0;
        let currentScrollX = 0;

        if (tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // Управление положением блоба
        function updateBlobPos() {
            if (isExpanded) {
                blob.style.left = '50%';
            } else {
                const activeItem = items[currentIndex];
                const boxRect = box.getBoundingClientRect();
                const itemRect = activeItem.getBoundingClientRect();
                const relativeLeft = itemRect.left - boxRect.left + (itemRect.width / 2);
                blob.style.left = `${relativeLeft}px`;
            }
        }

        nav.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            pressTimer = setTimeout(() => {
                isExpanded = true;
                nav.classList.add('expanded');
                tg.HapticFeedback.impactOccurred('medium');
                updateBlobPos();
                // Фиксируем смещение, чтобы активная иконка была в центре
                syncScroll();
            }, 300);
        });

        window.addEventListener('touchmove', (e) => {
            const moveX = e.touches[0].clientX - startX;

            if (isExpanded) {
                // Движение МЕЖДУ иконками
                const sensitivity = 0.8;
                const gapWidth = 100; // Примерное расстояние между центрами в expanded
                
                let targetX = (moveX * sensitivity) - (currentIndex * gapWidth);
                
                // Эластичность на краях
                const maxX = 0;
                const minX = -(items.length - 1) * gapWidth;
                if (targetX > maxX) targetX *= 0.3;
                if (targetX < minX) targetX = minX + (targetX - minX) * 0.3;

                currentScrollX = targetX;
                box.style.transform = `translateX(${currentScrollX}px)`;

                // Переключение иконок под пальцем
                const nearest = Math.max(0, Math.min(items.length - 1, Math.round(-currentScrollX / gapWidth)));
                if (nearest !== currentIndex) {
                    currentIndex = nearest;
                    updateActive(currentIndex);
                    tg.HapticFeedback.selectionChanged();
                }
            } else {
                if (Math.abs(moveX) > 10) clearTimeout(pressTimer);
            }
        });

        window.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
            if (isExpanded) {
                isExpanded = false;
                nav.classList.remove('expanded');
                box.style.transform = 'translateX(0)';
                updateBlobPos();
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        function handleTap(index) {
            if (!isExpanded) {
                currentIndex = index;
                updateActive(index);
                updateBlobPos();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function updateActive(index) {
            items.forEach((item, i) => item.classList.toggle('active', i === index));
            document.querySelectorAll('.content-view').forEach((v, i) => v.classList.toggle('active', i === index));
        }

        function syncScroll() {
            const gapWidth = 100;
            currentScrollX = -currentIndex * gapWidth;
            box.style.transform = `translateX(${currentScrollX}px)`;
        }

        // Инициализация
        window.onload = () => {
            setTimeout(updateBlobPos, 100);
        };
    </script>
</body>
</html>
