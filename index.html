<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apple Liquid Lens TabBar</title>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-border-moving: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        /* Контейнер панели */
        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            position: relative;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            overflow: hidden; /* Важно для работы маски */
        }

        /* Слой 1: Неактивные (серые) иконки */
        .static-icons {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            display: flex;
            justify-content: space-around;
            z-index: 1;
            pointer-events: none;
        }

        /* Слой 2: Активные (цветные) иконки, которые проявит линза */
        .active-icons-layer {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            display: flex;
            justify-content: space-around;
            z-index: 3;
            pointer-events: none;
            /* Эта часть будет видна только через пузырек */
            clip-path: inset(0 0 0 0); 
        }

        .tab-item-visual {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
        }

        /* Невидимые кнопки для кликов */
        .click-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            z-index: 10;
        }
        .click-target { flex: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }

        .icon-img {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
        }

        /* Цвета слоев */
        .static-icons .icon-img { background-color: var(--inactive-color); }
        .static-icons .tab-text { color: var(--inactive-color); font-size: 10px; font-weight: 500; }

        .active-icons-layer .icon-img { background-color: var(--active-accent); }
        .active-icons-layer .tab-text { color: var(--active-accent); font-size: 10px; font-weight: 500; }

        /* Пузырек-линза */
        .liquid-lens {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 34px;
            z-index: 2;
            pointer-events: none;
            box-sizing: border-box;
            border: 1px solid transparent;
            
            /* Эффект преломления и деформации */
            backdrop-filter: blur(10px) brightness(1.1) scale(1.05);
            -webkit-backdrop-filter: blur(10px) brightness(1.1);
            
            will-change: transform, left, width, border-color;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .liquid-lens.flying {
            border-color: var(--pill-border-moving);
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <div class="ios-tab-bar">
        <div class="static-icons">
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
                <span class="tab-text">Главная</span>
            </div>
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
                <span class="tab-text">Меню</span>
            </div>
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
                <span class="tab-text">Настройки</span>
            </div>
        </div>

        <div class="liquid-lens" id="lens"></div>

        <div class="active-icons-layer" id="activeLayer">
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
                <span class="tab-text">Главная</span>
            </div>
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
                <span class="tab-text">Меню</span>
            </div>
            <div class="tab-item-visual">
                <div class="icon-img" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
                <span class="tab-text">Настройки</span>
            </div>
        </div>

        <div class="click-layer">
            <div class="click-target" data-index="0"></div>
            <div class="click-target" data-index="1"></div>
            <div class="click-target" data-index="2"></div>
        </div>
    </div>
</div>

<script>
    const lens = document.getElementById('lens');
    const activeLayer = document.getElementById('activeLayer');
    const targets = document.querySelectorAll('.click-target');

    const PHYSICS = {
        pos: { k: 380, d: 38, m: 1 },
        scale: { k: 420, d: 24, m: 1 }
    };

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false, intensity: 1
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        
        if (state.isMoving) {
            if (dist > 10) {
                lens.classList.add('flying');
                state.tsy = 1 + (0.27 * state.intensity); 
                state.tsx = 1 - (0.10 * state.intensity);
            } else {
                lens.classList.remove('flying');
                state.tsy = 1 - (0.05 * state.intensity);
                state.tsx = 1 + (0.08 * state.intensity);
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        // Двигаем линзу
        lens.style.left = `${state.x}px`;
        lens.style.width = `${state.w}px`;
        lens.style.transform = `scale(${state.sx}, ${state.sy})`;

        // ГЛАВНЫЙ СЕКРЕТ: Обрезаем цветной слой точно по границам линзы
        // Используем clip-path, чтобы показать цветные иконки только под пузырьком
        const left = state.x;
        const right = state.x + state.w;
        activeLayer.style.clipPath = `inset(0 calc(100% - ${right}px) 0 ${left}px)`;

        requestAnimationFrame(update);
    }

    targets.forEach(t => {
        t.addEventListener('click', () => {
            const idx = parseInt(t.dataset.index);
            state.tx = t.offsetLeft;
            state.tw = t.offsetWidth;
            state.isMoving = true;
            state.intensity = Math.abs(state.x - state.tx) > 150 ? 1 : 0.6;
            
            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        });
    });

    // Инициализация
    const first = targets[0];
    state.x = state.tx = first.offsetLeft;
    state.w = state.tw = first.offsetWidth;
    update();
</script>
</body>
</html>
