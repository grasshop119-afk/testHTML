<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Mini App</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --nav-bg: rgba(255, 255, 255, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER SECTION --- */
        .header-container {
            padding: calc(var(--safe-top) + 20px) 20px 10px;
            height: 80px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .typewriter-box {
            font-size: 26px;
            font-weight: 800;
            white-space: nowrap;
            display: flex;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .welcome-light {
            opacity: 0.5;
            font-weight: 400;
            margin-right: 6px;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-5px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CONTENT SYSTEM --- */
        .content-view {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 20px;
            display: none;
            padding-bottom: 120px;
        }

        .content-view.active {
            display: block;
        }

        /* --- NAV ISLAND --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 200px;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            margin-top: -23px;
            left: 12px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), transform 0.3s ease;
        }

        .stretch-right { transform: scaleX(1.18) !important; }
        .stretch-left { transform: scaleX(1.18) !important; }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .nav-item img {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img { opacity: 1; }

        .pfp-mini {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }

        .active .pfp-mini { opacity: 1; }
    </style>
</head>
<body>

    <div id="view-0" class="content-view active">
        <div class="header-container">
            <div id="header-text" class="typewriter-box"></div>
        </div>
    </div>

    <div id="view-1" class="content-view"></div>
    <div id="view-2" class="content-view"></div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            <div class="nav-item" id="tab-0" onclick="switchTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            <div class="nav-item" id="tab-1" onclick="switchTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            <div class="nav-item" id="tab-2" onclick="switchTab(2)">
                <div class="pfp-mini" id="nav-pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const headerElement = document.getElementById('header-text');
        
        // 1. Получение и обрезка имени
        let userName = tg.initDataUnsafe?.user?.first_name || "User";
        if (userName.length > 10) {
            userName = userName.substring(0, 10) + "...";
        }

        if (tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('nav-pfp').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
        }

        // 2. Эффект печати
        async function runTypewriter() {
            const part1 = "Привет,";
            const part2 = ` ${userName}!`;
            
            // Печатаем "Привет,"
            let currentText = "";
            headerElement.innerHTML = `<span class="welcome-light" id="p1"></span><span id="p2"></span>`;
            const p1 = document.getElementById('p1');
            const p2 = document.getElementById('p2');

            for (let char of part1) {
                p1.textContent += char;
                await new Promise(r => setTimeout(r, 70));
            }

            // Пауза после запятой
            await new Promise(r => setTimeout(r, 300));

            // Печатаем имя
            for (let char of part2) {
                p2.textContent += char;
                await new Promise(r => setTimeout(r, 70));
            }

            // 3. Смена на FAQ через 4 секунды
            setTimeout(() => {
                headerElement.classList.add('fade-out');
                setTimeout(() => {
                    headerElement.innerHTML = "FAQ";
                    headerElement.classList.remove('fade-out');
                    headerElement.classList.add('fade-in');
                }, 600);
            }, 4000);
        }

        // 4. Логика табов
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.content-view');
        let currentIndex = 0;

        function switchTab(index) {
            if (index === currentIndex) {
                tg.HapticFeedback.impactOccurred('rigid'); // Вибрация при повторном клике
                return;
            }

            const targetItem = document.getElementById(`tab-${index}`);
            blob.classList.remove('stretch-right', 'stretch-left');
            
            if (index > currentIndex) blob.classList.add('stretch-right');
            else blob.classList.add('stretch-left');

            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            items.forEach(item => item.classList.remove('active'));
            targetItem.classList.add('active');

            views.forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${index}`).classList.add('active');

            currentIndex = index;
            setTimeout(() => blob.classList.remove('stretch-right', 'stretch-left'), 200);
            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => {
            runTypewriter();
            // Центрируем блоб изначально
            const initialTab = document.getElementById('tab-0');
            blob.style.left = `${initialTab.offsetLeft + (initialTab.offsetWidth / 2) - (blob.offsetWidth / 2)}px`;
        };
    </script>
</body>
</html>
