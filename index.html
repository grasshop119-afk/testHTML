<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tabbar</title>
    <style>
        :root {
            --active-accent: #ffffff;
            --inactive-color: rgba(255, 255, 255, 0.75);
            --p-top: #fff; --p-right: #fff; --p-bottom: #fff; --p-left: #fff;
            --tabbar-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            --slider-bg: rgba(0, 0, 0, 0.42);
        }

        body {
            margin: 0;
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkLiZZofuMdxDrT1-l8xUj0r7hEpeStNzrFqFqgayAjeO5YdDEWEJXo_lQ&s=10') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            position: relative;
        }

        .ios-tab-bar {
            position: relative;
            display: flex;
            padding: 4px;
            justify-content: space-around;
            align-items: center;
            border-radius: 38px;
            background: var(--tabbar-bg);
            border: 1px solid transparent;
            box-shadow: inset 0 1px 3.5px rgba(255, 255, 255, 0.18), 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: background 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            
            /* Смешиваем легкий блюр и SVG-искажение "линзы" */
            backdrop-filter: blur(4px) url(#liquid-lens) saturate(140%);
            -webkit-backdrop-filter: blur(4px) saturate(140%);
        }

        .tab-gradient-layer {
            position: absolute;
            inset: -1px;
            border-radius: 38px;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .tab-gradient-layer::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            border-radius: 38px;
            mask-image: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: xor;
            -webkit-mask-image: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            background: conic-gradient(from 135deg at 50% 50%, var(--p-top) 0%, var(--p-right) 25%, var(--p-bottom) 50%, var(--p-left) 75%, var(--p-top) 100%);
            filter: blur(0.4px);
        }

        .tab-item {
            position: relative;
            z-index: 4;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.25s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--slider-bg);
            border-radius: 34px;
            z-index: 2;
            pointer-events: none;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.12);
            will-change: transform, left, width, background-color, border-color, box-shadow;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .liquid-slider.flying {
            background-color: transparent !important; 
            border: 1.5px solid var(--p-top) !important; /* Контур теперь строго совпадает с таббаром */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); /* Очень легкая, аккуратная тень для объема */
        }
    </style>
</head>
<body>

<svg style="position: absolute; width: 0; height: 0;">
    <filter id="liquid-lens">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="tab-gradient-layer"></div>
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Home</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Menu</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Settings</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = { pos: { k: 380, d: 38, m: 1 }, scale: { k: 420, d: 24, m: 1 } };
    const slider = document.getElementById('slider');
    const tabBar = document.getElementById('tabBar');
    const tabs = document.querySelectorAll('.tab-item');

    let state = { x: 0, tx: 0, vx: 0, w: 0, tw: 0, vw: 0, sx: 1, tsx: 1, vsx: 0, sy: 1, tsy: 1, vsy: 0, isMoving: false, intensity: 1, currentIndex: 0 };
    let isDarkTheme = false;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous"; 
    bgImg.src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkLiZZofuMdxDrT1-l8xUj0r7hEpeStNzrFqFqgayAjeO5YdDEWEJXo_lQ&s=10';

    bgImg.onload = () => {
        canvas.width = bgImg.width; canvas.height = bgImg.height;
        ctx.drawImage(bgImg, 0, 0);
        updateDynamicColors();
    };

    function getPixelColor(clientX, clientY) {
        if (!canvas.width) return [255, 255, 255];
        const imgX = Math.min(canvas.width - 1, Math.max(0, Math.floor((clientX / window.innerWidth) * canvas.width)));
        const imgY = Math.min(canvas.height - 1, Math.max(0, Math.floor((clientY / window.innerHeight) * canvas.height)));
        const data = ctx.getImageData(imgX, imgY, 1, 1).data;
        return [data[0], data[1], data[2]];
    }

    function updateDynamicColors() {
        const rct = tabBar.getBoundingClientRect();
        const cx = rct.left + rct.width / 2;
        const cy = rct.top + rct.height / 2;

        const pLeft   = getPixelColor(rct.left + 15, cy);
        const pTop    = getPixelColor(cx, rct.top + 10);
        const pRight  = getPixelColor(rct.right - 15, cy);
        const pBottom = getPixelColor(cx, rct.bottom - 10);

        const avgBrightness = (
            (pLeft[0]*0.299 + pLeft[1]*0.587 + pLeft[2]*0.114) +
            (pTop[0]*0.299 + pTop[1]*0.587 + pTop[2]*0.114) +
            (pRight[0]*0.299 + pRight[1]*0.587 + pRight[2]*0.114) +
            (pBottom[0]*0.299 + pBottom[1]*0.587 + pBottom[2]*0.114)
        ) / 4;

        const avgR = (pLeft[0] + pTop[0] + pRight[0] + pBottom[0]) / 4;
        const avgG = (pLeft[1] + pTop[1] + pRight[1] + pBottom[1]) / 4;
        const avgB = (pLeft[2] + pTop[2] + pRight[2] + pBottom[2]) / 4;

        const rootStyle = document.documentElement.style;

        if (avgBrightness > 125) { 
            isDarkTheme = true;
            rootStyle.setProperty('--tabbar-bg', 'linear-gradient(180deg, rgba(10, 10, 12, 0.86) 0%, rgba(6, 6, 8, 0.82) 100%)');
            rootStyle.setProperty('--slider-bg', 'rgba(255, 255, 255, 0.24)');
            rootStyle.setProperty('--active-accent', '#ffffff');
            rootStyle.setProperty('--inactive-color', 'rgba(255, 255, 255, 0.45)');
        } else {
            isDarkTheme = false;
            rootStyle.setProperty('--tabbar-bg', 'linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%)');
            rootStyle.setProperty('--slider-bg', 'rgba(0, 0, 0, 0.42)');
            rootStyle.setProperty('--active-accent', '#ffffff');
            rootStyle.setProperty('--inactive-color', 'rgba(255, 255, 255, 0.75)');
        }

        // Общая логика контура: яркий, контрастный цвет (и для таббара, и для капли в полете)
        const getSharedGlowColor = () => {
            const factor = isDarkTheme ? 4.0 : 2.2; 
            const r = Math.min(255, avgR * factor + 50);
            const g = Math.min(255, avgG * factor + 50);
            const b = Math.min(255, avgB * factor + 50);
            const op = isDarkTheme ? 0.95 : 0.85; 
            return `rgba(${r}, ${g}, ${b}, ${op})`;
        };

        const sharedColor = getSharedGlowColor();

        rootStyle.setProperty('--p-top', sharedColor);
        rootStyle.setProperty('--p-right', sharedColor);
        rootStyle.setProperty('--p-bottom', sharedColor);
        rootStyle.setProperty('--p-left', sharedColor);
    }

    function spring(curr, tgt, vel, cfg) {
        const acc = (-cfg.k * (curr - tgt) - cfg.d * vel) / cfg.m;
        vel += acc * 0.016;
        return [curr + vel * 0.016, vel];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);

        if (state.isMoving) {
            if (dist > 15) { 
                slider.classList.add('flying');
                state.tsx = 1 - (0.07 * state.intensity); 
                state.tsy = 1 + (0.13 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                slider.classList.remove('flying');
                state.tsx = 1 + (0.06 * state.intensity); 
                state.tsy = 1 - (0.04 * state.intensity); 
            } else {
                state.tsx = state.tsy = 1;
                if (Math.abs(state.vx) < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = state.sy = 1;
        } else {
            state.intensity = Math.abs(newIdx - state.currentIndex) > 1 ? 1.2 : 0.7;
            state.isMoving = true;
        }
        state.currentIndex = newIdx;
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));
    setActive(document.querySelector('.tab-item.active'), true);
    
    window.addEventListener('resize', () => {
        updateDynamicColors();
    });

    requestAnimationFrame(update);
</script>

</body>
</html>
