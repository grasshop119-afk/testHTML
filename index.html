<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Pro Drag</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.12);
            --pill-border-moving: rgba(255, 255, 255, 0.25);
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            touch-action: none;
        }

        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            justify-content: space-around;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.25s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            box-sizing: border-box;
            border: 1px solid transparent;
            will-change: transform, left, width, background-color, border-color;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .liquid-slider.flying, .liquid-slider.dragging {
            background-color: transparent !important;
            border-color: var(--pill-border-moving);
        }
    </style>
</head>
<body>

<div class="tab-bar-container" id="dragZone">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = {
        pos: { k: 400, d: 35, m: 1 },    
        scale: { k: 350, d: 20, m: 1 }   
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');
    const tabBar = document.getElementById('tabBar');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        isDragging: false,
        intensity: 1,
        currentIndex: 0,
        lastMouseX: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        // Логика автоматического полета (не драга)
        if (!state.isDragging) {
            const dist = Math.abs(state.x - state.tx);
            if (state.isMoving) {
                if (dist > 15) {
                    slider.classList.add('flying');
                    state.tsy = 1 + (0.27 * state.intensity); 
                    state.tsx = 1 - (0.10 * state.intensity); 
                } else {
                    slider.classList.remove('flying');
                    state.tsx = 1; state.tsy = 1;
                    if (dist < 0.5 && Math.abs(state.vx) < 0.5) state.isMoving = false;
                }
            }
            [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
            [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        } else {
            // ЛОГИКА ПРИ УДЕРЖАНИИ
            // Базовый рост при удержании
            state.tsx = 1.08; 
            state.tsy = 1.08;

            // Эффект сплющивания/растяжения от скорости пальца
            const speedX = Math.abs(state.x - state.lastMouseX) * 0.15;
            state.tsx += speedX * 0.2; // растягивается вширь
            state.tsy -= speedX * 0.1; // чуть приседает
            
            state.lastMouseX = state.x;
        }

        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    let longPressTimer;
    let dragActive = false;

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - state.currentIndex);

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.6;
            state.isMoving = true;
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    function onStart(e) {
        const touch = e.touches ? e.touches[0] : e;
        dragActive = true;
        
        longPressTimer = setTimeout(() => {
            if (!dragActive) return;
            state.isDragging = true;
            slider.classList.add('dragging');
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }, 220);
    }

    function onMove(e) {
        if (!state.isDragging) {
            // Если начали заметно двигать — отменяем лонгпресс для обычного клика
            if (dragActive) clearTimeout(longPressTimer);
            return;
        }
        
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const rect = tabBar.getBoundingClientRect();
        
        // Центрируем пузырек под пальцем
        let targetX = touch.clientX - rect.left - (state.w / 2);
        targetX = Math.max(4, Math.min(targetX, rect.width - state.w - 4));
        
        state.x = targetX;
    }

    function onEnd() {
        dragActive = false;
        clearTimeout(longPressTimer);
        
        if (state.isDragging) {
            state.isDragging = false;
            slider.classList.remove('dragging');

            // Ищем ближайшую вкладку
            let closest = tabs[0];
            let minD = Infinity;
            tabs.forEach(t => {
                const d = Math.abs(state.x - t.offsetLeft);
                if (d < minD) { minD = d; closest = t; }
            });
            setActive(closest);
        }
    }

    tabs.forEach(tab => {
        tab.addEventListener('mousedown', onStart);
        tab.addEventListener('touchstart', onStart, {passive: true});
    });

    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);

    // Инициализация
    const initial = document.querySelector('.tab-item.active');
    state.tw = initial.offsetWidth;
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
