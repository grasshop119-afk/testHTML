<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild FAQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000; /* Глубокий черный в стиле Apple */
            --secondary-bg: #1c1c1e;
            --text-color: #ffffff;
            --hint-color: rgba(255, 255, 255, 0.6);
            /* Используем переменную темы Telegram для акцента */
            --accent-color: var(--tg-theme-button-color, #007aff); 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px; /* Тот самый квадратик с закруглением */
            border: 2px solid var(--accent-color);
            background-size: cover;
            background-position: center;
            background-color: var(--secondary-bg);
        }

        /* Контейнер для плашек */
        .list-container {
            padding: 0 16px;
        }

        .cell {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .cell:active {
            background-color: #2c2c2e; /* Легкий отклик при нажатии */
        }

        .cell-title {
            font-size: 17px;
            font-weight: 400;
            order: 2; /* Название справа */
        }

        .cell-chevron {
            font-size: 17px;
            color: var(--hint-color);
            order: 1; /* Шеврон слева */
            transform: rotate(0deg); /* Можно повернуть если нужно */
        }

        /* Скрываем скроллбар, но оставляем функционал */
        body::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>FAQ</h1>
        <div id="user-avatar" class="user-avatar"></div>
    </header>

    <main class="list-container">
        <div class="cell" onclick="handleCellClick('Правила гильдии')">
            <span class="cell-title">Правила гильдии</span>
            <span class="cell-chevron">‹</span>
        </div>

        <div class="cell" onclick="handleCellClick('Сокращения (Сленг)')">
            <span class="cell-title">Алфавит сокращений</span>
            <span class="cell-chevron">‹</span>
        </div>

        <div class="cell" onclick="handleCellClick('Требования к рейдам')">
            <span class="cell-title">Инфа по рейдам</span>
            <span class="cell-chevron">‹</span>
        </div>
    </main>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на весь экран

        // Настройка аватара пользователя
        const avatarDiv = document.getElementById('user-avatar');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            if (user.photo_url) {
                avatarDiv.style.backgroundImage = `url('${user.photo_url}')`;
            }
        }

        // Функция клика с тактильной отдачей
        function handleCellClick(name) {
            // Легкая вибрация при нажатии (механика Telegram)
            tg.HapticFeedback.impactOccurred('light');
            
            console.log("Выбрано:", name);
            // Тут позже добавим логику открытия контента
        }

        // Сообщаем Telegram, что приложение готово
        tg.ready();
    </script>
</body>
</html>
