<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный Кинотеатр</title>
    <style>
        /* Базовый сброс стилей */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #09070f 0%, #020105 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* Кнопка управления ключом сверху */
        .key-management {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 10;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .key-btn:hover {
            background: rgba(255, 174, 0, 0.1);
            border-color: #ffae00;
            color: #fff;
        }

        /* Инпут и Кнопка поиска */
        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto 40px auto;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #ffae00;
        }

        .search-btn {
            padding: 0 25px;
            border-radius: 12px;
            border: none;
            background: #ffae00;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #ff7b00;
        }

        /* Сетка результатов */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Эффект стекла (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
            backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 174, 0, 0.3);
        }

        .card-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #13111a;
        }

        .card-content {
            padding: 12px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        /* Окно плеера */
        .player-section {
            display: none;
            background: rgba(10, 8, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .player-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .close-btn:hover {
            background: rgba(255, 74, 74, 0.2);
            color: #ff4a4a;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .status-msg {
            text-align: center;
            color: #888;
            font-size: 1.1rem;
            margin-top: 40px;
        }

        /* Стеклянное модальное окно для ввода ключа */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(20, 18, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .modal-content p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #ffae00;
        }

        .modal-btn {
            background: #ffae00;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #ff7b00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="key-management">
            <button class="key-btn" onclick="openKeyModal()">⚙️ Настройки API</button>
        </div>

        <header>
            <h1>Личный Кинотеатр</h1>
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Введите название фильма или сериала...">
                <button class="search-btn" onclick="searchMovies()">Искать</button>
            </div>
        </header>

        <div class="grid" id="movies-grid"></div>
        <div id="status" class="status-msg">Введите название фильма для поиска 🍿</div>

        <div class="player-section" id="player-container">
            <div class="player-header">
                <div class="player-title" id="current-title">Название фильма</div>
                <button class="close-btn" onclick="closePlayer()">Закрыть</button>
            </div>
            <div class="video-container">
                <iframe id="video-iframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div class="modal" id="key-modal">
        <div class="modal-content">
            <h3>Введите API ключ TMDB</h3>
            <p>Ключ сохранится локально в вашем браузере. В исходном коде на GitHub его никто не увидит.</p>
            <input type="text" id="key-input" class="modal-input" placeholder="Вставьте ваш API Key (v3 auth)...">
            <button class="modal-btn" onclick="saveKey()">Сохранить</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('movies-grid');
        const status = document.getElementById('status');
        const playerContainer = document.getElementById('player-container');
        const iframe = document.getElementById('video-iframe');
        const currentTitle = document.getElementById('current-title');
        const searchInput = document.getElementById('search-input');
        const keyModal = document.getElementById('key-modal');
        const keyInput = document.getElementById('key-input');

        // Проверяем наличие ключа при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('tmdb_api_key');
            if (!savedKey) {
                openKeyModal();
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });

        // Работа с модальным окном
        function openKeyModal() {
            const savedKey = localStorage.getItem('tmdb_api_key');
            if (savedKey) keyInput.value = savedKey;
            keyModal.style.display = 'flex';
        }

        function saveKey() {
            const userKey = keyInput.value.trim();
            if (userKey) {
                localStorage.setItem('tmdb_api_key', userKey);
                keyModal.style.display = 'none';
                status.textContent = 'Ключ сохранен! Можно искать фильмы 🍿';
            } else {
                alert('Пожалуйста, введите корректный ключ.');
            }
        }

        // Поиск фильмов
        async function searchMovies() {
            const query = searchInput.value.trim();
            if (!query) return;

            const apiKey = localStorage.getItem('tmdb_api_key');
            if (!apiKey) {
                status.textContent = 'Ошибка: Сначала добавьте API ключ в настройках сверху!';
                openKeyModal();
                return;
            }

            status.textContent = 'Ищем... 🔍';
            grid.innerHTML = '';
            
            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}&language=ru-RU`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    status.textContent = 'Ничего не найдено 😔';
                    return;
                }

                status.textContent = '';

                const filtered = data.results.filter(item => (item.media_type === 'movie' || item.media_type === 'tv') && item.poster_path);

                grid.innerHTML = filtered.map(item => {
                    const title = item.title || item.name;
                    const year = (item.release_date || item.first_air_date || '').split('-')[0];
                    const poster = `https://image.tmdb.org/t/p/w400${item.poster_path}`;
                    
                    return `
                        <div class="card" onclick="openPlayer('${title.replace(/'/g, "\\'")}', '${year}')">
                            <img class="card-image" src="${poster}" alt="${title}" loading="lazy">
                            <div class="card-content">
                                <div class="card-title">${title}</div>
                                <div class="card-meta">${year ? year : '—'} | ${item.media_type === 'movie' ? 'Фильм' : 'Сериал'}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка сети. Проверьте правильность API ключа.';
            }
        }

        function openPlayer(title, year) {
            currentTitle.textContent = title;
            
            // Используем безотказный поиск по названию и году.
            // Kinobox сам найдет фильм и развернет плеер без ошибок 404.
            const embedUrl = `https://kinobox.tv/embed/search?title=${encodeURIComponent(title)}&year=${year}`;

            iframe.src = embedUrl;
            playerContainer.style.display = 'block';
            playerContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function closePlayer() {
            playerContainer.style.display = 'none';
            iframe.src = '';
        }
    </script>
</body>
</html>
