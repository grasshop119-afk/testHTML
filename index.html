<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APixel - Entrance</title>
    
    <link href="https://fonts.cdnfonts.com/css/common-pixel" rel="stylesheet">
    
    <style>
        /* Глобальные настройки */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated; 
        }

        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Common Pixel', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
        }

        /* --- ХЕДЕР --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(180deg, #252525 0%, #1a1a1a 100%);
        }

        .logo {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .logo span { color: #f3bc18; } /* Буква A акцентом */

        .tg-icon {
            width: 24px;
            height: 24px;
            opacity: 0.8;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .tg-icon:hover { opacity: 1; }

        /* --- КОНТЕНТ --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding-bottom: 40px;
        }

        /* --- КАРТОЧКИ --- */
        .card {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 140px;
            background-color: #2b2b2b;
            /* Наш фирменный стиль рамок */
            border-top: 1px solid #444;
            border-left: 1px solid #444;
            border-bottom: 2px solid #111;
            border-right: 1px solid #111;
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            /* Скрываем картинку снизу и по бокам */
            overflow: visible; 
        }

        .card:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        .card:active {
            transform: translateY(1px);
            background-color: #252525;
        }

        /* Текстовый блок */
        .card-content {
            width: 65%;
            z-index: 2;
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #fff;
        }

        .card-desc {
            font-size: 10px;
            line-height: 1.4;
            color: #888;
            text-transform: none;
        }

        /* Контейнер для обрезки картинки (бока и низ) */
        .img-mask {
            position: absolute;
            top: -20px; /* Позволяем картинке вылезать сверху */
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden; /* Обрезаем всё, что выходит за границы плашки, КРОМЕ верха */
            border-radius: 4px;
            pointer-events: none;
        }

        /* Сама картинка */
        .card-img {
            position: absolute;
            right: -10px;
            bottom: -10px;
            width: 140px; /* Крупнее, чем на макете */
            height: auto;
            z-index: 1;
            /* Эффект легкого свечения */
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05) rotate(-2deg);
        }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>A</span>PIXEL</div>
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" class="tg-icon" alt="Telegram">
    </header>

    <main>
        
        <div class="card" onclick="location.href='editor.html'">
            <div class="card-content">
                <div class="card-title">Create Skin</div>
                <div class="card-desc">Create your own Minecraft™ skin. You also can edit or choose skin from the list.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/skin.PNG" alt="Skin" class="card-img">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Block</div>
                <div class="card-desc">Design unique textures and properties for new in-game blocks. Real-time preview included.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/block.PNG" alt="Block" class="card-img">
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="card-title">Create Item</div>
                <div class="card-desc">Add custom weapons, tools, and rare artifacts to your world with ease.</div>
            </div>
            <div class="img-mask">
                <img src="Logos/item.PNG" alt="Item" class="card-img" style="width: 120px; right: 0;">
            </div>
        </div>

    </main>

</body>
</html>
