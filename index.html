<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minecraft Skin Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(24, 24, 26, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #007AFF;
            --text: #FFFFFF;
            --text-muted: #8E8E93;
            --radius-main: 34px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header: Part Selection --- */
        header {
            padding-top: env(safe-area-inset-top, 20px);
            z-index: 10;
        }

        .segment-container {
            display: flex;
            overflow-x: auto;
            padding: 10px 20px;
            gap: 12px;
            scrollbar-width: none;
        }
        .segment-container::-webkit-scrollbar { display: none; }

        .part-pill {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            transition: all 0.2s;
            border: 0.5px solid transparent;
        }
        .part-pill.active {
            background: #FFFFFF;
            color: #000000;
        }

        /* --- Canvas Area --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 220px; /* Оставляем место под плавающую консоль */
        }

        .canvas-wrapper {
            position: relative;
            padding: 4px;
            border-radius: 12px;
            border: 0.5px solid var(--border);
        }

        canvas#editor {
            display: block;
            width: 300px;
            height: 300px;
            image-rendering: pixelated;
            /* Сетка как в дизайн-инструментах */
            background-image: 
                linear-gradient(var(--border) 0.5px, transparent 0.5px),
                linear-gradient(90deg, var(--border) 0.5px, transparent 0.5px);
            touch-action: none;
        }

        .face-indicator {
            margin-top: 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* --- Floating Glass Console --- */
        .console {
            position: fixed;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 16px;
            right: 16px;
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: var(--radius-main);
            border: 0.5px solid rgba(255,255,255,0.15);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .tool-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--text-muted);
            transition: transform 0.1s;
        }
        .icon-btn.active {
            color: var(--accent);
            background: rgba(0, 122, 255, 0.1);
        }
        .icon-btn:active { transform: scale(0.9); }

        .icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

        .console-divider {
            height: 0.5px;
            background: var(--border);
            margin: 0 10px;
        }

        .lower-controls {
            display: flex;
            gap: 15px;
            height: 80px;
            padding: 0 8px;
        }

        .brush-controls {
            width: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            border-right: 0.5px solid var(--border);
        }

        .brush-dot { background: white; border-radius: 50%; opacity: 0.3; }
        .brush-dot.active { opacity: 1; box-shadow: 0 0 10px white; }

        .color-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding-right: 5px;
        }

        .swatch {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 1px solid transparent;
        }
        .swatch.active { border-color: #FFF; transform: scale(0.9); }

        .picker-btn {
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            position: relative;
            overflow: hidden;
        }
        .picker-btn input { position: absolute; opacity: 0; inset: 0; }

    </style>
</head>
<body>

    <header>
        <div class="segment-container" id="part-selector">
            <div class="part-pill active" data-part="head">Head</div>
            <div class="part-pill" data-part="body">Torso</div>
            <div class="part-pill" data-part="arms">Arms</div>
            <div class="part-pill" data-part="legs">Legs</div>
        </div>
        <div class="segment-container" id="face-selector" style="padding-top: 0;">
            <div class="part-pill active" data-face="front">Front</div>
            <div class="part-pill" data-face="back">Back</div>
            <div class="part-pill" data-face="left">Left</div>
            <div class="part-pill" data-face="right">Right</div>
            <div class="part-pill" data-face="top">Top</div>
            <div class="part-pill" data-face="bottom">Bottom</div>
        </div>
    </header>

    <main class="workspace">
        <div class="canvas-wrapper">
            <canvas id="editor" width="8" height="8"></canvas>
        </div>
        <div class="face-indicator" id="current-label">Head: Front</div>
    </main>

    <div class="console">
        <div class="tool-strip">
            <div class="icon-btn active" data-tool="pencil" title="Карандаш">
                <svg viewBox="0 0 24 24"><path d="M13.5 6.5l4 4M4 20h3.5l10.5-10.5a2.828 2.828 0 10-4-4L3.5 16V20H4z"/></svg>
            </div>
            <div class="icon-btn" data-tool="eraser" title="Ластик">
                <svg viewBox="0 0 24 24"><path d="M7 11l5-5m0 0l5 5m-5-5v12m-8 4h16"/></svg>
            </div>
            <div class="icon-btn" data-tool="bucket" title="Заливка">
                <svg viewBox="0 0 24 24"><path d="M19 11l-8-8-8 8c-2 2-2 5 0 7s5 2 7 0l9-9zM5 11h14"/></svg>
            </div>
            <div class="icon-btn" data-tool="picker" id="picker-tool" title="Пипетка">
                <svg viewBox="0 0 24 24"><path d="M10 14l-6 6m12-12l2-2a2 2 0 112.828 2.828l-2 2M15 7L7 15l-1-1 1-1-1-1 8-8z"/></svg>
            </div>
        </div>

        <div class="console-divider"></div>

        <div class="lower-controls">
            <div class="brush-controls" id="brush-size">
                <div class="brush-dot" style="width: 4px; height: 4px;"></div>
                <div class="brush-dot active" style="width: 8px; height: 8px;"></div>
                <div class="brush-dot" style="width: 12px; height: 12px;"></div>
            </div>

            <div class="color-grid" id="palette">
                <div class="swatch active" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
                <div class="swatch" style="background: #000000;" data-color="#000000"></div>
                <div class="swatch" style="background: #007AFF;" data-color="#007AFF"></div>
                <div class="swatch" style="background: #FF3B30;" data-color="#FF3B30"></div>
                <div class="swatch picker-btn">
                    <input type="color" id="custom-color">
                </div>
            </div>
        </div>
    </div>

    <canvas id="master" width="64" height="64" style="display:none;"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.headerColor = '#000000';
        tg.backgroundColor = '#000000';

        const master = document.getElementById('master');
        const mCtx = master.getContext('2d', { willReadFrequently: true });
        const editor = document.getElementById('editor');
        const eCtx = editor.getContext('2d');

        let appState = {
            part: 'head',
            face: 'front',
            tool: 'pencil',
            color: '#FFFFFF',
            isDrawing: false
        };

        const skinMap = {
            head: { front:[8,8,8,8], back:[24,8,8,8], left:[16,8,8,8], right:[0,8,8,8], top:[8,0,8,8], bottom:[16,0,8,8] },
            body: { front:[20,20,8,12], back:[32,20,8,12], left:[16,20,4,12], right:[28,20,4,12], top:[20,16,8,4], bottom:[28,16,8,4] },
            arms: { front:[44,20,4,12], back:[52,20,4,12], left:[40,20,4,12], right:[48,20,4,12], top:[44,16,4,4], bottom:[48,16,4,4] },
            legs: { front:[4,20,4,12], back:[12,20,4,12], left:[0,20,4,12], right:[8,20,4,12], top:[4,16,4,4], bottom:[8,16,4,4] }
        };

        function refresh() {
            const [x, y, w, h] = skinMap[appState.part][appState.face];
            editor.width = w; editor.height = h;
            // Update grid size dynamically
            editor.style.backgroundSize = `${300/w}px ${300/h}px`;
            eCtx.imageSmoothingEnabled = false;
            eCtx.clearRect(0,0,w,h);
            eCtx.drawImage(master, x, y, w, h, 0, 0, w, h);
            document.getElementById('current-label').innerText = `${appState.part}: ${appState.face}`;
        }

        function getCoords(e) {
            const rect = editor.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return {
                x: Math.floor((t.clientX - rect.left) / (rect.width / editor.width)),
                y: Math.floor((t.clientY - rect.top) / (rect.height / editor.height))
            };
        }

        // Flood Fill Algorithm
        function floodFill(startX, startY, fillRGB) {
            const [mx, my, mw, mh] = skinMap[appState.part][appState.face];
            const img = mCtx.getImageData(mx, my, mw, mh);
            const data = img.data;
            const targetPos = (startY * mw + startX) * 4;
            const targetR = data[targetPos], targetG = data[targetPos+1], targetB = data[targetPos+2], targetA = data[targetPos+3];
            
            const fillR = parseInt(fillRGB.slice(1,3), 16), fillG = parseInt(fillRGB.slice(3,5), 16), fillB = parseInt(fillRGB.slice(5,7), 16);
            if (targetR === fillR && targetG === fillG && targetB === fillB) return;

            const stack = [[startX, startY]];
            while(stack.length) {
                const [x, y] = stack.pop();
                const pos = (y * mw + x) * 4;
                if (x>=0 && x<mw && y>=0 && y<mh && data[pos]===targetR && data[pos+1]===targetG && data[pos+2]===targetB) {
                    data[pos]=fillR; data[pos+1]=fillG; data[pos+2]=fillB; data[pos+3]=255;
                    stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
                }
            }
            mCtx.putImageData(img, mx, my);
            refresh();
        }

        function handleDraw(e) {
            if(!appState.isDrawing) return;
            const p = getCoords(e);
            if(p.x < 0 || p.y < 0 || p.x >= editor.width || p.y >= editor.height) return;

            const [mx, my] = [skinMap[appState.part][appState.face][0] + p.x, skinMap[appState.part][appState.face][1] + p.y];

            if(appState.tool === 'pencil') {
                mCtx.fillStyle = appState.color;
                mCtx.fillRect(mx, my, 1, 1);
                if(Math.random() > 0.8) tg.HapticFeedback.impactOccurred('light');
            } else if(appState.tool === 'eraser') {
                mCtx.clearRect(mx, my, 1, 1);
            } else if(appState.tool === 'picker') {
                const d = mCtx.getImageData(mx, my, 1, 1).data;
                if(d[3] > 0) {
                    appState.color = '#' + [d[0], d[1], d[2]].map(x => x.toString(16).padStart(2, '0')).join('');
                    document.querySelector('[data-tool="pencil"]').click();
                }
            } else if(appState.tool === 'bucket') {
                floodFill(p.x, p.y, appState.color);
                appState.isDrawing = false; // Заливка — разовое действие
            }
            refresh();
        }

        // Listeners
        editor.addEventListener('touchstart', (e) => { appState.isDrawing = true; handleDraw(e); });
        editor.addEventListener('touchmove', (e) => { e.preventDefault(); handleDraw(e); });
        editor.addEventListener('touchend', () => appState.isDrawing = false);

        document.querySelectorAll('.icon-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                appState.tool = btn.dataset.tool;
                tg.HapticFeedback.selectionChanged();
            });
        });

        document.querySelectorAll('.part-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                const parent = pill.parentElement;
                parent.querySelectorAll('.part-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                if(pill.dataset.part) appState.part = pill.dataset.part;
                if(pill.dataset.face) appState.face = pill.dataset.face;
                tg.HapticFeedback.selectionChanged();
                refresh();
            });
        });

        document.getElementById('palette').addEventListener('click', (e) => {
            const swatch = e.target.closest('.swatch');
            if(swatch && swatch.dataset.color) {
                document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                appState.color = swatch.dataset.color;
                if(appState.tool === 'eraser') document.querySelector('[data-tool="pencil"]').click();
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        document.getElementById('custom-color').addEventListener('change', (e) => {
            appState.color = e.target.value;
            tg.HapticFeedback.notificationOccurred('success');
        });

        tg.MainButton.setText("ЭКСПОРТ В ФОТО").show().onClick(() => {
            const link = document.createElement('a');
            link.download = 'mc_skin.png';
            link.href = master.toDataURL();
            link.click();
            tg.HapticFeedback.notificationOccurred('success');
        });

        refresh();
    </script>
</body>
</html>
