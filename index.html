<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skinx — Модульный Редактор</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --radius: 20px;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-weight: 800; font-size: 22px; color: var(--accent); }

        /* Выбор части тела */
        .part-selector {
            display: flex;
            gap: 8px;
            padding: 0 20px 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .part-selector::-webkit-scrollbar { display: none; }

        .part-chip {
            background: var(--card);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid transparent;
        }
        .part-chip.active {
            border-color: var(--accent);
            background: #3b82f620;
        }

        /* Холст */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            background-color: #2a2a2a;
            background-image: repeating-conic-gradient(#333 0% 25%, #444 0% 50%) ;
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border: 4px solid var(--card);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* Инструменты */
        .toolbar {
            background: var(--card);
            margin: 20px;
            padding: 15px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .tool-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 14px;
        }
        .tool-btn.active { background: var(--accent); }

        .color-input {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            position: relative;
        }
        #colorPicker {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
        }

        .footer-btns {
            padding: 0 20px 30px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .btn-download {
            background: var(--accent);
            border: none;
            color: white;
            padding: 18px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">SKINX</span>
        <button class="tool-btn" onclick="resetAll()"><i data-lucide="rotate-ccw"></i></button>
    </header>

    <div class="part-selector" id="partSelector">
        <div class="part-chip active" data-part="head">Голова (8x8)</div>
        <div class="part-chip" data-part="body">Тело (8x12)</div>
        <div class="part-chip" data-part="arm">Рука (4x12)</div>
        <div class="part-chip" data-part="leg">Нога (4x12)</div>
    </div>

    <main>
        <div class="canvas-container">
            <canvas id="editorCanvas"></canvas>
        </div>
        <p id="partLabel" style="font-size: 12px; color: #64748b; margin-top: 10px;">Рисуем переднюю часть</p>
    </main>

    <div class="toolbar">
        <div class="color-input">
            <input type="color" id="colorPicker" value="#3b82f6">
        </div>
        <button class="tool-btn active" id="pen"><i data-lucide="pencil"></i></button>
        <button class="tool-btn" id="eraser"><i data-lucide="eraser"></i></button>
        <button class="tool-btn" id="picker"><i data-lucide="pipette"></i></button>
    </div>

    <div class="footer-btns">
        <button class="btn-download" onclick="exportFullSkin()">СКАЧАТЬ .PNG SKIN</button>
        <button class="tool-btn" style="background: #334155;" onclick="alert('Прогресс сохранен!')"><i data-lucide="save"></i></button>
    </div>

    <script>
        lucide.createIcons();

        // Конфигурация частей (размеры и координаты в финальном скине 64x64)
        const PARTS = {
            head: { w: 8, h: 8, x: 8, y: 8 },
            body: { w: 8, h: 12, x: 20, y: 20 },
            arm: { w: 4, h: 12, x: 44, y: 20 },
            leg: { w: 4, h: 12, x: 4, y: 20 }
        };

        let currentPartKey = 'head';
        let isDrawing = false;
        let tool = 'pen';

        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');

        // Хранилище данных (ImageData) для каждой части
        let storage = JSON.parse(localStorage.getItem('skinx_data')) || {};

        function initCanvas() {
            const config = PARTS[currentPartKey];
            canvas.width = config.w;
            canvas.height = config.h;
            
            // Масштабирование для экрана телефона
            const displaySize = 280;
            if (config.w > config.h) {
                canvas.style.width = displaySize + 'px';
                canvas.style.height = (displaySize * (config.h / config.w)) + 'px';
            } else {
                canvas.style.height = displaySize + 'px';
                canvas.style.width = (displaySize * (config.w / config.h)) + 'px';
            }

            // Загрузка из памяти
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (storage[currentPartKey]) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = storage[currentPartKey];
            }
        }

        // Логика рисования
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = Math.floor((clientX - rect.left) / (rect.width / canvas.width));
            const y = Math.floor((clientY - rect.top) / (rect.height / canvas.height));

            if (tool === 'pen') {
                ctx.fillStyle = colorPicker.value;
                ctx.fillRect(x, y, 1, 1);
            } else if (tool === 'eraser') {
                ctx.clearRect(x, y, 1, 1);
            } else if (tool === 'picker') {
                const data = ctx.getImageData(x, y, 1, 1).data;
                if (data[3] > 0) {
                    const hex = "#" + ((1 << 24) + (data[0] << 16) + (data[1] << 8) + data[2]).toString(16).slice(1);
                    colorPicker.value = hex;
                }
            }
            saveCurrentPart();
        }

        function saveCurrentPart() {
            storage[currentPartKey] = canvas.toDataURL();
            localStorage.setItem('skinx_data', JSON.stringify(storage));
        }

        // Переключение частей
        document.getElementById('partSelector').addEventListener('click', (e) => {
            if (e.target.classList.contains('part-chip')) {
                document.querySelectorAll('.part-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentPartKey = e.target.dataset.part;
                initCanvas();
            }
        });

        // Инструменты
        document.getElementById('pen').onclick = () => selectTool('pen');
        document.getElementById('eraser').onclick = () => selectTool('eraser');
        document.getElementById('picker').onclick = () => selectTool('picker');

        function selectTool(t) {
            tool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t).classList.add('active');
        }

        // Сборка финального скина
        function exportFullSkin() {
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 64;
            finalCanvas.height = 64;
            const fctx = finalCanvas.getContext('2d');

            // Проходим по всем частям и рисуем их на невидимом холсте 64x64
            const promises = Object.keys(PARTS).map(key => {
                return new Promise(resolve => {
                    if (!storage[key]) return resolve();
                    const img = new Image();
                    img.onload = () => {
                        fctx.drawImage(img, PARTS[key].x, PARTS[key].y);
                        resolve();
                    };
                    img.src = storage[key];
                });
            });

            Promise.all(promises).then(() => {
                const link = document.createElement('a');
                link.download = 'mc_skin_skinx.png';
                link.href = finalCanvas.toDataURL("image/png");
                link.click();
            });
        }

        function resetAll() {
            if(confirm("Удалить всё и начать заново?")) {
                storage = {};
                localStorage.removeItem('skinx_data');
                initCanvas();
            }
        }

        // Слушатели событий
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; draw(e); });
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

        // Старт
        initCanvas();
    </script>
</body>
</html>
