<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Wide Tabs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.85);
            --active-accent: #3da9ff;
            --text-inactive: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Контейнер теперь на всю ширину */
        .tab-bar-container {
            width: 100%;
            max-width: 500px; /* Ограничение для десктопа, на мобилках будет во всю ширину */
            margin-bottom: 25px;
            padding: 40px 12px; 
            display: flex;
            justify-content: center;
        }

        .ios-tab-bar {
            position: relative;
            width: 100%;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border-radius: 35px;
            display: flex;
            padding: 5px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            overflow: visible; 
        }

        .tab-item {
            position: relative;
            z-index: 2;
            flex: 1; /* Растягиваем кнопки равномерно */
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transform: none !important;
        }

        .tab-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: var(--text-inactive);
            transition: fill 0.25s ease;
            pointer-events: none;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-inactive);
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .tab-item.active .tab-icon { fill: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 5px;
            left: 5px;
            height: calc(100% - 10px);
            background: var(--pill-bg);
            border-radius: 30px;
            z-index: 1;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, left, width;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="tab-text">Главная</span>
        </button>

        <button class="tab-item" data-index="1">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
            <span class="tab-text">Меню</span>
        </button>

        <button class="tab-item" data-index="2">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    // Финальные настройки вязкой физики
    const PHYSICS = {
        pos: { k: 320, d: 42, m: 1 },    // Более ленивое и плавное перемещение
        scale: { k: 350, d: 28, m: 1 }   // Деформация стала еще мягче
    };

    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    let state = {
        x: 0, tx: 0, vx: 0,
        w: 0, tw: 0, vw: 0,
        sx: 1, tsx: 1, vsx: 0,
        sy: 1, tsy: 1, vsy: 0,
        isMoving: false,
        intensity: 1,
        currentIndex: 0
    };

    function spring(current, target, velocity, config) {
        const force = -config.k * (current - target);
        const damping = -config.d * velocity;
        const acceleration = (force + damping) / config.m;
        velocity += acceleration * 0.016;
        current += velocity * 0.016;
        return [current, velocity];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);
        const vel = Math.abs(state.vx);

        if (state.isMoving) {
            if (dist > 20) { 
                // В ПОЛЕТЕ: Вытяжение
                state.tsy = 1 + (0.18 * state.intensity); 
                state.tsx = 1 - (0.10 * state.intensity); 
            } else if (dist <= 20 && dist > 0.5) {
                // УДАР: Сплющивание снижено на 5% от предыдущего (стало ~10%)
                state.tsy = 1 - (0.10 * state.intensity); 
                state.tsx = 1 + (0.12 * state.intensity); 
            } else {
                // ПРИЗЕМЛЕНИЕ
                state.tsx = 1;
                state.tsy = 1;
                
                if (vel < 0.1 && Math.abs(state.vsx) < 0.1) {
                    state.isMoving = false;
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        const diff = Math.abs(newIdx - (state.currentIndex || 0));

        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        state.currentIndex = newIdx;
        
        if (instant) {
            state.x = state.tx;
            state.w = state.tw;
            state.sx = 1; state.sy = 1;
        } else {
            state.intensity = diff > 1 ? 1 : 0.4;
            state.isMoving = true;

            if (window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));

    const initial = document.querySelector('.tab-item.active');
    setActive(initial, true);
    requestAnimationFrame(update);
</script>

</body>
</html>
