<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iOS Stealth Liquid</title>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --active-accent: #007AFF;
            --inactive-color: #8e8e93;
            --pill-bg: rgba(255, 255, 255, 0.12);
            --pill-border-moving: rgba(255, 255, 255, 0.25); 
        }
        body {
            margin: 0; background: var(--bg-color);
            height: 100vh; display: flex; justify-content: center; align-items: flex-end;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden;
        }
        .tab-bar-container { margin-bottom: calc(15px + env(safe-area-inset-bottom)); width: 92%; max-width: 400px; }
        .ios-tab-bar {
            position: relative; background: var(--tab-bar-bg);
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 38px; display: flex; padding: 4px; border: 0.5px solid rgba(255, 255, 255, 0.08);
        }
        .tab-item {
            position: relative; z-index: 2; padding: 8px 0; display: flex;
            flex-direction: column; align-items: center; background: none; border: none; flex: 1; cursor: pointer;
        }
        .icon-wrapper {
            width: 24px; height: 24px; margin-bottom: 4px; background-color: var(--inactive-color);
            -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
            transition: background-color 0.25s;
        }
        .tab-text { font-size: 10px; font-weight: 500; color: var(--inactive-color); transition: color 0.25s; }
        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }
        .liquid-slider {
            position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
            background: var(--pill-bg); border-radius: 34px; z-index: 1; box-sizing: border-box;
            border: 1px solid transparent; will-change: transform, left, width;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar">
        <div class="liquid-slider" id="slider"></div>
        <button class="tab-item active" data-idx="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Главная</span>
        </button>
        <button class="tab-item" data-idx="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Меню</span>
        </button>
        <button class="tab-item" data-idx="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Настройки</span>
        </button>
    </nav>
</div>

<script>
    const slider = document.getElementById('slider'), tabs = document.querySelectorAll('.tab-item');
    let x = 0, tx = 0, vx = 0, w = 0, tw = 0, vw = 0, curIdx = 0;

    function update() {
        // Рассчитываем физику движения (X и Width)
        vx += (-380 * (x - tx) - 38 * vx) * 0.016; x += vx * 0.016;
        vw += (-380 * (w - tw) - 38 * vw) * 0.016; w += vw * 0.016;

        const dist = Math.abs(x - tx);
        
        // Считаем деформацию: при разгоне вытягиваемся по X, сжимаемся по Y. При торможении — наоборот.
        // Переменная velM задает силу эффекта в зависимости от расстояния прыжка
        const velM = Math.min(Math.abs(vx) * (Math.abs(curIdx - (tx / w)) > 1 ? 0.0015 : 0.0008), 0.3);
        const sx = vx > 0 ? 1 + velM : 1 - velM;
        const sy = 1 - velM * 0.6;

        // Смена визуального состояния (полёт / статика) на основе расстояния до цели
        if (dist > 15) {
            slider.style.backgroundColor = 'transparent';
            slider.style.borderColor = 'var(--pill-border-moving)';
        } else {
            slider.style.backgroundColor = 'var(--pill-bg)';
            slider.style.borderColor = 'transparent';
        }

        slider.style.left = `${x}px`;
        slider.style.width = `${w}px`;
        slider.style.transform = `scale(${sx}, ${sy})`;

        requestAnimationFrame(update);
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        curIdx = parseInt(tab.dataset.idx);
        tx = tab.offsetLeft;
        tw = tab.offsetWidth;
    }));

    // Инициализация при старте
    const init = document.querySelector('.tab-item.active');
    x = tx = init.offsetLeft; w = tw = init.offsetWidth;
    requestAnimationFrame(update);
</script>

</body>
</html>
