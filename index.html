<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Mini App</title>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --nav-bg: rgba(255, 255, 255, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tg-safe-h: 50px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER SECTION --- */
        .header-container {
            padding: calc(var(--safe-top) + 20px) 20px 10px;
            height: 80px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .header-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-welcome {
            opacity: 0.55;
        }

        .header-fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .header-fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CONTENT SYSTEM --- */
        .content-view {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 0 20px;
            transition: opacity 0.3s ease;
            display: none;
            padding-bottom: 120px; /* Space for nav island */
        }

        .content-view.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SEARCH TAB --- */
        .search-container {
            margin-top: 10px;
        }

        .search-bar {
            width: 100%;
            background: var(--tg-secondary-bg);
            border: none;
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--tg-text);
            font-size: 17px;
            outline: none;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .search-bar::placeholder {
            color: var(--tg-hint);
        }

        /* --- PROFILE TAB --- */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--tg-secondary-bg);
            background-size: cover;
            background-position: center;
            margin-bottom: 15px;
            border: 3px solid var(--tg-accent);
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-username {
            font-size: 16px;
            color: var(--tg-accent);
            font-weight: 500;
        }

        /* --- NAV ISLAND (STRICTLY PRESERVED) --- */
        .nav-wrapper {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .nav-island {
            position: relative;
            width: 240px;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .blob {
            position: absolute;
            width: 46px;
            height: 46px;
            background: var(--tg-accent);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            margin-top: -23px;
            left: 15px;
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-radius 0.3s ease, 
                        transform 0.3s ease;
        }

        .stretch-right {
            border-radius: 40% 70% 70% 40% / 50% 50% 50% 50% !important;
            transform: scaleX(1.18) !important;
        }

        .stretch-left {
            border-radius: 70% 40% 40% 70% / 50% 50% 50% 50% !important;
            transform: scaleX(1.18) !important;
        }

        .nav-item {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
        }

        .nav-item img {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .nav-item.active img { opacity: 1; }

        .pfp-mini {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #333;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }

        .active .pfp-mini { opacity: 1; }

        /* Infrastructure */
        .placeholder-text {
            color: var(--tg-hint);
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header-container" id="header-box">
        <div class="header-text header-welcome" id="main-title">С ВОЗВРАЩЕНИЕМ</div>
    </div>

    <div id="view-0" class="content-view active">
        <div class="placeholder-text">
            Здесь будет ваш основной контент.<br>
            Интерфейс адаптирован под системные цвета Telegram.
        </div>
    </div>

    <div id="view-1" class="content-view">
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Поиск по приложению..." id="search-input">
        </div>
        <div class="placeholder-text">Начните вводить текст для поиска</div>
    </div>

    <div id="view-2" class="content-view">
        <div class="profile-card">
            <div class="profile-avatar" id="user-avatar"></div>
            <div class="profile-name" id="user-name">Telegram User</div>
            <div class="profile-username" id="user-handle">@username</div>
        </div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-island">
            <div class="blob" id="blob"></div>
            
            <div class="nav-item" id="tab-0" onclick="switchTab(0)">
                <img src="https://cdn-icons-png.flaticon.com/512/6997/6997164.png" alt="home">
            </div>
            
            <div class="nav-item" id="tab-1" onclick="switchTab(1)">
                <img src="https://cdn-icons-png.flaticon.com/512/8025/8025278.png" alt="search">
            </div>
            
            <div class="nav-item" id="tab-2" onclick="switchTab(2)">
                <div class="pfp-mini" id="nav-pfp"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Анимация заголовка
        const titleElement = document.getElementById('main-title');
        setTimeout(() => {
            titleElement.classList.add('header-fade-out');
            setTimeout(() => {
                titleElement.innerText = 'FAQ';
                titleElement.classList.remove('header-welcome', 'header-fade-out');
                titleElement.classList.add('header-fade-in');
            }, 600);
        }, 3000);

        // 2. Данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('user-handle').innerText = user.username ? `@${user.username}` : '';
            if (user.photo_url) {
                document.getElementById('user-avatar').style.backgroundImage = `url(${user.photo_url})`;
                document.getElementById('nav-pfp').style.backgroundImage = `url(${user.photo_url})`;
            }
        }

        // 3. Логика переключения вкладок
        const blob = document.getElementById('blob');
        const items = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.content-view');
        const headerBox = document.getElementById('header-box');
        let currentIndex = -1;

        function switchTab(index) {
            if (index === currentIndex) {
                tg.HapticFeedback.impactOccurred('light');
                return;
            }

            // Управление Blob (твоя механика)
            const targetItem = document.getElementById(`tab-${index}`);
            blob.classList.remove('stretch-right', 'stretch-left');
            
            if (currentIndex !== -1) {
                if (index > currentIndex) blob.classList.add('stretch-right');
                else blob.classList.add('stretch-left');
            }

            const targetX = targetItem.offsetLeft + (targetItem.offsetWidth / 2) - (blob.offsetWidth / 2);
            blob.style.left = `${targetX}px`;
            
            items.forEach(item => item.classList.remove('active'));
            targetItem.classList.add('active');

            // Управление Контентом
            views.forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${index}`).classList.add('active');

            // Управление Заголовком (для профиля скрываем, для поиска меняем)
            updateHeader(index);

            currentIndex = index;
            setTimeout(() => blob.classList.remove('stretch-right', 'stretch-left'), 200);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateHeader(index) {
            if (index === 2) { // Профиль
                headerBox.style.display = 'none';
            } else {
                headerBox.style.display = 'flex';
                if (index === 1) { // Поиск
                    titleElement.innerText = 'ПОИСК';
                    titleElement.classList.remove('header-welcome');
                    titleElement.style.opacity = "1";
                } else { // Главная / FAQ
                    // Если анимация уже прошла, оставляем FAQ
                    if (titleElement.innerText !== 'С ВОЗВРАЩЕНИЕМ') {
                        titleElement.innerText = 'FAQ';
                    }
                }
            }
        }

        // Инициализация
        window.onload = () => {
            switchTab(0);
            
            // Настройка MainButton для примера (как в Wallet)
            tg.MainButton.setParams({
                text: 'ПОДТВЕРДИТЬ',
                color: tg.themeParams.button_color,
                text_color: tg.themeParams.button_text_color
            });
        };

        // Обработка фокуса поиска
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('focus', () => {
            tg.HapticFeedback.impactOccurred('light');
        });

    </script>
</body>
</html>
