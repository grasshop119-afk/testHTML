<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Mini App - Circular Nav</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-accent: var(--tg-theme-button-color, #007AFF);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --nav-bg: rgba(255, 255, 255, 0.1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            
            /* Параметры колеса */
            --wheel-size: 600px; /* Уменьшил диаметр для более крутой дуги */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-container {
            padding: calc(env(safe-area-inset-top) + 20px) 20px 10px;
        }

        .content-view {
            flex: 1;
            padding: 20px;
            display: none;
            overflow-y: auto;
        }
        .content-view.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CIRCULAR NAVIGATION --- */
        .nav-wrapper {
            position: fixed;
            /* Приподнимаем круг выше */
            bottom: calc(-1 * (var(--wheel-size) - 140px) - var(--safe-bottom)); 
            left: 50%;
            transform: translateX(-50%);
            width: var(--wheel-size);
            height: var(--wheel-size);
            z-index: 1000;
            pointer-events: none; /* Чтобы пустые области не мешали кликам */
        }

        .wheel-disk {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: auto;
            z-index: 1;
        }

        /* Блоб зафиксирован в верхней точке круга */
        .wheel-blob {
            position: absolute;
            top: 15px; /* Регулировка положения на кромке */
            left: 50%;
            width: 50px;
            height: 50px;
            background: var(--tg-accent);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
            transition: transform 0.2s ease, border-radius 0.2s ease;
        }

        /* Деформация блоба (заканчивается быстро, как просил) */
        .stretch-right { border-radius: 40% 70% 70% 40% / 50%; transform: translateX(-50%) scaleX(1.25); }
        .stretch-left { border-radius: 70% 40% 40% 70% / 50%; transform: translateX(-50%) scaleX(1.25); }

        .nav-item {
            position: absolute;
            top: 15px; 
            left: 50%;
            width: 50px;
            height: 50px;
            margin-left: -25px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Точка вращения — центр большого круга */
            transform-origin: center calc(var(--wheel-size) / 2 - 15px);
            cursor: pointer;
            z-index: 10;
        }

        .nav-item img, .pfp-mini {
            width: 24px;
            height: 24px;
            filter: invert(1);
            opacity: 0.35;
            transition: opacity 0.3s, transform 0.3s, filter 0.3s;
        }

        .nav-item.active img, .nav-item.active .pfp-mini {
            opacity: 1;
            transform: scale(1.15);
        }

        .pfp-mini {
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            filter: grayscale(1) contrast(1.2); /* Чтобы вписаться в стиль иконок */
        }
        
        .nav-item.active .pfp-mini {
            filter: none;
            border: 1px solid white;
        }
    </style>
</head>
<body>

    <div id="view-0" class="content-view active">
        <div class="header-container">
            <h1 style="margin:0">Главная</h1>
        </div>
    </div>
    <div id="view-1" class="content-view"><h1>Поиск</h1></div>
    <div id="view-2" class="content-view"><h1>Профиль</h1></div>
    <div id="view-3" class="content-view"><h1>Настройки</h1></div>
    <div id="view-4" class="content-view"><h1>Чат</h1></div>

    <div class="nav-wrapper">
        <div class="wheel-blob" id="blob"></div>
        <div class="wheel-disk" id="wheel">
            </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const wheel = document.getElementById('wheel');
        const blob = document.getElementById('blob');
        
        // Можешь добавлять сюда сколько угодно объектов
        const menuItems = [
            { icon: 'https://cdn-icons-png.flaticon.com/512/6997/6997164.png', type: 'img' },
            { icon: 'https://cdn-icons-png.flaticon.com/512/8025/8025278.png', type: 'img' },
            { icon: '', type: 'pfp' },
            { icon: 'https://cdn-icons-png.flaticon.com/512/2040/2040504.png', type: 'img' },
            { icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png', type: 'img' }
        ];

        let currentIndex = 0;
        const angleStep = 22; // Расстояние между иконками в градусах

        function initWheel() {
            menuItems.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'nav-item';
                el.id = `tab-${index}`;
                
                // Угол поворота иконки относительно центра круга
                const angle = index * angleStep;
                el.style.transform = `rotate(${angle}deg)`;

                if (item.type === 'pfp') {
                    const pfp = document.createElement('div');
                    pfp.className = 'pfp-mini';
                    pfp.id = 'nav-pfp';
                    pfp.style.backgroundColor = '#333';
                    if (tg.initDataUnsafe?.user?.photo_url) {
                        pfp.style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
                    }
                    el.appendChild(pfp);
                } else {
                    const img = document.createElement('img');
                    img.src = item.icon;
                    el.appendChild(img);
                }

                el.onclick = () => switchTab(index);
                wheel.appendChild(el);
            });
            
            updateActiveState();
        }

        function switchTab(index) {
            if (index === currentIndex) {
                tg.HapticFeedback.notificationOccurred('warning');
                return;
            }

            // Визуальный эффект деформации блоба
            blob.classList.remove('stretch-right', 'stretch-left');
            if (index > currentIndex) blob.classList.add('stretch-right');
            else blob.classList.add('stretch-left');
            
            // Крутим диск в обратную сторону, чтобы иконка стала по центру
            const rotation = -index * angleStep;
            wheel.style.transform = `rotate(${rotation}deg)`;

            // Переключение вьюх
            const views = document.querySelectorAll('.content-view');
            views.forEach(v => v.classList.remove('active'));
            if (document.getElementById(`view-${index}`)) {
                document.getElementById(`view-${index}`).classList.add('active');
            }

            currentIndex = index;
            updateActiveState();

            // Конец анимации растяжения (быстрый)
            setTimeout(() => {
                blob.classList.remove('stretch-right', 'stretch-left');
            }, 150);

            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateActiveState() {
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === currentIndex);
            });
        }

        initWheel();
    </script>
</body>
</html>
