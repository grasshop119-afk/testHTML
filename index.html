<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Glass Engine</title>
    <style>
        :root {
            --active-accent: #ffffff;
            --inactive-color: rgba(255, 255, 255, 0.7);
            --slider-bg: rgba(0, 0, 0, 0.25);
            
            /* Эти переменные будут динамически рассчитываться скриптом из Canvas */
            --dynamic-glass-glow: rgba(255, 255, 255, 0.45);
            --dynamic-flying-border: rgba(255, 255, 255, 0.35);
        }

        body {
            margin: 0;
            /* Используем Unsplash с поддержкой CORS, чтобы JS мог читать цвета пикселей */
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .tab-bar-container {
            margin-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 92%;
            max-width: 400px;
        }

        .ios-tab-bar {
            position: relative;
            display: flex;
            padding: 4px;
            justify-content: space-around;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 38px;
            
            /* Настоящее матовое стекло возвращено через backdrop-filter */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(8px) saturate(130%);
            -webkit-backdrop-filter: blur(8px) saturate(130%);
            
            /* Контур динамически подкрашивается смесью цветов с фона */
            border: 1.2px solid var(--dynamic-glass-glow);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15), 
                        0 10px 30px rgba(0, 0, 0, 0.15);
            transition: border-color 0.3s ease;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--inactive-color);
            transition: color 0.25s ease;
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--slider-bg);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.08);
            will-change: transform, left, width, background-color, border-color;
            transition: background-color 0.16s ease-out, border-color 0.16s ease-out;
        }

        /* Во время перемещения контур капли адаптируется под окружение и становится светлее фона */
        .liquid-slider.flying {
            background-color: transparent !important; 
            border: 1.5px solid var(--dynamic-flying-border) !important;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Home</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Menu</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Settings</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = { pos: { k: 380, d: 38, m: 1 }, scale: { k: 420, d: 24, m: 1 } };
    const slider = document.getElementById('slider');
    const tabBar = document.getElementById('tabBar');
    const tabs = document.querySelectorAll('.tab-item');

    let state = { x: 0, tx: 0, vx: 0, w: 0, tw: 0, vw: 0, sx: 1, tsx: 1, vsx: 0, sy: 1, tsy: 1, vsy: 0, isMoving: false, intensity: 1, currentIndex: 0 };

    // ДВИЖОК СЭМПЛИНГА ЦВЕТА (ЦВЕТОВАЯ ЛИНЗА)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous"; 
    bgImg.src = 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80';

    bgImg.onload = () => {
        canvas.width = bgImg.width;
        canvas.height = bgImg.height;
        ctx.drawImage(bgImg, 0, 0);
        updateDynamicColors(); // Первый просчет при загрузке фонового изображения
    };

    function getPixelColor(clientX, clientY) {
        if (!canvas.width) return [255, 255, 255];
        // Проекция экранных координат на реальный масштаб картинки в Canvas
        const imgX = Math.floor((clientX / window.innerWidth) * canvas.width);
        const imgY = Math.floor((clientY / window.innerHeight) * canvas.height);
        
        if (imgX < 0 || imgX >= canvas.width || imgY < 0 || imgY >= canvas.height) return [255,255,255];
        const data = ctx.getImageData(imgX, imgY, 1, 1).data;
        return [data[0], data[1], data[2]];
    }

    function updateDynamicColors() {
        const sliderRect = slider.getBoundingClientRect();
        const cx = sliderRect.left + sliderRect.width / 2;
        const cy = sliderRect.top + sliderRect.height / 2;
        const offset = 40; // Смещение в пикселях (слева, справа, сверху, снизу) для анализа окружения

        // Вытаскиваем 4 точки вокруг капли
        const pLeft  = getPixelColor(cx - offset, cy);
        const pRight = getPixelColor(cx + offset, cy);
        const pTop   = getPixelColor(cx, cy - offset);
        const pBottom= getPixelColor(cx, cy + offset);

        // Смешиваем каналы
        let r = (pLeft[0] + pRight[0] + pTop[0] + pBottom[0]) / 4;
        let g = (pLeft[1] + pRight[1] + pTop[1] + pBottom[1]) / 4;
        let b = (pLeft[2] + pRight[2] + pTop[2] + pBottom[2]) / 4;

        // Осветляем полученный микс (делаем контур выразительным глянцем)
        const lightenFactor = 1.6; 
        r = Math.min(255, r * lightenFactor);
        g = Math.min(255, g * lightenFactor);
        b = Math.min(255, b * lightenFactor);

        // Передаем цвета в CSS переменные в реальном времени
        document.documentElement.style.setProperty('--dynamic-glass-glow', `rgba(${r}, ${g}, ${b}, 0.5)`);
        document.documentElement.style.setProperty('--dynamic-flying-border', `rgba(${r}, ${g}, ${b}, 0.75)`);
    }

    function spring(curr, tgt, vel, cfg) {
        const acc = (-cfg.k * (curr - tgt) - cfg.d * vel) / cfg.m;
        vel += acc * 0.016;
        return [curr + vel * 0.016, vel];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);

        if (state.isMoving) {
            // Если капля в движении — непрерывно пересчитываем цвета под ней
            updateDynamicColors();

            if (dist > 15) { 
                slider.classList.add('flying');
                state.tsx = 1 - (0.07 * state.intensity); 
                state.tsy = 1 + (0.13 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                slider.classList.remove('flying');
                state.tsx = 1 + (0.06 * state.intensity); 
                state.tsy = 1 - (0.04 * state.intensity); 
            } else {
                state.tsx = state.tsy = 1;
                if (Math.abs(state.vx) < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = state.sy = 1;
        } else {
            state.intensity = Math.abs(newIdx - state.currentIndex) > 1 ? 1.2 : 0.7;
            state.isMoving = true;
        }
        state.currentIndex = newIdx;
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));
    setActive(document.querySelector('.tab-item.active'), true);
    requestAnimationFrame(update);
</script>

</body>
</html>
