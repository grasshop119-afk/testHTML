<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #000000;
            --tg-theme-secondary-bg-color: #1c1c1d;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: rgba(255, 255, 255, 0.55);
            --tg-theme-link-color: #3e88f7;
            --tg-theme-button-color: #3e88f7;
            --tg-theme-button-text-color: #ffffff;
            --accent-color: #eb4d4b; /* Пример акцента как в рефе */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Контент управляется внутри вкладок */
            height: 100vh;
        }

        /* --- Header & Animations --- */
        .header {
            padding: 16px 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .animated-title-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            height: 24px;
        }

        .title-text {
            position: absolute;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(10px);
            white-space: nowrap;
        }

        .title-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .title-text.welcome {
            opacity: 0.55; /* Твоё условие */
        }

        /* --- Main Content Area --- */
        .tab-content {
            display: none;
            height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 10px 16px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Search Page Style --- */
        .search-page {
            padding: 0 16px;
        }

        .search-title {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0 20px 4px;
        }

        .search-input-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .search-bar {
            width: 95%; /* Чуть уже ширины экрана */
            background: var(--tg-theme-secondary-bg-color);
            border: none;
            border-radius: 12px; /* Круглые углы */
            padding: 12px 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-bar::placeholder {
            color: var(--tg-theme-hint-color);
        }

        /* --- Profile Style --- */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #636e72, #2d3436);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-username {
            color: var(--tg-theme-hint-color);
            font-size: 15px;
        }

        /* --- Bottom Navigation (Strictly as per ref) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px; /* Для iPhone notch */
            border-top: 0.5px solid rgba(255,255,255,0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--tg-theme-hint-color);
            text-decoration: none;
            font-size: 11px;
            transition: color 0.2s;
            width: 25%;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        /* Share Button Protection (as per your instructions) */
        .nav-item.share:active, .nav-item.share:hover {
            background: transparent !important;
            filter: none !important;
        }

        /* --- Empty States (Ducks) --- */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 100px;
            color: var(--tg-theme-hint-color);
            text-align: center;
        }

        .duck-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        /* --- Utility --- */
        .placeholder-text {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            text-align: center;
            padding: 40px;
        }

    </style>
</head>
<body>

    <div class="header" id="mainHeader">
        <div class="animated-title-container">
            <div id="titleWelcome" class="title-text welcome active">С возвращением</div>
            <div id="titleFAQ" class="title-text">FAQ</div>
        </div>
    </div>

    <div id="tab-wallet" class="tab-content active">
        <div class="placeholder-text">Контент главной страницы</div>
    </div>

    <div id="tab-search" class="tab-content">
        <div class="search-page">
            <h1 class="search-title">Поиск</h1>
            <div class="search-input-container">
                <input type="text" class="search-bar" placeholder="Поиск активов...">
            </div>
            <div class="empty-state">
                <div class="duck-icon">🦆</div>
                <p>Ничего не нашлось</p>
            </div>
        </div>
    </div>

    <div id="tab-bonuses" class="tab-content">
        <div class="empty-state">
            <div class="duck-icon">🎁</div>
            <p>Бонусы скоро появятся</p>
        </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="profile-container">
            <div class="profile-avatar" id="userAvatar">?</div>
            <div class="profile-name" id="userName">User Name</div>
            <div class="profile-username" id="userHandle">@username</div>
        </div>
        <div style="margin-top: 30px;">
            <div style="background: var(--tg-theme-secondary-bg-color); border-radius: 12px; overflow: hidden;">
                <div style="padding: 16px; border-bottom: 0.5px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between;">
                    <span>Настройки</span>
                    <span style="color: var(--tg-theme-hint-color);">›</span>
                </div>
                <div style="padding: 16px; display: flex; justify-content: space-between;">
                    <span>Поддержка</span>
                    <span style="color: var(--tg-theme-hint-color);">›</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="switchTab('wallet', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('search', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Поиск</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('bonuses', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.5 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6.5-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h15v-1l-2-2z"/></svg>
            <span>Бонусы</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('profile', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </a>
    </nav>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // 1. Анимация заголовка (С возвращением -> FAQ)
        setTimeout(() => {
            const welcome = document.getElementById('titleWelcome');
            const faq = document.getElementById('titleFAQ');
            
            welcome.classList.remove('active');
            // Маленькая задержка перед появлением нового текста для плавности
            setTimeout(() => {
                faq.classList.add('active');
            }, 300);
        }, 3000);

        // 2. Переключение вкладок
        function switchTab(tabName, element) {
            // Убираем активный класс у всех контентов
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Убираем активный класс у навигации
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Активируем нужную вкладку
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');

            // Управление заголовком (Скрываем на поиске и профиле для чистоты)
            const header = document.getElementById('mainHeader');
            if (tabName === 'search' || tabName === 'profile') {
                header.style.display = 'none';
            } else {
                header.style.display = 'flex';
            }

            // Вибрация (Haptic Feedback) в стиле TG
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // 3. Получение данных пользователя из TG
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('userName').textContent = `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('userHandle').textContent = user.username ? `@${user.username}` : '';
            
            if (user.photo_url) {
                const avatar = document.getElementById('userAvatar');
                avatar.innerHTML = `<img src="${user.photo_url}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                document.getElementById('userAvatar').textContent = user.first_name.charAt(0);
            }
        }

        // Устанавливаем цвета темы из Telegram
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.backgroundColor || '#000000');
        document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.secondaryBackgroundColor || '#1c1c1d');

    </script>
</body>
</html>
