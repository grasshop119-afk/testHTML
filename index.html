<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skinx Pro — Telegram Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #1c222d;
            --accent: #248bf2;
            --text: #ffffff;
            --sub-text: #8e97a8;
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo { font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }

        .history-btns { display: flex; gap: 10px; }

        /* VIEWPORT */
        #viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #2a2a2a;
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), 
                              linear-gradient(-45deg, #333 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #333 75%),
                              linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            image-rendering: pixelated;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            touch-action: none;
        }

        .info-label {
            margin-top: 15px;
            color: var(--sub-text);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TOOLBAR */
        .toolbar {
            background: var(--panel);
            margin: 10px 20px;
            padding: 12px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .tool-btn {
            background: #2c3440;
            border: none;
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .tool-btn.active { background: var(--accent); transform: scale(1.1); }

        /* PALETTE */
        .palette-container {
            position: relative;
            width: 46px;
            height: 46px;
        }

        .current-color-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            z-index: 5;
            position: relative;
        }

        .palette-expand {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: var(--panel);
            padding: 10px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
            width: 180px;
        }

        .palette-expand.open { transform: translateX(-50%) scale(1); }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid #ffffff33;
        }

        /* MODAL BOTTOM SHEET */
        .bottom-modal {
            background: var(--panel);
            padding: 20px 20px 40px;
            border-radius: 32px 32px 0 0;
            transform: translateY(0);
            transition: 0.4s;
        }

        .modal-title {
            font-size: 14px;
            color: var(--sub-text);
            margin-bottom: 12px;
            display: block;
        }

        .selector-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: none;
        }
        .selector-row::-webkit-scrollbar { display: none; }

        .chip {
            background: #2c3440;
            padding: 10px 18px;
            border-radius: 14px;
            white-space: nowrap;
            font-weight: 700;
            font-size: 14px;
            border: 2px solid transparent;
        }
        .chip.active { border-color: var(--accent); background: #248bf215; }

        /* ANIMATIONS */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">SKINX</span>
        <div class="history-btns">
            <button class="tool-btn" id="undoBtn"><i data-lucide="undo-2"></i></button>
            <button class="tool-btn" id="resetBtn"><i data-lucide="refresh-cw"></i></button>
        </div>
    </header>

    <div id="viewport">
        <div class="canvas-wrapper" id="canvasFrame">
            <canvas id="editorCanvas"></canvas>
        </div>
        <span class="info-label" id="partDisplay">Голова: Перед</span>
    </div>

    <div class="toolbar">
        <div class="palette-container">
            <div class="current-color-btn" id="activeColor" style="background: #ff4757;"></div>
            <div class="palette-expand" id="paletteBox">
                <div class="swatch" style="background: #ff4757;" onclick="setColor('#ff4757')"></div>
                <div class="swatch" style="background: #2ed573;" onclick="setColor('#2ed573')"></div>
                <div class="swatch" style="background: #1e90ff;" onclick="setColor('#1e90ff')"></div>
                <div class="swatch" style="background: #ffa502;" onclick="setColor('#ffa502')"></div>
                <div class="swatch" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
                <div class="swatch" style="background: #2f3542;" onclick="setColor('#2f3542')"></div>
                <div class="swatch" style="background: #000000;" onclick="setColor('#000000')"></div>
                <input type="color" id="customColor" style="width:32px;height:32px;border:none;padding:0;background:none;">
            </div>
        </div>
        <button class="tool-btn active" data-tool="pen"><i data-lucide="pencil"></i></button>
        <button class="tool-btn" data-tool="fill"><i data-lucide="paint-bucket"></i></button>
        <button class="tool-btn" data-tool="eraser"><i data-lucide="eraser"></i></button>
        <button class="tool-btn" data-tool="picker"><i data-lucide="pipette"></i></button>
    </div>

    <div class="bottom-modal">
        <span class="modal-title">ВЫБЕРИТЕ ЧАСТЬ ТЕЛА</span>
        <div class="selector-row" id="partList">
            <div class="chip active" data-part="head">Голова</div>
            <div class="chip" data-part="body">Тело</div>
            <div class="chip" data-part="arm_l">Л. Рука</div>
            <div class="chip" data-part="arm_r">П. Рука</div>
            <div class="chip" data-part="leg_l">Л. Нога</div>
            <div class="chip" data-part="leg_r">П. Нога</div>
        </div>

        <span class="modal-title">СТОРОНА</span>
        <div class="selector-row" id="sideList">
            <div class="chip active" data-side="front">Спереди</div>
            <div class="chip" data-side="back">Сзади</div>
            <div class="chip" data-side="top">Сверху</div>
            <div class="chip" data-side="bottom">Снизу</div>
            <div class="chip" data-side="right">Справа</div>
            <div class="chip" data-side="left">Слева</div>
        </div>
    </div>

    <script>
        // --- 1. ИНИЦИАЛИЗАЦИЯ TG WEB APP ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "СКАЧАТЬ СКИН (.PNG)";
        tg.MainButton.show();
        tg.MainButton.onClick(() => exportFullSkin());

        lucide.createIcons();

        // --- 2. КОНФИГУРАЦИЯ UV (Координаты Minecraft) ---
        // Каждая часть имеет 6 сторон. Здесь прописаны размеры и смещение в итоговом 64x64 PNG.
        const CONFIG = {
            head: { 
                size: [8, 8],
                front: [8, 8], back: [24, 8], top: [8, 0], bottom: [16, 0], right: [0, 8], left: [16, 8]
            },
            body: {
                size: [8, 12],
                front: [20, 20], back: [32, 20], top: [20, 16], bottom: [28, 16], right: [16, 20], left: [28, 20]
            },
            arm_r: { size: [4, 12], front: [44, 20], back: [52, 20], top: [44, 16], bottom: [48, 16], right: [40, 20], left: [48, 20] },
            arm_l: { size: [4, 12], front: [36, 52], back: [44, 52], top: [36, 48], bottom: [40, 48], right: [32, 52], left: [40, 52] },
            leg_r: { size: [4, 12], front: [4, 20], back: [12, 20], top: [4, 16], bottom: [8, 16], right: [0, 20], left: [8, 20] },
            leg_l: { size: [4, 12], front: [20, 52], back: [28, 52], top: [20, 48], bottom: [24, 48], right: [16, 52], left: [24, 52] }
        };

        // --- 3. СОСТОЯНИЕ ---
        let state = {
            part: 'head',
            side: 'front',
            tool: 'pen',
            color: '#ff4757',
            isDrawing: false,
            // Мастер-холст 64x64 где хранится всё
            masterCanvas: document.createElement('canvas'),
            undoStack: []
        };
        state.masterCanvas.width = 64;
        state.masterCanvas.height = 64;
        const mctx = state.masterCanvas.getContext('2d');

        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        
        // Загрузка из LocalStorage
        const savedData = localStorage.getItem('skinx_master');
        if (savedData) {
            const img = new Image();
            img.onload = () => {
                mctx.drawImage(img, 0, 0);
                updateEditorFromMaster();
            };
            img.src = savedData;
        }

        // --- 4. ЛОГИКА РЕДАКТОРА ---
        function updateEditorFromMaster() {
            const conf = CONFIG[state.part];
            const coords = conf[state.side];
            canvas.width = conf.size[0];
            canvas.height = conf.size[1];
            
            // Масштаб для мобилки
            const scale = 280 / Math.max(canvas.width, canvas.height);
            canvas.style.width = (canvas.width * scale) + "px";
            canvas.style.height = (canvas.height * scale) + "px";

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(state.masterCanvas, coords[0], coords[1], canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
            
            document.getElementById('partDisplay').innerText = `${state.part.toUpperCase()}: ${state.side.toUpperCase()}`;
        }

        function saveToMaster() {
            const coords = CONFIG[state.part][state.side];
            mctx.clearRect(coords[0], coords[1], canvas.width, canvas.height);
            mctx.drawImage(canvas, coords[0], coords[1]);
            localStorage.setItem('skinx_master', state.masterCanvas.toDataURL());
        }

        // Рисование
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor(((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / (rect.width / canvas.width));
            const y = Math.floor(((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / (rect.height / canvas.height));
            return { x, y };
        }

        function handlePointer(e) {
            if (!state.isDrawing) return;
            const { x, y } = getCoords(e);
            if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

            if (state.tool === 'pen') {
                ctx.fillStyle = state.color;
                ctx.fillRect(x, y, 1, 1);
            } else if (state.tool === 'eraser') {
                ctx.clearRect(x, y, 1, 1);
            } else if (state.tool === 'picker') {
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                if (pixel[3] > 0) {
                    const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
                    setColor(hex);
                }
                return;
            } else if (state.tool === 'fill') {
                floodFill(x, y, state.color);
            }
            
            saveToMaster();
        }

        function floodFill(x, y, color) {
            const targetColor = ctx.getImageData(x, y, 1, 1).data;
            const fillColor = hexToRgb(color);
            if (colorsMatch(targetColor, fillColor)) return;

            const pixelsToCheck = [x, y];
            while (pixelsToCheck.length > 0) {
                const py = pixelsToCheck.pop();
                const px = pixelsToCheck.pop();
                const currentColor = ctx.getImageData(px, py, 1, 1).data;

                if (colorsMatch(currentColor, targetColor)) {
                    ctx.fillStyle = color;
                    ctx.fillRect(px, py, 1, 1);
                    if (px > 0) pixelsToCheck.push(px - 1, py);
                    if (px < canvas.width - 1) pixelsToCheck.push(px + 1, py);
                    if (py > 0) pixelsToCheck.push(px, py - 1);
                    if (py < canvas.height - 1) pixelsToCheck.push(px, py + 1);
                }
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16), 255] : null;
        }

        function colorsMatch(c1, c2) {
            return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
        }

        // --- 5. ОБРАБОТЧИКИ СОБЫТИЙ ---

        // Холст
        canvas.addEventListener('pointerdown', (e) => { 
            state.isDrawing = true; 
            tg.HapticFeedback.impactOccurred('light');
            handlePointer(e); 
        });
        window.addEventListener('pointerup', () => state.isDrawing = false);
        canvas.addEventListener('pointermove', handlePointer);

        // Переключение инструментов
        document.querySelectorAll('[data-tool]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.tool = btn.dataset.tool;
                tg.HapticFeedback.selectionChanged();
            };
        });

        // Палитра
        const activeColorBtn = document.getElementById('activeColor');
        const paletteBox = document.getElementById('paletteBox');
        activeColorBtn.onclick = () => paletteBox.classList.toggle('open');

        function setColor(hex) {
            state.color = hex;
            activeColorBtn.style.background = hex;
            paletteBox.classList.remove('open');
            tg.HapticFeedback.impactOccurred('light');
        }

        document.getElementById('customColor').oninput = (e) => setColor(e.target.value);

        // Переключение частей тела
        document.getElementById('partList').onclick = (e) => {
            if (e.target.dataset.part) {
                document.querySelectorAll('#partList .chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                state.part = e.target.dataset.part;
                updateEditorFromMaster();
                tg.HapticFeedback.selectionChanged();
            }
        };

        // Переключение сторон
        document.getElementById('sideList').onclick = (e) => {
            if (e.target.dataset.side) {
                document.querySelectorAll('#sideList .chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                state.side = e.target.dataset.side;
                updateEditorFromMaster();
                tg.HapticFeedback.selectionChanged();
            }
        };

        // Сброс
        document.getElementById('resetBtn').onclick = () => {
            if (confirm("Удалить весь прогресс?")) {
                mctx.clearRect(0,0,64,64);
                localStorage.removeItem('skinx_master');
                updateEditorFromMaster();
                tg.HapticFeedback.notificationOccurred('warning');
            }
        };

        // Экспорт
        function exportFullSkin() {
            const link = document.createElement('a');
            link.download = 'skinx_export.png';
            link.href = state.masterCanvas.toDataURL("image/png");
            link.click();
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("Скин успешно экспортирован! Теперь его можно загрузить в Minecraft.");
        }

        // Запуск
        updateEditorFromMaster();
    </script>
</body>
</html>
