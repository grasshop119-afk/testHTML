<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, vertical-align=middle, viewport-fit=cover">
    <title>Guild FAQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --secondary-bg: #1C1C1E;
            --text-color: #FFFFFF;
            --secondary-text: #8E8E93;
            --accent-color: #0A84FF;
            --separator-color: #38383A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header в стиле Apple */
        header {
            padding: 60px 16px 10px 16px; /* Отступ сверху для Fullscreen */
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .container {
            padding: 16px;
        }

        /* Модульные карточки для разного контента */
        .card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 12px 16px;
            font-size: 13px;
            text-transform: uppercase;
            color: var(--secondary-text);
            font-weight: 500;
        }

        .card-content {
            padding: 0 16px 16px 16px;
        }

        /* Список (для сокращений) */
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--separator-color);
        }
        .list-item:last-child { border-bottom: none; }
        
        .term { font-weight: 600; color: var(--accent-color); }
        .definition { color: var(--text-color); text-align: right; }

        /* Таблицы (на легенд) */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th { text-align: left; color: var(--secondary-text); padding: 8px 0; }
        td { padding: 10px 0; border-top: 0.5px solid var(--separator-color); }

        /* Изображения (жетоны и т.д.) */
        .faq-image {
            width: 100%;
            border-radius: 8px;
            display: block;
            margin-top: 10px;
        }

        /* Кнопка "Share" из твоих настроек */
        .share-button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        /* Твое пожелание: не темнеет при наведении/нажатии */
        .share-button:active, .share-button:hover {
            opacity: 1; 
        }

    </style>
</head>
<body>

    <header>
        <h1>FAQ</h1>
    </header>

    <div class="container">
        
        <div class="card">
            <div class="card-header">Сленг гильдии</div>
            <div class="card-content">
                <div class="list-item">
                    <span class="term">ГвГ</span>
                    <span class="definition">Гильдия против Гильдии</span>
                </div>
                <div class="list-item">
                    <span class="term">КП</span>
                    <span class="definition">Конста пати (постоянная группа)</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Тир-лист легенд</div>
            <div class="card-content">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Герой</th>
                                <th>Роль</th>
                                <th>Оценка</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Артур</td>
                                <td>Танк</td>
                                <td>S+</td>
                            </tr>
                            <tr>
                                <td>Мерлин</td>
                                <td>Маг</td>
                                <td>S</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">График жетонов</div>
            <div class="card-content">
                <p style="font-size: 14px; margin-bottom: 8px;">Актуальное расписание на февраль:</p>
                <img src="https://via.placeholder.com/400x200" alt="Жетоны" class="faq-image">
            </div>
        </div>

        <button class="share-button">Поделиться с сокланом</button>

    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на весь экран
        
        // Установка цвета статус-бара
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
