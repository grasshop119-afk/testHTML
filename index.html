<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 26 Tab Bar</title>
    <style>
        :root {
            --bg-color: #000000;
            --tab-bar-bg: rgba(25, 25, 25, 0.8);
            --active-accent: #3da9ff;
            --text-inactive: #8e8e93;
            --text-active: #ffffff;
            --pill-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        /* Контейнер для таббара */
        .tab-bar-container {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
        }

        /* Основной блок переключателей */
        .ios-tab-bar {
            position: relative;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            display: flex;
            padding: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            width: fit-content;
        }

        /* Кнопка таба */
        .tab-item {
            position: relative;
            z-index: 2;
            padding: 10px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: none;
            min-width: 90px;
            transition: transform 0.2s ease;
        }

        .tab-item:active {
            transform: scale(0.95);
        }

        /* Иконка (заглушка) */
        .tab-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: var(--text-inactive);
            transition: fill 0.3s ease, color 0.3s ease;
        }

        .tab-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-inactive);
            transition: color 0.3s ease;
        }

        /* Активное состояние текста и иконок */
        .tab-item.active .tab-text {
            color: var(--active-accent);
        }
        
        /* Особый случай для белых иконок из твоего скрина */
        .tab-item.active .tab-icon {
            fill: var(--active-accent);
        }

        /* Плавающий фон (Slider) */
        .tab-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--pill-bg);
            border-radius: 35px;
            z-index: 1;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Кнопка поиска отдельно */
        .search-button {
            background: var(--tab-bar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .search-button svg {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar" id="tabBar">
        <div class="tab-slider" id="slider"></div>

        <button class="tab-item active" onclick="moveSlider(this, 0)">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span class="tab-text">Вызовы</span>
        </button>

        <button class="tab-item" onclick="moveSlider(this, 1)">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="tab-text" style="color: white;">Контакты</span>
        </button>

        <button class="tab-item" onclick="moveSlider(this, 2)">
            <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="7" cy="7" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
            <span class="tab-text" style="color: white;">Клавиши</span>
        </button>
    </nav>

    <button class="search-button">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
</div>

<script>
    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    function moveSlider(element, index) {
        // Убираем активный класс у всех
        tabs.forEach(tab => tab.classList.remove('active'));
        // Добавляем текущему
        element.classList.add('active');

        // Вычисляем размеры и позицию для слайдера
        const { offsetLeft, offsetWidth } = element;
        slider.style.left = `${offsetLeft}px`;
        slider.style.width = `${offsetWidth}px`;
    }

    // Инициализация позиции при загрузке
    window.onload = () => {
        const activeTab = document.querySelector('.tab-item.active');
        moveSlider(activeTab, 0);
    };
</script>

</body>
</html>
