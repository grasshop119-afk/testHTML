<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skinx Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: #1C1C1E;
            --ios-btn: #2C2C2E;
            --ios-accent: #0A84FF;
            --ios-text: #FFFFFF;
            --ios-sub: #8E8E93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0;
            padding: 0;
            background: var(--ios-bg);
            color: var(--ios-text);
            font-family: 'Manrope', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 50px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; opacity: 0.9; }

        .circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--ios-btn);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .circle-btn:active { transform: scale(0.9); background: #3A3A3C; }
        .circle-btn.apply { background: var(--ios-accent); }

        /* 3D PREVIEW AREA */
        #preview-3d {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 100px;
            right: 20px;
            z-index: 50;
            pointer-events: none;
        }

        /* EDITOR VIEWPORT */
        #viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-container {
            position: relative;
            padding: 10px;
            background: #111;
            border-radius: 20px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
        }

        canvas#mainEditor {
            display: block;
            image-rendering: pixelated;
            touch-action: none;
            border-radius: 4px;
            background-image: 
                linear-gradient(45deg, #1a1a1a 25%, transparent 25%), 
                linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
                linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 16px 16px;
        }

        /* PALETTE & TOOLS */
        .tools-shelf {
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        .palette-dock {
            display: flex;
            background: var(--ios-card);
            padding: 6px;
            border-radius: 30px;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .color-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .color-dot.active { transform: scale(1.15); border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        /* MODAL BOTTOM */
        .ios-modal {
            background: var(--ios-card);
            border-radius: 30px 30px 0 0;
            padding: 20px 20px 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .modal-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--ios-sub);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            padding-left: 5px;
        }

        .scroll-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        .ios-chip {
            background: var(--ios-btn);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            color: var(--ios-sub);
            transition: 0.3s;
        }
        .ios-chip.active { background: white; color: black; }

        /* TOOL BAR FLOATING */
        .floating-tools {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <button class="circle-btn" id="undoBtn"><i data-lucide="undo-2"></i></button>
        <span class="logo">SKINX</span>
        <button class="circle-btn apply" id="applyBtn"><i data-lucide="check"></i></button>
    </header>

    <div id="preview-3d"></div>

    <div id="viewport">
        <div class="canvas-container">
            <canvas id="mainEditor"></canvas>
        </div>
        
        <div class="tools-shelf">
            <button class="circle-btn active" data-t="pen"><i data-lucide="pencil"></i></button>
            <button class="circle-btn" data-t="fill"><i data-lucide="paint-bucket"></i></button>
            <button class="circle-btn" data-t="eraser"><i data-lucide="eraser"></i></button>
            
            <div class="palette-dock">
                <div class="color-dot active" style="background: #FF3B30;" onclick="pickColor('#FF3B30', this)"></div>
                <div class="color-dot" style="background: #4CD964;" onclick="pickColor('#4CD964', this)"></div>
                <div class="color-dot" style="background: #007AFF;" onclick="pickColor('#007AFF', this)"></div>
                <div class="color-dot" style="background: #FFCC00;" onclick="pickColor('#FFCC00', this)"></div>
                <input type="color" id="hexPicker" style="display:none">
                <div class="color-dot" style="background: linear-gradient(45deg, red, blue);" onclick="document.getElementById('hexPicker').click()"></div>
            </div>
        </div>
    </div>

    <div class="ios-modal">
        <div class="modal-label">ЧАСТЬ ТЕЛА</div>
        <div class="scroll-row" id="partsRow">
            <div class="ios-chip active" data-p="head">Голова</div>
            <div class="ios-chip" data-p="body">Тело</div>
            <div class="ios-chip" data-p="arm_r">П. Рука</div>
            <div class="ios-chip" data-p="arm_l">Л. Рука</div>
            <div class="ios-chip" data-p="leg_r">П. Нога</div>
            <div class="ios-chip" data-p="leg_l">Л. Нога</div>
        </div>

        <div class="modal-label">РАКУРС</div>
        <div class="scroll-row" id="sidesRow">
            <div class="ios-chip active" data-s="front">Спереди</div>
            <div class="ios-chip" data-s="back">Сзади</div>
            <div class="ios-chip" data-s="left">Слева</div>
            <div class="ios-chip" data-s="right">Справа</div>
            <div class="ios-chip" data-s="top">Сверху</div>
            <div class="ios-chip" data-s="bottom">Снизу</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setParams({ text: 'СОХРАНИТЬ В ГАЛЕРЕЮ', is_visible: true, color: '#0A84FF' });
        tg.MainButton.onClick(() => exportSkin());

        lucide.createIcons();

        // --- 1. CONFIG & STATE ---
        const UV = {
            head: { size: [8,8], front:[8,8], back:[24,8], left:[16,8], right:[0,8], top:[8,0], bottom:[16,0] },
            body: { size: [8,12], front:[20,20], back:[32,20], left:[28,20], right:[16,20], top:[20,16], bottom:[28,16] },
            arm_r: { size: [4,12], front:[44,20], back:[52,20], left:[48,20], right:[40,20], top:[44,16], bottom:[48,16] },
            arm_l: { size: [4,12], front:[36,52], back:[44,52], left:[40,52], right:[32,52], top:[36,48], bottom:[40,48] },
            leg_r: { size: [4,12], front:[4,20], back:[12,20], left:[8,20], right:[0,20], top:[4,16], bottom:[8,16] },
            leg_l: { size: [4,12], front:[20,52], back:[28,52], left:[24,52], right:[16,52], top:[20,48], bottom:[24,48] }
        };

        let state = {
            part: 'head', side: 'front', color: '#FF3B30', tool: 'pen',
            isDrawing: false,
            master: document.createElement('canvas')
        };
        state.master.width = 64; state.master.height = 64;
        const mctx = state.master.getContext('2d');

        const editor = document.getElementById('mainEditor');
        const ectx = editor.getContext('2d');

        // --- 2. 3D PREVIEW (Three.js) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(100, 100);
        document.getElementById('preview-3d').appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: false });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 2.5;

        function update3DRotation() {
            const rotations = {
                front: [0, 0], back: [0, Math.PI],
                left: [0, Math.PI/2], right: [0, -Math.PI/2],
                top: [Math.PI/2, 0], bottom: [-Math.PI/2, 0]
            };
            const target = rotations[state.side];
            // Плавная анимация поворота куба
            cube.rotation.set(target[0], target[1], 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // --- 3. EDITOR LOGIC ---
        function syncEditor() {
            const cfg = UV[state.part];
            const pos = cfg[state.side];
            editor.width = cfg.size[0];
            editor.height = cfg.size[1];
            
            // UI Scaling
            const zoom = window.innerWidth * 0.7 / editor.width;
            editor.style.width = (editor.width * zoom) + "px";
            editor.style.height = (editor.height * zoom) + "px";

            ectx.imageSmoothingEnabled = false;
            ectx.drawImage(state.master, pos[0], pos[1], editor.width, editor.height, 0, 0, editor.width, editor.height);
            update3DRotation();
        }

        function commit() {
            const pos = UV[state.part][state.side];
            mctx.clearRect(pos[0], pos[1], editor.width, editor.height);
            mctx.drawImage(editor, pos[0], pos[1]);
            tg.HapticFeedback.notificationOccurred('success');
            localStorage.setItem('skinx_v2', state.master.toDataURL());
        }

        // DRAWING
        function paint(e) {
            if(!state.isDrawing) return;
            const rect = editor.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = Math.floor((clientX - rect.left) / (rect.width / editor.width));
            const y = Math.floor((clientY - rect.top) / (rect.height / editor.height));

            if(state.tool === 'pen') {
                ectx.fillStyle = state.color;
                ectx.fillRect(x, y, 1, 1);
            } else if(state.tool === 'eraser') {
                ectx.clearRect(x, y, 1, 1);
            }
        }

        editor.onpointerdown = (e) => { state.isDrawing = true; paint(e); tg.HapticFeedback.impactOccurred('light'); };
        window.onpointerup = () => state.isDrawing = false;
        editor.onpointermove = paint;

        // --- 4. UI HANDLERS ---
        function pickColor(hex, el) {
            state.color = hex;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            tg.HapticFeedback.selectionChanged();
        }

        document.querySelectorAll('[data-t]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-t]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.tool = btn.dataset.t;
                tg.HapticFeedback.impactOccurred('medium');
            };
        });

        document.getElementById('partsRow').onclick = (e) => {
            const chip = e.target.closest('.ios-chip');
            if(chip) {
                document.querySelectorAll('#partsRow .ios-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                state.part = chip.dataset.p;
                syncEditor();
            }
        };

        document.getElementById('sidesRow').onclick = (e) => {
            const chip = e.target.closest('.ios-chip');
            if(chip) {
                document.querySelectorAll('#sidesRow .ios-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                state.side = chip.dataset.s;
                syncEditor();
            }
        };

        document.getElementById('applyBtn').onclick = () => {
            commit();
            const btn = document.getElementById('applyBtn');
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        };

        document.getElementById('hexPicker').oninput = (e) => {
            state.color = e.target.value;
            tg.HapticFeedback.selectionChanged();
        };

        function exportSkin() {
            const data = state.master.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = data;
            link.download = 'skin_premium.png';
            link.click();
            tg.showPopup({ title: 'Готово!', message: 'Скин сохранен в загрузки.', buttons: [{type: 'ok'}] });
        }

        // LOAD SAVED
        const last = localStorage.getItem('skinx_v2');
        if(last) {
            const img = new Image();
            img.onload = () => { mctx.drawImage(img, 0, 0); syncEditor(); };
            img.src = last;
        }

        syncEditor();
    </script>
</body>
</html>
