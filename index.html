<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Wallet Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #000000;
            --tg-theme-secondary-bg-color: #1c1c1d;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #aaaaaa;
            --tg-theme-button-color: #007aff;
            --tg-theme-accent-text-color: #62bcf9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header & Dynamic Greeting */
        .header {
            padding: 16px;
            text-align: center;
            height: 24px;
            position: relative;
        }

        .dynamic-text {
            font-size: 17px;
            font-weight: 600;
            opacity: 0.55; /* Твоя настройка прозрачности */
            transition: all 0.5s ease-in-out;
            position: absolute;
            width: 100%;
            left: 0;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .fade-in {
            opacity: 0.55;
            transform: translateY(0);
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #62bcf9, #2979ff);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-handle {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
        }

        /* Tabs Logic */
        .page {
            display: none;
            padding: 16px;
            animation: slideIn 0.2s ease-out;
        }

        .page.active {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Search Page Style */
        .search-header {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            padding-left: 8px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .search-bar {
            width: 92%; /* Чуть уже ширины экрана */
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 12px; /* Скругленные углы */
            padding: 12px 16px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            font-size: 17px;
            width: 100%;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--tg-theme-hint-color);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: rgba(28, 28, 29, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 24px 0;
            border-top: 0.5px solid #333;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--tg-theme-hint-color);
            font-size: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--tg-theme-button-color);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* Placeholder for content */
        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: var(--tg-theme-hint-color);
        }
    </style>
</head>
<body>

    <div id="wallet" class="page active">
        <div class="header">
            <span id="header-text" class="dynamic-text">С возвращением</span>
        </div>

        <div class="profile-section">
            <div class="avatar">JD</div>
            <div class="user-name">John Doe</div>
            <div class="user-handle">@johndoe</div>
        </div>
        
        </div>

    <div id="search" class="page">
        <div class="search-header">Поиск</div>
        <div class="search-container">
            <div class="search-bar">
                <input type="text" placeholder="Поиск активов или новостей" autofocus>
            </div>
        </div>
        <div class="empty-state">Введите запрос для поиска</div>
    </div>

    <div id="trade" class="page">
        <div class="search-header">Торговля</div>
    </div>
    <div id="history" class="page">
        <div class="search-header">История</div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('wallet', this)">
            <span class="nav-icon">👛</span>
            <span>Кошелёк</span>
        </div>
        <div class="nav-item" onclick="showPage('search', this)">
            <span class="nav-icon">🔍</span>
            <span>Поиск</span>
        </div>
        <div class="nav-item" onclick="showPage('trade', this)">
            <span class="nav-icon">📈</span>
            <span>Маркет</span>
        </div>
        <div class="nav-item" onclick="showPage('history', this)">
            <span class="nav-icon">🕒</span>
            <span>История</span>
        </div>
    </nav>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Анимация смены текста в заголовке
        setTimeout(() => {
            const headerText = document.getElementById('header-text');
            headerText.classList.add('fade-out');
            
            setTimeout(() => {
                headerText.innerText = 'FAQ';
                headerText.classList.remove('fade-out');
                headerText.classList.add('fade-in');
            }, 500);
        }, 3000);

        // 2. Переключение вкладок
        function showPage(pageId, element) {
            // Убираем активный класс у всех страниц и кнопок
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            // Активируем нужную
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');

            // Легкая вибрация при смене вкладки (нативно для ТГ)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
</html>
