<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jar of Days | Коллекция твоих достижений</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --jar-glass: rgba(255, 255, 255, 0.08);
            --jar-border: rgba(255, 255, 255, 0.15);
            
            /* Цвета фантиков (Металлик) */
            --foil-gold: linear-gradient(135deg, #ffd700 0%, #ffface 20%, #d4af37 40%, #f9e18b 60%, #b8860b 80%, #ffd700 100%);
            --foil-green: linear-gradient(135deg, #2ecc71 0%, #a2f9b1 20%, #27ae60 40%, #d5f5e3 60%, #1e8449 80%, #2ecc71 100%);
            --foil-red: linear-gradient(135deg, #e74c3c 0%, #ffadad 20%, #c0392b 40%, #fadbd8 60%, #943126 80%, #e74c3c 100%);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .title-section {
            text-align: center;
            margin-bottom: 20px;
            z-index: 5;
        }

        .title-section h1 {
            font-weight: 200;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            opacity: 0.7;
        }

        .month-name {
            color: var(--ribbon-color);
            font-weight: bold;
        }

        /* КОНСТРУКЦИЯ БАНКИ */
        .jar-wrapper {
            position: relative;
            width: 280px;
            height: 380px;
            margin-bottom: 30px;
        }

        .jar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90%;
            background: var(--jar-glass);
            border: 2px solid var(--jar-border);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            display: flex;
            flex-wrap: wrap-reverse;
            padding: 25px;
            align-content: flex-start;
            overflow: hidden;
            z-index: 2;
        }

        .jar::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 15%;
            height: 70%;
            background: linear-gradient(to right, rgba(255,255,255,0.1), transparent);
            border-radius: 50px;
        }

        .lid {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 10px;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .ribbon {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 20px;
            background: var(--ribbon-color);
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            border-radius: 2px;
            transition: background 1s ease;
        }

        /* ФАНТИКИ */
        .wrapper {
            width: 45px;
            height: 45px;
            margin: 5px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
            cursor: pointer;
            transition: transform 0.3s;
            animation: fall 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .wrapper:hover {
            transform: scale(1.2) rotate(10deg) !important;
            z-index: 10;
        }

        @keyframes fall {
            0% { transform: translateY(-300px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(0) rotate(var(--r)); opacity: 1; }
        }

        /* ИНТЕРФЕЙС */
        .ui-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 5;
        }

        .input-day {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            padding: 10px;
            width: 300px;
            text-align: center;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-day:focus { border-color: var(--ribbon-color); }

        .btn-group {
            display: flex;
            gap: 25px;
        }

        .choice-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .choice-btn:hover { transform: scale(1.15); }
        .choice-btn.active { border-color: #fff; }

        .gold-btn { background: var(--foil-gold); }
        .green-btn { background: var(--foil-green); }
        .red-btn { background: var(--foil-red); }

        .add-btn {
            margin-top: 10px;
            background: none;
            border: 1px solid #444;
            color: #aaa;
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .add-btn:hover { background: #fff; color: #000; }

        /* Всплывающая подсказка */
        .tooltip {
            position: fixed;
            background: rgba(255,255,255,0.9);
            color: #000;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            max-width: 200px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="title-section">
        <h1 id="jarTitle">Банка: <span class="month-name" id="monthDisplay">...</span></h1>
    </div>

    <div class="jar-wrapper">
        <div class="lid"></div>
        <div class="ribbon" id="jarRibbon"></div>
        <div class="jar" id="mainJar"></div>
    </div>

    <div class="ui-panel">
        <input type="text" id="dayText" class="input-day" placeholder="Как прошел день?" maxlength="60">
        <div class="btn-group">
            <div class="choice-btn gold-btn" onclick="selectColor('gold', this)"></div>
            <div class="choice-btn green-btn" onclick="selectColor('green', this)"></div>
            <div class="choice-btn red-btn" onclick="selectColor('red', this)"></div>
        </div>
        <button class="add-btn" onclick="throwWrapper()">Бросить фантик</button>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        let selectedColor = null;
        const jarElement = document.getElementById('mainJar');
        const tooltip = document.getElementById('tooltip');

        // 1. ЛОГИКА СЕЗОНОВ И ЦВЕТОВ ЛЕНТЫ
        const seasons = {
            winter: ['#2c3e50', '#3498db', '#85c1e9'], // Дек, Янв, Фев
            spring: ['#27ae60', '#58d68d', '#abebc6'], // Мар, Апр, Май
            summer: ['#f1c40f', '#f7dc6f', '#fef9e7'], // Июн, Июл, Авг
            autumn: ['#e67e22', '#d35400', '#ba4a00']  // Сен, Окт, Ноя
        };

        const monthNames = ["ЯНВАРЬ", "ФЕВРАЛЬ", "МАРТ", "АПРЕЛЬ", "МАЙ", "ИЮНЬ", 
                            "ИЮЛЬ", "АВГУСТ", "СЕНТЯБРЬ", "ОКТЯБРЬ", "НОЯБРЬ", "ДЕКАБРЬ"];

        function updateSeasonUI() {
            const now = new Date();
            const monthIndex = now.getMonth(); 
            const monthName = monthNames[monthIndex];
            
            document.getElementById('monthDisplay').innerText = monthName;

            let seasonKey;
            if (monthIndex === 11 || monthIndex <= 1) seasonKey = 'winter';
            else if (monthIndex <= 4) seasonKey = 'spring';
            else if (monthIndex <= 7) seasonKey = 'summer';
            else seasonKey = 'autumn';

            // Берем оттенок в зависимости от того, какой это месяц в сезоне (0, 1 или 2)
            const shadeIndex = (monthIndex % 3);
            const color = seasons[seasonKey][shadeIndex];
            document.documentElement.style.setProperty('--ribbon-color', color);
        }

        // 2. ВЫБОР ЦВЕТА
        function selectColor(color, btn) {
            selectedColor = color;
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 3. МЕХАНИКА БРОСКА
        function throwWrapper() {
            const text = document.getElementById('dayText').value.trim();
            
            if (!selectedColor) {
                alert("Сначала выбери цвет фантика!");
                return;
            }
            if (!text) {
                alert("Напиши пару слов о сегодняшнем дне.");
                return;
            }

            const wrapperData = {
                id: Date.now(),
                color: selectedColor,
                text: text,
                rotation: Math.floor(Math.random() * 360),
                date: new Date().toLocaleDateString()
            };

            saveWrapper(wrapperData);
            renderWrapper(wrapperData);

            // Очистка
            document.getElementById('dayText').value = '';
        }

        function renderWrapper(data) {
            const div = document.createElement('div');
            div.className = 'wrapper';
            div.style.background = `var(--foil-${data.color})`;
            div.style.setProperty('--r', `${data.rotation}deg`);
            div.style.transform = `rotate(${data.rotation}deg)`;
            
            // Просмотр текста при наведении
            div.onmouseover = (e) => {
                tooltip.style.display = 'block';
                tooltip.innerText = `${data.date}: ${data.text}`;
            };
            div.onmousemove = (e) => {
                tooltip.style.left = e.clientX + 15 + 'px';
                tooltip.style.top = e.clientY + 15 + 'px';
            };
            div.onmouseout = () => {
                tooltip.style.display = 'none';
            };

            jarElement.appendChild(div);
        }

        // 4. СОХРАНЕНИЕ (LocalStorage)
        function saveWrapper(data) {
            const monthKey = new Date().getMonth() + '-' + new Date().getFullYear();
            let history = JSON.parse(localStorage.getItem('jarHistory') || '{}');
            
            if (!history[monthKey]) history[monthKey] = [];
            history[monthKey].push(data);
            
            localStorage.setItem('jarHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const monthKey = new Date().getMonth() + '-' + new Date().getFullYear();
            let history = JSON.parse(localStorage.getItem('jarHistory') || '{}');
            const currentMonthData = history[monthKey] || [];
            
            currentMonthData.forEach(item => renderWrapper(item));
        }

        // Инициализация
        updateSeasonUI();
        loadHistory();
    </script>
</body>
</html>
