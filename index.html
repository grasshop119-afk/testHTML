<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skinx — Pro Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #1a1f26;
            --accent: #007aff; /* Apple-style blue */
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-weight: 800; font-size: 20px; color: var(--accent); letter-spacing: 1px; }

        /* Рабочая область */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            background-color: #2a2a2a;
            /* Текстура шахматки для прозрачности */
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%), 
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 10px 10px;
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* Направляющая разметка (Blueprint) */
        #guide-overlay {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            opacity: 0.6;
            image-rendering: pixelated;
        }

        /* Панель инструментов */
        .controls {
            background: var(--panel);
            padding: 20px;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tool-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            background: #2c3440;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn.active { background: var(--accent); }

        .color-picker-wrapper {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            position: relative;
        }

        #colorPicker {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            cursor: pointer;
        }

        .save-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">SKINX</span>
        <button class="btn" onclick="toggleGuide()"><i data-lucide="layout"></i></button>
    </header>

    <div id="viewport">
        <div class="canvas-wrapper" id="wrap">
            <canvas id="mainCanvas" width="64" height="64"></canvas>
            <canvas id="guide-overlay" width="64" height="64"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="tool-row">
            <div class="color-picker-wrapper">
                <input type="color" id="colorPicker" value="#00ff00">
            </div>
            <button class="btn active" id="penTool"><i data-lucide="pencil"></i></button>
            <button class="btn" id="eraserTool"><i data-lucide="eraser"></i></button>
            <button class="btn" onclick="clearAll()"><i data-lucide="trash-2"></i></button>
        </div>
        
        <button class="save-btn" onclick="exportPNG()">Скачать скин .PNG</button>
    </div>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const guide = document.getElementById('guide-overlay');
        const gctx = guide.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');

        let isDrawing = false;
        let currentTool = 'pen';

        // Адаптация размера под экран
        const displaySize = Math.min(window.innerWidth - 60, 400);
        canvas.style.width = canvas.style.height = displaySize + 'px';
        guide.style.width = guide.style.height = displaySize + 'px';

        // Рисуем разметку (Blueprint) Minecraft скина
        function drawSkinGuide() {
            gctx.strokeStyle = "rgba(255,255,255,0.8)";
            gctx.lineWidth = 0.5;

            // Голова (Head)
            gctx.strokeRect(8, 0, 8, 8);   // Top
            gctx.strokeRect(8, 8, 8, 8);   // Front (лицо)
            
            // Тело (Body)
            gctx.strokeRect(20, 20, 8, 12); // Front
            
            // Руки и ноги
            gctx.strokeRect(4, 20, 4, 12);  // Leg
            gctx.strokeRect(44, 20, 4, 12); // Arm
            
            gctx.fillStyle = "rgba(255,255,255,0.2)";
            gctx.font = "4px Arial";
            gctx.fillText("FACE", 9, 14);
        }
        drawSkinGuide();

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor(((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / (rect.width / 64));
            const y = Math.floor(((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / (rect.height / 64));
            return { x, y };
        }

        function draw(e) {
            if (!isDrawing) return;
            const {x, y} = getCoords(e);
            
            if (currentTool === 'pen') {
                ctx.fillStyle = colorPicker.value;
                ctx.fillRect(x, y, 1, 1);
            } else {
                ctx.clearRect(x, y, 1, 1);
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; draw(e); });
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

        // Инструменты
        document.getElementById('penTool').onclick = () => { currentTool = 'pen'; setActive('penTool'); };
        document.getElementById('eraserTool').onclick = () => { currentTool = 'eraser'; setActive('eraserTool'); };
        
        function setActive(id) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function clearAll() { if(confirm("Очистить?")) ctx.clearRect(0,0,64,64); }

        function toggleGuide() {
            guide.style.display = guide.style.display === 'none' ? 'block' : 'none';
        }

        function exportPNG() {
            const link = document.createElement('a');
            link.download = 'skin.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
