<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Glass Tabbar</title>
    <style>
        :root {
            /* Полностью универсальные цвета на основе альфа-каналов */
            --glass-border: rgba(255, 255, 255, 0.45);
            --active-accent: #ffffff;
            --inactive-color: rgba(255, 255, 255, 0.75);
            /* Капля на фото темная и элегантная */
            --slider-bg: rgba(0, 0, 0, 0.28);
            --slider-border-moving: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkLiZZofuMdxDrT1-l8xUj0r7hEpeStNzrFqFqgayAjeO5YdDEWEJXo_lQ&s=10') no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .tab-bar-container {
            margin-bottom: calc(25px + env(safe-area-inset-bottom));
            width: 90%;
            max-width: 410px;
        }

        /* ТОЧНАЯ КОПИЯ СТЕКЛЯННОЙ ТРУБКИ С ФОТО */
        .ios-tab-bar {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            /* Умеренный блур и легкое искажение за счет сатурации фона */
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            border-radius: 40px;
            display: flex;
            padding: 6px;
            /* Толстый стеклянный ободок */
            border: 1.5px solid var(--glass-border);
            /* Эффект преломления света внутри линзы по бокам */
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2), 
                        0 10px 30px rgba(0, 0, 0, 0.12);
            justify-content: space-around;
            align-items: center;
        }

        .tab-item {
            position: relative;
            z-index: 2;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Иконки стали крупнее, как на рендере */
        .icon-wrapper {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--inactive-color);
            transition: color 0.25s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        /* МЯГКАЯ ТЕМНАЯ КАПЛЯ БЕЗ СВЕРХОБЪЕМА */
        .liquid-slider {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            background: var(--slider-bg);
            backdrop-filter: blur(2px);
            border-radius: 34px;
            z-index: 1;
            pointer-events: none;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
            will-change: transform, left, width, background-color, border-color;
            transition: background-color 0.16s ease-out, border-color 0.16s ease-out;
        }

        /* При прыжке капля утончается и теряет темный цвет */
        .liquid-slider.flying {
            background-color: transparent !important; 
            border-color: var(--slider-border-moving) !important;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="tab-bar-container">
    <nav class="ios-tab-bar">
        <div class="liquid-slider" id="slider"></div>

        <button class="tab-item active" data-index="0">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/6997/6997164.png');"></div>
            <span class="tab-text">Home</span>
        </button>

        <button class="tab-item" data-index="1">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/2769/2769160.png');"></div>
            <span class="tab-text">Menu</span>
        </button>

        <button class="tab-item" data-index="2">
            <div class="icon-wrapper" style="-webkit-mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png'); mask-image: url('https://cdn-icons-png.flaticon.com/512/9959/9959489.png');"></div>
            <span class="tab-text">Settings</span>
        </button>
    </nav>
</div>

<script>
    const PHYSICS = { pos: { k: 380, d: 38, m: 1 }, scale: { k: 420, d: 24, m: 1 } };
    const slider = document.getElementById('slider');
    const tabs = document.querySelectorAll('.tab-item');

    let state = { x: 0, tx: 0, vx: 0, w: 0, tw: 0, vw: 0, sx: 1, tsx: 1, vsx: 0, sy: 1, tsy: 1, vsy: 0, isMoving: false, intensity: 1, currentIndex: 0 };

    function spring(curr, tgt, vel, cfg) {
        const acc = (-cfg.k * (curr - tgt) - cfg.d * vel) / cfg.m;
        vel += acc * 0.016;
        return [curr + vel * 0.016, vel];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);

        if (state.isMoving) {
            if (dist > 15) { 
                slider.classList.add('flying');
                /* Рост по вертикали сделан аккуратнее и ниже на пару пикселей */
                state.tsx = 1 - (0.08 * state.intensity); 
                state.tsy = 1 + (0.14 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                slider.classList.remove('flying');
                state.tsx = 1 + (0.06 * state.intensity); 
                state.tsy = 1 - (0.04 * state.intensity); 
            } else {
                state.tsx = state.tsy = 1;
                if (Math.abs(state.vx) < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = state.sy = 1;
        } else {
            state.intensity = Math.abs(newIdx - state.currentIndex) > 1 ? 1.2 : 0.7;
            state.isMoving = true;
        }
        state.currentIndex = newIdx;
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));
    setActive(document.querySelector('.tab-item.active'), true);
    requestAnimationFrame(update);
</script>

</body>
</html>
