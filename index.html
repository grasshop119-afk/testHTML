<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tabbar with Background Switcher</title>
    <style>
        :root {
            --active-accent: #ffffff;
            --inactive-color: rgba(255, 255, 255, 0.75);
            --p-fly-tabbar: rgba(255, 255, 255, 0.3); /* Контур таббара */
            --p-fly-drop: rgba(255, 255, 255, 0.5);   /* Контур капли */
            /* Дефолтные значения темы, будут переписываться JS */
            --tabbar-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            --slider-bg: rgba(0, 0, 0, 0.25);
            --text-shadow: none;
        }

        body {
            margin: 0;
            background-color: #000; /* Фолбек */
            height: 100vh;
            display: flex;
            flex-direction: column; /* Вертикальный лейаут */
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-image 0.5s ease-in-out; /* Плавная смена фона */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Зона контента и таббара */
        .app-view {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Таббар внизу */
            width: 100%;
        }

        .tab-bar-container {
            margin-bottom: calc(25px + env(safe-area-inset-bottom)); /* Чуть больше отступ */
            width: 92%;
            max-width: 400px;
            position: relative;
        }

        .ios-tab-bar {
            position: relative;
            display: flex;
            padding: 4px;
            justify-content: space-around;
            align-items: center;
            border-radius: 38px;
            background: var(--tabbar-bg);
            
            /* --- [НОВОЕ: ТЕНИ ДЛЯ ОБЪЕМА И КОНТРАСТА] --- */
            border: none; /* Убираем бордер, заменяем тенями */
            box-shadow: 
                /* 1. Микро-блик на фаске сверху */
                inset 0 1px 0.5px rgba(255, 255, 255, 0.15),
                /* 2. Тонкая тень снизу для объема */
                inset 0 -1px 0.5px rgba(0, 0, 0, 0.1),
                /* 3. Тонкий темный контур (для супер-светлых фонов) */
                0 0 0 0.5px rgba(0, 0, 0, 0.03),
                /* 4. Большая мягкая тень, отделяющая стекло от фона */
                0 15px 35px rgba(0, 0, 0, 0.2),
                /* 5. Четкая ближняя тень */
                0 4px 10px rgba(0, 0, 0, 0.1);
            /* ------------------------------------------ */

            transition: background 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            
            /* SVG-фильтр в backdrop-filter */
            backdrop-filter: blur(8px) url(#liquid-lens) saturate(140%);
            -webkit-backdrop-filter: blur(8px) saturate(140%);
        }

        .tab-item {
            position: relative;
            z-index: 4;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-wrapper {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background-color: var(--inactive-color);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            transition: background-color 0.25s ease;
        }

        .tab-text {
            font-size: 10px;
            font-weight: 600; /* Чуть жирнее */
            color: var(--inactive-color);
            transition: color 0.25s ease;
            text-shadow: var(--text-shadow); /* Динамическая тень текста */
        }

        .tab-item.active .icon-wrapper { background-color: var(--active-accent); }
        .tab-item.active .tab-text { color: var(--active-accent); }

        .liquid-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--slider-bg);
            border-radius: 34px;
            z-index: 2;
            pointer-events: none;
            box-sizing: border-box;
            
            /* [НОВОЕ: ОБЪЕМ СЛАЙДЕРА] */
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                inset 0 -1px 1px rgba(0, 0, 0, 0.05),
                0 4px 6px rgba(0, 0, 0, 0.15);
            /* -------------------- */
                
            will-change: transform, left, width, background-color, border-color;
            transition: background-color 0.2s ease;
        }

        .liquid-slider.flying {
            background-color: transparent !important; 
            box-shadow: none; 
            /* Добавляем только внешний контур в полете */
            border: 1px solid var(--p-fly-drop) !important;
        }

        /* --- [НОВОЕ: ПЕРЕКЛЮЧАТЕЛЬ ФОНОВ] --- */
        .bg-switcher-container {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .bg-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid white;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
            outline: none;
        }

        .bg-btn:hover, .bg-btn.active {
            transform: scale(1.1);
            border-color: #007aff; /* Акцентный цвет iOS */
        }
        /* ----------------------------------- */
    </style>
</head>

        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />

</svg>

<script>
    const PHYSICS = { pos: { k: 380, d: 38, m: 1 }, scale: { k: 420, d: 24, m: 1 } };
    const slider = document.getElementById('slider');
    const tabBar = document.getElementById('tabBar');
    const tabs = document.querySelectorAll('.tab-item');
    const bgSwitcher = document.getElementById('bgSwitcher');

    // Набор фонов (светлые, темные, пестрые)
    const backgrounds = [
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80', // Синий градиент (оригинал)
        'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80', // Яркий градиент
        'https://images.unsplash.com/photo-1511300636408-a63a89df3482?auto=format&fit=crop&w=1200&q=80', // Светлый фон (белый/розовый)
        'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=1200&q=80', // Грязный пестрый фон
        'https://images.unsplash.com/photo-1550684376-efcbd6e3f031?auto=format&fit=crop&w=1200&q=80', // Почти белый минимализм
        'https://images.unsplash.com/photo-1604328698692-f76ea9498e76?auto=format&fit=crop&w=1200&q=80'  // Темный, глубокий
    ];

    let state = { x: 0, tx: 0, vx: 0, w: 0, tw: 0, vw: 0, sx: 1, tsx: 1, vsx: 0, sy: 1, tsy: 1, vsy: 0, isMoving: false, intensity: 1, currentIndex: 0 };

    // Инициализация переключателя фонов
    function initBackgroundSwitcher() {
        backgrounds.forEach((bg, index) => {
            const btn = document.createElement('button');
            btn.className = 'bg-btn' + (index === 0 ? ' active' : '');
            btn.style.backgroundImage = `url(${bg})`;
            btn.addEventListener('click', () => changeBackground(index));
            bgSwitcher.appendChild(btn);
        });
        changeBackground(0); // Дефолтный фон
    }

    // Смена фона
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let currentBgImg = null;

    function changeBackground(index) {
        document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.bg-btn')[index].classList.add('active');

        const bgUrl = backgrounds[index];
        document.body.style.backgroundImage = `url(${bgUrl})`;

        currentBgImg = new Image();
        currentBgImg.crossOrigin = "anonymous"; 
        currentBgImg.src = bgUrl;

        currentBgImg.onload = () => {
            canvas.width = currentBgImg.width; canvas.height = currentBgImg.height;
            ctx.drawImage(currentBgImg, 0, 0);
            updateDynamicColors(); // Пересчитать цвета под новый фон
        };
    }

    // Анализ цветов под таббаром
    function getPixelColor(clientX, clientY) {
        if (!canvas.width || !currentBgImg) return [255, 255, 255];
        const imgX = Math.min(canvas.width - 1, Math.max(0, Math.floor((clientX / window.innerWidth) * canvas.width)));
        const imgY = Math.min(canvas.height - 1, Math.max(0, Math.floor((clientY / window.innerHeight) * canvas.height)));
        const data = ctx.getImageData(imgX, imgY, 1, 1).data;
        return [data[0], data[1], data[2]];
    }

    function updateDynamicColors() {
        const rct = tabBar.getBoundingClientRect();
        const cx = rct.left + rct.width / 2;
        const cy = rct.top + rct.height / 2;

        const pLeft   = getPixelColor(rct.left + 15, cy);
        const pTop    = getPixelColor(cx, rct.top + 10);
        const pRight  = getPixelColor(rct.right - 15, cy);
        const pBottom = getPixelColor(cx, rct.bottom - 10);

        // Яркость фона по ITU R BT.601
        const avgBrightness = (
            (pLeft[0]*0.299 + pLeft[1]*0.587 + pLeft[2]*0.114) +
            (pTop[0]*0.299 + pTop[1]*0.587 + pTop[2]*0.114) +
            (pRight[0]*0.299 + pRight[1]*0.587 + pRight[2]*0.114) +
            (pBottom[0]*0.299 + pBottom[1]*0.587 + pBottom[2]*0.114)
        ) / 4;

        const rootStyle = document.documentElement.style;

        // --- [СМЕНА ТЕМЫ] ---
        // Изменил порог на 140, чтобы он быстрее уходил в темный режим на пограничных фонах
        if (avgBrightness > 140) { 
            // Светлый фон -> Темная тема таббара
            rootStyle.setProperty('--tabbar-bg', 'linear-gradient(180deg, rgba(10, 10, 12, 0.88) 0%, rgba(6, 6, 8, 0.84) 100%)');
            rootStyle.setProperty('--slider-bg', 'rgba(255, 255, 255, 0.15)'); 
            rootStyle.setProperty('--active-accent', '#ffffff');
            rootStyle.setProperty('--inactive-color', 'rgba(255, 255, 255, 0.5)');
            rootStyle.setProperty('--p-fly-drop', 'rgba(255, 255, 255, 0.4)');
            rootStyle.setProperty('--text-shadow', 'none');
        } else {
            // Темный фон -> Светлая тема таббара
            rootStyle.setProperty('--tabbar-bg', 'linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%)');
            rootStyle.setProperty('--slider-bg', 'rgba(0, 0, 0, 0.3)'); 
            rootStyle.setProperty('--active-accent', '#ffffff');
            rootStyle.setProperty('--inactive-color', 'rgba(255, 255, 255, 0.75)');
            rootStyle.setProperty('--p-fly-drop', 'rgba(255, 255, 255, 0.5)');
            // Добавляем легкую тень тексту для читаемости на пестром фоне
            rootStyle.setProperty('--text-shadow', '0 1px 2px rgba(0,0,0,0.3)');
        }
        // --------------------
    }

    // --- [SPRING PHYSICS] ---
    function spring(curr, tgt, vel, cfg) {
        const acc = (-cfg.k * (curr - tgt) - cfg.d * vel) / cfg.m;
        vel += acc * 0.016;
        return [curr + vel * 0.016, vel];
    }

    function update() {
        const dist = Math.abs(state.x - state.tx);

        if (state.isMoving) {
            if (dist > 15) { 
                slider.classList.add('flying');
                state.tsx = 1 - (0.07 * state.intensity); 
                state.tsy = 1 + (0.13 * state.intensity); 
            } else if (dist <= 15 && dist > 0.5) {
                slider.classList.remove('flying');
                state.tsx = 1 + (0.06 * state.intensity); 
                state.tsy = 1 - (0.04 * state.intensity); 
            } else {
                state.tsx = state.tsy = 1;
                if (Math.abs(state.vx) < 0.2 && Math.abs(state.vsx) < 0.2) {
                    state.isMoving = false;
                    slider.classList.remove('flying');
                }
            }
        }

        [state.x, state.vx] = spring(state.x, state.tx, state.vx, PHYSICS.pos);
        [state.w, state.vw] = spring(state.w, state.tw, state.vw, PHYSICS.pos);
        [state.sx, state.vsx] = spring(state.sx, state.tsx, state.vsx, PHYSICS.scale);
        [state.sy, state.vsy] = spring(state.sy, state.tsy, state.vsy, PHYSICS.scale);

        // Используем transform для анимации (GPU)
        slider.style.left = `${state.x}px`;
        slider.style.width = `${state.w}px`;
        slider.style.transform = `scale(${state.sx}, ${state.sy})`;

        requestAnimationFrame(update);
    }

    function setActive(el, instant = false) {
        const newIdx = parseInt(el.dataset.index);
        tabs.forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        state.tx = el.offsetLeft;
        state.tw = el.offsetWidth;
        
        if (instant) {
            state.x = state.tx; state.w = state.tw;
            state.sx = state.sy = 1;
        } else {
            state.intensity = Math.abs(newIdx - state.currentIndex) > 1 ? 1.2 : 0.7;
            state.isMoving = true;
        }
        state.currentIndex = newIdx;
    }

    // Инициализация
    tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));
    initBackgroundSwitcher();
    setActive(document.querySelector('.tab-item.active'), true);
    
    window.addEventListener('resize', () => {
        updateDynamicColors();
    });

    requestAnimationFrame(update);
</script>

</body>
