<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Liquid Physics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-color: var(--tg-theme-accent-color, #f7a251);
            --bg-color: #000000;
            --menu-bg: #1c1c1e;
            /* Кривая для быстрого старта и плавного замедления */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
        }

        .nav-container {
            width: 90%; 
            max-width: 400px;
            height: 66px;
            background-color: var(--menu-bg);
            border-radius: 40px;
            display: flex;
            position: relative;
            align-items: center;
            padding: 0 5px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .nav-sector {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* ПУЗЫРЬ С ФИЗИКОЙ */
        .active-bubble {
            position: absolute;
            width: calc(33.33% - 10px); 
            height: 56px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 35px;
            left: 5px; 
            top: 5px;
            z-index: 1;
            /* Основная анимация перемещения */
            transition: transform 0.5s var(--ease-out), 
                        width 0.3s ease, 
                        height 0.3s ease, 
                        top 0.3s ease;
            will-change: transform, width, height;
        }

        /* Класс деформации при движении (ниже и шире) */
        .bubble-moving {
            height: 46px; 
            top: 10px;
            width: calc(33.33% + 10px);
        }

        /* Класс пружинки при стопе (выше и уже) */
        .bubble-snap {
            animation: spring 0.4s ease-out;
        }

        @keyframes spring {
            0% { transform: scaleX(1.1) scaleY(0.8); }
            40% { transform: scaleX(0.9) scaleY(1.1); }
            100% { transform: scaleX(1) scaleY(1); }
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            margin-bottom: 3px;
            transition: fill 0.3s, transform 0.3s var(--ease-out);
        }

        .label {
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            font-family: -apple-system, system-ui;
            transition: color 0.3s;
        }

        .nav-sector.active .icon { fill: var(--accent-color); transform: translateY(-2px); }
        .nav-sector.active .label { color: var(--accent-color); }

    </style>
</head>
<body>

    <div class="nav-container">
        <div class="active-bubble" id="bubble"></div>

        <div class="nav-sector active" onclick="navigate(0)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21.6,11.4l-9-7.6c-0.4-0.3-0.9-0.3-1.2,0l-9,7.6c-0.3,0.3-0.4,0.7-0.1,1.1c0.1,0.2,0.3,0.3,0.6,0.3H5v7c0,0.6,0.4,1,1,1h4v-5h4v5h4c0.6,0,1-0.4,1-1v-7h1.1c0.4,0,0.7-0.2,0.9-0.5C22,12.1,21.9,11.7,21.6,11.4z"/></svg>
            <span class="label">Дом</span>
        </div>

        <div class="nav-sector" onclick="navigate(1)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22,9.2l-7.2-0.6L12,2L9.2,8.6L2,9.2l5.5,4.7l-1.6,7L12,17.3l6.1,3.7l-1.6-7L22,9.2z"/></svg>
            <span class="label">Избранное</span>
        </div>

        <div class="nav-sector" onclick="navigate(2)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3,6h18v2H3V6z M3,11h18v2H3V11z M3,16h18v2H3V16z"/></svg>
            <span class="label">Меню</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const bubble = document.getElementById('bubble');
        const sectors = document.querySelectorAll('.nav-sector');
        let isMoving = false;

        function navigate(index) {
            if (isMoving) return;
            isMoving = true;

            // 1. СТАРТ: Деформируем пузырь (шире и ниже)
            bubble.classList.add('bubble-moving');
            
            // 2. ПЕРЕМЕЩЕНИЕ
            bubble.style.transform = `translateX(${index * 100}%)`;

            // Вибрация
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            // Управление классами текста
            sectors.forEach((s, i) => {
                s.classList.toggle('active', i === index);
            });

            // 3. ФИНИШ: Через небольшую паузу убираем деформацию и даем пружинку
            setTimeout(() => {
                bubble.classList.remove('bubble-moving');
                bubble.classList.add('bubble-snap');
                
                setTimeout(() => {
                    bubble.classList.remove('bubble-snap');
                    isMoving = false;
                }, 400); // Время анимации пружинки
            }, 200); // Момент, когда пузырь почти долетел
        }

        window.oncontextmenu = (e) => e.preventDefault();
    </script>
</body>
</html>
