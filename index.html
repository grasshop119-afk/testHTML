<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWGOH Guild App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-sec-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-accent: var(--tg-theme-button-color, #0a84ff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            margin: 0;
            padding: 0;
            padding-bottom: calc(80px + env(safe-area-inset-bottom)); /* Место под таб-бар */
            overflow-x: hidden;
        }

        /* Fullscreen Header */
        header {
            padding: calc(20px + env(safe-area-inset-top)) 20px 10px;
            background: var(--tg-bg);
        }

        h1 { font-size: 34px; font-weight: 700; margin: 0; }

        .content-section { display: none; padding: 0 16px; animation: fadeIn 0.3s ease; }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Энергия и Аналитика - Apple Style Widgets */
        .widget-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .widget {
            background: var(--tg-sec-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .widget-label { font-size: 12px; color: var(--tg-hint); font-weight: 600; text-transform: uppercase; }
        .widget-value { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--tg-accent); }

        /* Списки и карточки */
        .apple-list {
            background: var(--tg-sec-bg);
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }

        .list-row {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(142, 142, 147, 0.2);
        }
        .list-row:last-child { border-bottom: none; }

        /* Нижняя панель навигации (Tab Bar) */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + env(safe-area-inset-bottom));
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--tg-hint);
            text-decoration: none;
            font-size: 10px;
            width: 25%;
        }

        .tab-item.active { color: var(--tg-accent); }

        .tab-icon { font-size: 24px; margin-bottom: 4px; }

        /* Таблицы для легенд */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .data-table td { padding: 12px 0; border-bottom: 0.5px solid var(--tg-hint); font-size: 15px; }

    </style>
</head>
<body>

    <header>
        <h1 id="page-title">Главная</h1>
    </header>

    <div id="home" class="content-section active">
        <div class="widget-row">
            <div class="widget">
                <span class="widget-label">Энергия</span>
                <span class="widget-value">600/600</span>
            </div>
            <div class="widget">
                <span class="widget-label">Аналитика</span>
                <span class="widget-value">Top 5</span>
            </div>
        </div>
        
        <div class="apple-list">
            <div class="list-row">
                <span>Статус гильдии</span>
                <span style="color: #34C759;">Активна</span>
            </div>
        </div>
    </div>

    <div id="faq" class="content-section">
        <div class="apple-list">
            <div class="list-row"><b>ГвГ</b> <span style="color: var(--tg-hint)">Территориальные войны</span></div>
            <div class="list-row"><b>ВГ</b> <span style="color: var(--tg-hint)">Война гильдий</span></div>
        </div>
    </div>

    <div id="media" class="content-section">
        <div class="widget-label">Требования на легенд</div>
        <table class="data-table">
            <tr><td>Лея Органа</td><td style="text-align: right;">Relic 8</td></tr>
            <tr><td>Джабба Хатт</td><td style="text-align: right;">Relic 7</td></tr>
        </table>
        <img src="https://via.placeholder.com/400x200/1c1c1e/ffffff?text=Token+Calendar" style="width:100%; border-radius:12px; margin-top:20px;">
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', 'Главная', this)">
            <span class="tab-icon">🏠</span>
            <span>Инфо</span>
        </div>
        <div class="tab-item" onclick="switchTab('faq', 'База знаний', this)">
            <span class="tab-icon">📖</span>
            <span>FAQ</span>
        </div>
        <div class="tab-item" onclick="switchTab('media', 'Гайды', this)">
            <span class="tab-icon">📊</span>
            <span>Таблицы</span>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Включаем полноэкранный режим правильно
        tg.ready();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        } else {
            tg.expand();
        }

        // Применяем цвета темы
        tg.setHeaderColor(tg.themeParams.bg_color);
        tg.setBackgroundColor(tg.themeParams.bg_color);

        // Функция переключения вкладок
        function switchTab(tabId, title, el) {
            // Скрываем все секции
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            // Показываем нужную
            document.getElementById(tabId).classList.add('active');
            // Меняем заголовок
            document.getElementById('page-title').innerText = title;
            // Обновляем активную иконку
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            // Легкая вибрация при клике (Apple style)
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
